<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectra</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="h-screen w-screen bg-[#090d16] text-white flex flex-col">
  <header class="flex justify-between items-center py-4 border-b border-[#2f3f51]">
    <div class="flex items-center">
      <a href="#" class="text-2xl font-bold mr-4">Vectra</a>
      <button class="bg-[#2f3f51] hover:bg-[#4f5f71] px-4 py-2 rounded-md">
        <i class="fas fa-bars"></i>
      </button>
    </div>
    <div class="flex items-center">
      <button class="bg-[#2f3f51] hover:bg-[#4f5f71] px-4 py-2 rounded-md mr-2">
        <i class="fas fa-undo"></i>
      </button>
      <button class="bg-[#2f3f51] hover:bg-[#4f5f71] px-4 py-2 rounded-md mr-2">
        <i class="fas fa-redo"></i>
      </button>
      <button class="bg-[#2f3f51] hover:bg-[#4f5f71] px-4 py-2 rounded-md">
        <i class="fas fa-save"></i>
      </button>
    </div>
  </header>
  <div class="flex flex-grow">
    <nav class="w-64 bg-[#2f3f51] p-4 flex flex-col">
      <h2 class="text-lg font-bold mb-4">Layers</h2>
      <ul>
        <li class="py-2 border-b border-[#4f5f71]">
          <i class="fas fa-layer-group mr-2"></i>
          Layer 1
        </li>
        <li class="py-2 border-b border-[#4f5f71]">
          <i class="fas fa-layer-group mr-2"></i>
          Layer 2
        </li>
        <li class="py-2 border-b border-[#4f5f71]">
          <i class="fas fa-layer-group mr-2"></i>
          Layer 3
        </li>
      </ul>
      <h2 class="text-lg font-bold mt-4 mb-2">Node Editors</h2>
      <ul>
        <li class="py-2 border-b border-[#4f5f71]">
          <i class="fas fa-edit mr-2"></i>
          Node 1
        </li>
        <li class="py-2 border-b border-[#4f5f71]">
          <i class="fas fa-edit mr-2"></i>
          Node 2
        </li>
        <li class="py-2 border-b border-[#4f5f71]">
          <i class="fas fa-edit mr-2"></i>
          Node 3
        </li>
      </ul>
    </nav>
    <main class="flex-grow flex flex-col">
      <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="absolute top-0 left-0 p-4">
        <button class="bg-[#2f3f51] hover:bg-[#4f5f71] px-4 py-2 rounded-md">
          <i class="fas fa-mouse-pointer mr-2"></i>
          Select
        </button>
        <button class="bg-[#2f3f51] hover:bg-[#4f5f71] px-4 py-2 rounded-md ml-2">
          <i class="fas fa-pencil-alt mr-2"></i>
          Draw
        </button>
      </div>
    </main>
    <div class="w-64 bg-[#2f3f51] p-4 flex flex-col absolute right-0 top-0 h-screen">
      <h2 class="text-lg font-bold mb-4">Tool Options</h2>
      <div class="flex flex-col mb-4">
        <label class="block text-gray-400 mb-2">Line Width</label>
        <input type="range" min="1" max="10" value="5">
        <span class="block text-gray-400 mt-2">5</span>
      </div>
      <div class="flex flex-col mb-4">
        <label class="block text-gray-400 mb-2">Color</label>
        <input type="color" value="#000000">
      </div>
    </div>
  </div>
  <footer class="border-t border-[#2f3f51] p-4">
    <div class="flex items-center">
      <i class="fas fa-exclamation-circle text-yellow-500 mr-2"></i>
      <span>Warning: unsaved changes</span>
    </div>
    <div class="flex items-center ml-4">
      <i class="fas fa-check-circle text-green-500 mr-2"></i>
      <span>Backend synchronization: enabled</span>
    </div>
  </footer>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// Core Engine
class VectraEngine {
  constructor() {
    this.state = {
      nodes: [],
      history: [],
      currentHistoryIndex: -1,
    };

    this.localStorageKey = 'vectra-state';

    this.init();
  }

  init() {
    this.loadStateFromLocalStorage();

    this.canvas = document.getElementById('canvas');
    this.ctx = this.canvas.getContext('2d');

    this.toolbar = document.getElementById('toolbar');
    this.sidebar = document.getElementById('sidebar');
    this.viewport = document.getElementById('viewport');
    this.statusPanel = document.getElementById('status-panel');

    this.addEventListeners();
  }

  addEventListeners() {
    this.canvas.addEventListener('click', (e) => this.handleCanvasClick(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleCanvasMouseMove(e));
    this.canvas.addEventListener('mouseup', (e) => this.handleCanvasMouseUp(e));
    this.canvas.addEventListener('mousedown', (e) => this.handleCanvasMouseDown(e));

    this.toolbar.addEventListener('click', (e) => this.handleToolbarClick(e));
    this.sidebar.addEventListener('click', (e) => this.handleSidebarClick(e));
  }

  handleCanvasClick(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    this.addNode(x, y);
  }

  handleCanvasMouseMove(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    this.updateNodePosition(x, y);
  }

  handleCanvasMouseUp(e) {
    this.endNodeDrag();
  }

  handleCanvasMouseDown(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    this.startNodeDrag(x, y);
  }

  handleToolbarClick(e) {
    if (e.target.id === 'undo-button') {
      this.undo();
    } else if (e.target.id === 'redo-button') {
      this.redo();
    } else if (e.target.id === 'export-button') {
      this.exportFile();
    }
  }

  handleSidebarClick(e) {
    if (e.target.id === 'layer-button') {
      this.toggleLayer();
    } else if (e.target.id === 'node-editor-button') {
      this.toggleNodeEditor();
    }
  }

  addNode(x, y) {
    const node = {
      id: Date.now(),
      x,
      y,
      width: 50,
      height: 50,
    };

    this.state.nodes.push(node);
    this.updateState();
  }

  updateNodePosition(x, y) {
    const node = this.state.nodes[this.state.nodes.length - 1];
    node.x = x;
    node.y = y;
    this.updateState();
  }

  endNodeDrag() {
    this.state.nodes[this.state.nodes.length - 1].dragging = false;
    this.updateState();
  }

  startNodeDrag(x, y) {
    const node = this.state.nodes.find((node) => node.x === x && node.y === y);
    if (node) {
      node.dragging = true;
    }
    this.updateState();
  }

  undo() {
    if (this.state.currentHistoryIndex > 0) {
      this.state.currentHistoryIndex--;
      this.state.nodes = this.state.history[this.state.currentHistoryIndex];
      this.updateState();
    }
  }

  redo() {
    if (this.state.currentHistoryIndex < this.state.history.length - 1) {
      this.state.currentHistoryIndex++;
      this.state.nodes = this.state.history[this.state.currentHistoryIndex];
      this.updateState();
    }
  }

  exportFile() {
    const fileFormat = document.getElementById('file-format').value;
    const fileName = document.getElementById('file-name').value;

    if (fileFormat === 'png') {
      this.exportPng(fileName);
    } else if (fileFormat === 'svg') {
      this.exportSvg(fileName);
    } else if (fileFormat === 'json') {
      this.exportJson(fileName);
    }
  }

  exportPng(fileName) {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName + '.png';
      a.click();
    });
  }

  exportSvg(fileName) {
    const svg = document.getElementById('svg');
    const serializer = new XMLSerializer();
    const svgString = serializer.serializeToString(svg);

    const blob = new Blob([svgString], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName + '.svg';
    a.click();
  }

  exportJson(fileName) {
    const json = JSON.stringify(this.state.nodes);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName + '.json';
    a.click();
  }

  updateState() {
    this.state.history.push(JSON.parse(JSON.stringify(this.state.nodes)));
    this.state.currentHistoryIndex++;
    this.saveStateToLocalStorage();
    this.render();
  }

  loadStateFromLocalStorage() {
    const storedState = localStorage.getItem(this.localStorageKey);
    if (storedState) {
      this.state = JSON.parse(storedState);
    }
  }

  saveStateToLocalStorage() {
    localStorage.setItem(this.localStorageKey, JSON.stringify(this.state));
  }

  render() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    this.state.nodes.forEach((node) => {
      this.ctx.fillStyle = 'black';
      this.ctx.fillRect(node.x, node.y, node.width, node.height);
    });
  }
}

const vectraEngine = new VectraEngine();
</script>
</body>
</html>
