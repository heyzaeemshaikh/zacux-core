<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectra</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="h-screen w-screen bg-gray-900 text-gray-100 flex flex-col overflow-hidden" id="vectra-app">
  <!-- Top Toolbar -->
  <nav class="flex justify-between items-center py-2 px-4 bg-gray-800 border-b border-gray-700">
    <div class="flex items-center">
      <button class="mr-2">
        <i class="fas fa-bars text-lg"></i>
      </button>
      <span class="text-lg font-bold">Vectra</span>
    </div>
    <div class="flex items-center">
      <button class="mr-2">
        <i class="fas fa-file text-lg"></i>
      </button>
      <button class="mr-2">
        <i class="fas fa-edit text-lg"></i>
      </button>
      <button class="mr-2">
        <i class="fas fa-share text-lg"></i>
      </button>
      <button class="mr-2">
        <i class="fas fa-cog text-lg"></i>
      </button>
    </div>
  </nav>

  <!-- Left Sidebar -->
  <div class="flex flex-row h-screen">
    <aside class="w-64 bg-gray-800 p-4 border-r border-gray-700">
      <h5 class="text-lg font-bold mb-2">Layers</h5>
      <ul>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group text-lg mr-2"></i>
          Layer 1
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group text-lg mr-2"></i>
          Layer 2
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group text-lg mr-2"></i>
          Layer 3
        </li>
      </ul>
      <h5 class="text-lg font-bold mt-4 mb-2">Assets</h5>
      <ul>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-image text-lg mr-2"></i>
          Image 1
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-image text-lg mr-2"></i>
          Image 2
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-image text-lg mr-2"></i>
          Image 3
        </li>
      </ul>
    </aside>

    <!-- Main Viewport -->
    <main class="flex-1 overflow-hidden">
      <div class="h-screen w-screen p-4">
        <svg class="w-full h-full" id="vectra-canvas"></svg>
      </div>
    </main>

    <!-- Right Sidebar -->
    <aside class="w-64 bg-gray-800 p-4 border-l border-gray-700">
      <h5 class="text-lg font-bold mb-2">Properties</h5>
      <div class="mb-4">
        <label class="block text-gray-400 mb-2">Fill Color</label>
        <input type="color" class="w-full">
      </div>
      <div class="mb-4">
        <label class="block text-gray-400 mb-2">Stroke Color</label>
        <input type="color" class="w-full">
      </div>
      <div class="mb-4">
        <label class="block text-gray-400 mb-2">Stroke Width</label>
        <input type="number" class="w-full">
      </div>
      <h5 class="text-lg font-bold mt-4 mb-2">Node Editing</h5>
      <div class="mb-4">
        <button class="w-full py-2 bg-gray-700 hover:bg-gray-600">
          <i class="fas fa-plus text-lg mr-2"></i>
          Add Node
        </button>
      </div>
      <div class="mb-4">
        <button class="w-full py-2 bg-gray-700 hover:bg-gray-600">
          <i class="fas fa-minus text-lg mr-2"></i>
          Remove Node
        </button>
      </div>
    </aside>
  </div>

  <!-- Status Bar -->
  <footer class="bg-gray-800 p-2 border-t border-gray-700">
    <div class="flex justify-between items-center">
      <span>Zoom: 100%</span>
      <span>Selection: None</span>
      <span>Undo/Redo: <i class="fas fa-undo text-lg mr-2"></i> <i class="fas fa-redo text-lg"></i></span>
    </div>
  </footer>

  <!-- Floating Panels -->
  <div class="fixed bottom-0 right-0 mb-4 mr-4">
    <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 rounded">
      <i class="fas fa-question-circle text-lg mr-2"></i>
      Help
    </button>
  </div>
  <div class="fixed top-0 right-0 mt-4 mr-4">
    <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 rounded">
      <i class="fas fa-cog text-lg mr-2"></i>
      Settings
    </button>
  </div>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// vectra.js
class Vectra {
  constructor() {
    this.state = {
      layers: [],
      nodes: [],
      selectedNode: null,
      undoHistory: [],
      redoHistory: []
    };

    this.toolbar = document.getElementById('toolbar');
    this.layersSidebar = document.getElementById('layers-sidebar');
    this.assetsSidebar = document.getElementById('assets-sidebar');
    this.viewport = document.getElementById('viewport');
    this.propertiesSidebar = document.getElementById('properties-sidebar');
    this.statusPanel = document.getElementById('status-panel');
    this.canvas = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    this.canvas.setAttribute('id', 'vectra-canvas');

    this.viewport.appendChild(this.canvas);

    this.loadStateFromLocalStorage();

    this.addEventListeners();
    this.renderCanvas();
    this.renderLayersSidebar();
    this.renderAssetsSidebar();
    this.renderPropertiesSidebar();
    this.renderToolbar();

    this.worker = new Worker('worker.js');
    this.worker.onmessage = (event) => {
      if (event.data.type === 'render') {
        this.renderCanvas();
      }
    };
  }

  addEventListeners() {
    this.canvas.addEventListener('click', (event) => {
      this.handleCanvasClick(event);
    });

    this.canvas.addEventListener('mousemove', (event) => {
      this.handleCanvasMouseMove(event);
    });

    this.layersSidebar.addEventListener('click', (event) => {
      if (event.target.classList.contains('layer')) {
        this.handleLayerClick(event.target);
      }
    });

    this.assetsSidebar.addEventListener('click', (event) => {
      if (event.target.classList.contains('asset')) {
        this.handleAssetClick(event.target);
      }
    });

    this.propertiesSidebar.addEventListener('input', (event) => {
      if (event.target.classList.contains('node-prop')) {
        this.handleNodePropChange(event.target);
      }
    });

    this.toolbar.addEventListener('click', (event) => {
      if (event.target.classList.contains('tool')) {
        this.handleToolClick(event.target);
      }
    });
  }

  handleCanvasClick(event) {
    const rect = this.canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    const node = this.findNodeAt(x, y);
    if (node) {
      this.selectNode(node);
    } else {
      this.deselectNode();
    }
  }

  handleCanvasMouseMove(event) {
    const rect = this.canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    this.updateNodePosition(x, y);
  }

  handleLayerClick(layer) {
    this.selectLayer(layer);
  }

  handleAssetClick(asset) {
    this.addAssetToCanvas(asset);
  }

  handleNodePropChange(prop) {
    const node = this.state.selectedNode;
    if (node) {
      node[prop.name] = prop.value;
      this.renderCanvas();
    }
  }

  handleToolClick(tool) {
    switch (tool.dataset.tool) {
      case 'undo':
        this.undo();
        break;
      case 'redo':
        this.redo();
        break;
      case 'export':
        this.exportCanvas();
        break;
      default:
        console.error('Unknown tool');
    }
  }

  renderCanvas() {
    const svg = this.canvas;
    svg.innerHTML = '';

    this.state.layers.forEach((layer) => {
      layer.nodes.forEach((node) => {
        const shape = document.createElementNS('http://www.w3.org/2000/svg', node.type);
        shape.setAttribute('x', node.x);
        shape.setAttribute('y', node.y);
        shape.setAttribute('width', node.width);
        shape.setAttribute('height', node.height);
        shape.setAttribute('fill', node.fill);

        svg.appendChild(shape);
      });
    });
  }

  renderLayersSidebar() {
    const sidebar = this.layersSidebar;
    sidebar.innerHTML = '';

    this.state.layers.forEach((layer) => {
      const layerElement = document.createElement('div');
      layerElement.classList.add('layer');
      layerElement.textContent = layer.name;

      sidebar.appendChild(layerElement);
    });
  }

  renderAssetsSidebar() {
    const sidebar = this.assetsSidebar;
    sidebar.innerHTML = '';

    this.state.assets.forEach((asset) => {
      const assetElement = document.createElement('div');
      assetElement.classList.add('asset');
      assetElement.textContent = asset.name;

      sidebar.appendChild(assetElement);
    });
  }

  renderPropertiesSidebar() {
    const sidebar = this.propertiesSidebar;
    sidebar.innerHTML = '';

    if (this.state.selectedNode) {
      Object.keys(this.state.selectedNode).forEach((prop) => {
        const propElement = document.createElement('input');
        propElement.classList.add('node-prop');
        propElement.name = prop;
        propElement.value = this.state.selectedNode[prop];

        sidebar.appendChild(propElement);
      });
    }
  }

  renderToolbar() {
    const toolbar = this.toolbar;
    toolbar.innerHTML = '';

    const undoButton = document.createElement('button');
    undoButton.classList.add('tool');
    undoButton.textContent = 'Undo';
    undoButton.dataset.tool = 'undo';

    const redoButton = document.createElement('button');
    redoButton.classList.add('tool');
    redoButton.textContent = 'Redo';
    redoButton.dataset.tool = 'redo';

    const exportButton = document.createElement('button');
    exportButton.classList.add('tool');
    exportButton.textContent = 'Export';
    exportButton.dataset.tool = 'export';

    toolbar.appendChild(undoButton);
    toolbar.appendChild(redoButton);
    toolbar.appendChild(exportButton);
  }

  loadStateFromLocalStorage() {
    const storedState = localStorage.getItem('vectra-state');
    if (storedState) {
      this.state = JSON.parse(storedState);
    }
  }

  saveStateToLocalStorage() {
    const storedState = JSON.stringify(this.state);
    localStorage.setItem('vectra-state', storedState);
  }

  undo() {
    if (this.state.undoHistory.length > 0) {
      const previousState = this.state.undoHistory.pop();
      this.state = previousState;
      this.renderCanvas();
    }
  }

  redo() {
    if (this.state.redoHistory.length > 0) {
      const nextState = this.state.redoHistory.pop();
      this.state = nextState;
      this.renderCanvas();
    }
  }

  exportCanvas() {
    const svg = this.canvas.outerHTML;
    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vectra-export.svg';
    a.click();
  }

  selectNode(node) {
    this.state.selectedNode = node;
    this.renderPropertiesSidebar();
  }

  deselectNode() {
    this.state.selectedNode = null;
    this.renderPropertiesSidebar();
  }

  selectLayer(layer) {
    this.state.selectedLayer = layer;
    this.renderCanvas();
  }

  addAssetToCanvas(asset) {
    const node = {
      type: asset.type,
      x: 0,
      y: 0,
      width: asset.width,
      height: asset.height,
      fill: asset.fill
    };

    this.state.layers[0].nodes.push(node);
    this.renderCanvas();
  }

  findNodeAt(x, y) {
    for (const layer of this.state.layers) {
      for (const node of layer.nodes) {
        if (x >= node.x && x <= node.x + node.width && y >= node.y && y <= node.y + node.height) {
          return node;
        }
      }
    }

    return null;
  }

  updateNodePosition(x, y) {
    if (this.state.selectedNode) {
      this.state.selectedNode.x = x;
      this.state.selectedNode.y = y;
      this.renderCanvas();
    }
  }
}

const vectra = new Vectra();
</script>
</body>
</html>
