<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectra</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="bg-[#090d16] h-screen">
  <!-- Top Toolbar -->
  <nav class="flex justify-between bg-[#111727] py-2 px-4 text-white border-b border-[#2c3e50]">
    <div class="flex items-center">
      <h1 class="text-lg font-bold mr-4">Vectra</h1>
      <button class="btn-tool btn-tool--active">
        <i class="fas fa-file fa-lg mr-2"></i> File
      </button>
      <button class="btn-tool">
        <i class="fas fa-edit fa-lg mr-2"></i> Edit
      </button>
      <button class="btn-tool">
        <i class="fas fa-object-ungroup fa-lg mr-2"></i> Layers
      </button>
    </div>
    <div class="flex items-center">
      <button class="btn-tool">
        <i class="fas fa-undo fa-lg mr-2"></i> Undo
      </button>
      <button class="btn-tool">
        <i class="fas fa-redo fa-lg mr-2"></i> Redo
      </button>
      <button class="btn-tool">
        <i class="fas fa-save fa-lg mr-2"></i> Save
      </button>
    </div>
  </nav>

  <!-- Left Sidebar -->
  <aside class="fixed h-screen top-12 left-0 w-64 bg-[#111727] py-4 px-2 border-r border-[#2c3e50]">
    <h2 class="text-lg font-bold mb-2">Layers</h2>
    <ul>
      <li class="layer-item py-2 px-2 cursor-pointer hover:bg-[#2c3e50]">
        <i class="fas fa-layer-group fa-lg mr-2"></i> Layer 1
      </li>
      <li class="layer-item py-2 px-2 cursor-pointer hover:bg-[#2c3e50]">
        <i class="fas fa-layer-group fa-lg mr-2"></i> Layer 2
      </li>
    </ul>
    <h2 class="text-lg font-bold mt-4 mb-2">Node Editor</h2>
    <div class="node-editor py-2 px-2">
      <button class="btn-node btn-node--active">
        <i class="fas fa-circle fa-lg mr-2"></i> Circle
      </button>
      <button class="btn-node">
        <i class="fas fa-square fa-lg mr-2"></i> Square
      </button>
      <button class="btn-node">
        <i class="fas fa-line fa-lg mr-2"></i> Line
      </button>
    </div>
  </aside>

  <!-- Main Viewport -->
  <div class="main-viewport flex-1 h-screen p-4">
    <canvas class="canvas w-full h-full" width="800" height="600"></canvas>
  </div>

  <!-- Floating Side Panels -->
  <div class="float-panel top-12 right-4 w-48 bg-[#111727] py-2 px-2 border border-[#2c3e50]">
    <h2 class="text-lg font-bold mb-2">Tool Options</h2>
    <label class="block py-2">
      <span class="text-sm font-bold">Stroke Color:</span>
      <input type="color" class="ml-2" value="#ffffff">
    </label>
    <label class="block py-2">
      <span class="text-sm font-bold">Fill Color:</span>
      <input type="color" class="ml-2" value="#ffffff">
    </label>
  </div>

  <!-- Bottom Status Panel -->
  <footer class="footer bg-[#111727] py-2 px-4 border-t border-[#2c3e50]">
    <div class="flex justify-between items-center">
      <span class="text-sm font-bold">Coords: X: 100, Y: 200</span>
      <span class="text-sm font-bold">Zoom: 100%</span>
      <span class="text-sm font-bold">Grid Size: 10px</span>
    </div>
  </footer>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// Import required libraries
import { createRoot } from 'react-dom/client';
import { createStore, combineReducers, applyMiddleware } from 'redux';
import { Provider } from 'react-redux';
import { composeWithDevTools } from 'redux-devtools-extension';
import React from 'react';

// Define the initial state
const initialState = {
  nodes: [],
  selectedNode: null,
  undoHistory: [],
  redoHistory: []
};

// Define the reducers
const nodeReducer = (state = initialState, action) => {
  switch (action.type) {
    case 'ADD_NODE':
      return { ...state, nodes: [...state.nodes, action.node] };
    case 'SELECT_NODE':
      return { ...state, selectedNode: action.node };
    case 'UNDO':
      return { ...state, nodes: state.undoHistory.pop() };
    case 'REDO':
      return { ...state, nodes: state.redoHistory.pop() };
    default:
      return state;
  }
};

const rootReducer = combineReducers({
  nodes: nodeReducer
});

// Create the Redux store
const store = createStore(rootReducer, composeWithDevTools(applyMiddleware()));

// Define the Vectra app component
class VectraApp extends React.Component {
  constructor(props) {
    super(props);
    this.state = {
      nodes: [],
      selectedNode: null
    };
    this.handleNodeAdd = this.handleNodeAdd.bind(this);
    this.handleNodeSelect = this.handleNodeSelect.bind(this);
    this.handleUndo = this.handleUndo.bind(this);
    this.handleRedo = this.handleRedo.bind(this);
  }

  handleNodeAdd(node) {
    store.dispatch({ type: 'ADD_NODE', node });
  }

  handleNodeSelect(node) {
    store.dispatch({ type: 'SELECT_NODE', node });
  }

  handleUndo() {
    store.dispatch({ type: 'UNDO' });
  }

  handleRedo() {
    store.dispatch({ type: 'REDO' });
  }

  render() {
    return (
      <div>
        <TopToolbar onNodeAdd={this.handleNodeAdd} onUndo={this.handleUndo} onRedo={this.handleRedo} />
        <LeftSidebar nodes={store.getState().nodes} onSelect={this.handleNodeSelect} />
        <MainViewport nodes={store.getState().nodes} selectedNode={store.getState().selectedNode} />
        <BottomStatusPanel />
      </div>
    );
  }
}

// Define the TopToolbar component
class TopToolbar extends React.Component {
  constructor(props) {
    super(props);
    this.handleNodeAdd = this.handleNodeAdd.bind(this);
    this.handleUndo = this.handleUndo.bind(this);
    this.handleRedo = this.handleRedo.bind(this);
  }

  handleNodeAdd() {
    this.props.onNodeAdd({ id: Math.random(), x: 0, y: 0 });
  }

  handleUndo() {
    this.props.onUndo();
  }

  handleRedo() {
    this.props.onRedo();
  }

  render() {
    return (
      <div>
        <button onClick={this.handleNodeAdd}>Add Node</button>
        <button onClick={this.handleUndo}>Undo</button>
        <button onClick={this.handleRedo}>Redo</button>
      </div>
    );
  }
}

// Define the LeftSidebar component
class LeftSidebar extends React.Component {
  constructor(props) {
    super(props);
    this.handleSelect = this.handleSelect.bind(this);
  }

  handleSelect(node) {
    this.props.onSelect(node);
  }

  render() {
    return (
      <div>
        <h2>Layers</h2>
        <ul>
          {this.props.nodes.map(node => (
            <li key={node.id} onClick={() => this.handleSelect(node)}>
              {node.id}
            </li>
          ))}
        </ul>
      </div>
    );
  }
}

// Define the MainViewport component
class MainViewport extends React.Component {
  constructor(props) {
    super(props);
    this.handleMouseDown = this.handleMouseDown.bind(this);
    this.handleMouseMove = this.handleMouseMove.bind(this);
    this.handleMouseUp = this.handleMouseUp.bind(this);
  }

  handleMouseDown(event) {
    console.log('Mouse down:', event);
  }

  handleMouseMove(event) {
    console.log('Mouse move:', event);
  }

  handleMouseUp(event) {
    console.log('Mouse up:', event);
  }

  render() {
    return (
      <div>
        <svg width="800" height="600" onMouseDown={this.handleMouseDown} onMouseMove={this.handleMouseMove} onMouseUp={this.handleMouseUp}>
          {this.props.nodes.map(node => (
            <circle key={node.id} cx={node.x} cy={node.y} r="10" fill="black" />
          ))}
        </svg>
      </div>
    );
  }
}

// Define the BottomStatusPanel component
class BottomStatusPanel extends React.Component {
  render() {
    return (
      <div>
        <p>Status: Ready</p>
      </div>
    );
  }
}

// Define the file export logic
function exportFile(type, data) {
  const blob = new Blob([data], { type: `image/${type}` });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `vectra.${type}`;
  a.click();
}

// Define the export handlers
function handleExportPNG() {
  const svg = document.querySelector('svg');
  const svgData = new XMLSerializer().serializeToString(svg);
  const canvas = document.createElement('canvas');
  canvas.width = 800;
  canvas.height = 600;
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = function() {
    ctx.drawImage(img, 0, 0);
    const pngData = canvas.toDataURL('image/png');
    exportFile('png', pngData.substring(22));
  };
  img.src = `data:image/svg+xml,${svgData}`;
}

function handleExportSVG() {
  const svg = document.querySelector('svg');
  const svgData = new XMLSerializer().serializeToString(svg);
  exportFile('svg', svgData);
}

function handleExportJSON() {
  const nodes = store.getState().nodes;
  const jsonData = JSON.stringify(nodes);
  exportFile('json', jsonData);
}

// Add event listeners for export buttons
document.addEventListener('DOMContentLoaded', function() {
  const exportButtons = document.querySelectorAll('.export-button');
  exportButtons.forEach(button => {
    button.addEventListener('click', function() {
      if (button.dataset.type === 'png') {
        handleExportPNG();
      } else if (button.dataset.type === 'svg') {
        handleExportSVG();
      } else if (button.dataset.type === 'json') {
        handleExportJSON();
      }
    });
  });
});

// Render the Vectra app
const root = createRoot(document.getElementById('root'));
root.render(
  <Provider store={store}>
    <VectraApp />
  </Provider>
);
</script>
</body>
</html>
