<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VectorForge</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="bg-gray-900 text-gray-100 h-screen overflow-hidden">
  <!-- Top Toolbar -->
  <nav class="flex justify-between bg-gray-800 p-4 border-b border-gray-700">
    <div class="flex items-center">
      <a href="#" class="text-lg font-bold mr-4">VectorForge</a>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mr-2">
        <i class="fas fa-file fa-sm mr-2"></i> File
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mr-2">
        <i class="fas fa-edit fa-sm mr-2"></i> Edit
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mr-2">
        <i class="fas fa-object-ungroup fa-sm mr-2"></i> Layers
      </button>
    </div>
    <div class="flex items-center">
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mr-2">
        <i class="fas fa-undo fa-sm mr-2"></i> Undo
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mr-2">
        <i class="fas fa-redo fa-sm mr-2"></i> Redo
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mr-2">
        <i class="fas fa-save fa-sm mr-2"></i> Save
      </button>
    </div>
  </nav>

  <!-- Left Sidebar -->
  <aside class="w-64 bg-gray-800 p-4 border-r border-gray-700 h-screen fixed top-14 left-0">
    <h5 class="text-lg font-bold mb-4">Layers</h5>
    <ul>
      <li class="py-2 border-b border-gray-700">
        <i class="fas fa-layer-group fa-sm mr-2"></i> Layer 1
      </li>
      <li class="py-2 border-b border-gray-700">
        <i class="fas fa-layer-group fa-sm mr-2"></i> Layer 2
      </li>
      <li class="py-2 border-b border-gray-700">
        <i class="fas fa-layer-group fa-sm mr-2"></i> Layer 3
      </li>
    </ul>
    <h5 class="text-lg font-bold mt-4 mb-4">Assets</h5>
    <ul>
      <li class="py-2 border-b border-gray-700">
        <i class="fas fa-image fa-sm mr-2"></i> Image 1
      </li>
      <li class="py-2 border-b border-gray-700">
        <i class="fas fa-image fa-sm mr-2"></i> Image 2
      </li>
      <li class="py-2 border-b border-gray-700">
        <i class="fas fa-image fa-sm mr-2"></i> Image 3
      </li>
    </ul>
  </aside>

  <!-- Main Viewport -->
  <main class="ml-64 p-4 h-screen overflow-auto">
    <svg class="w-full h-full" viewBox="0 0 100 100">
      <!-- Canvas Rendering -->
    </svg>
  </main>

  <!-- Bottom Status Panel -->
  <footer class="bg-gray-800 p-4 border-t border-gray-700 fixed bottom-0 left-0 right-0">
    <div class="flex justify-between items-center">
      <span class="text-sm">Status: Ready</span>
      <span class="text-sm">Zoom: 100%</span>
      <span class="text-sm">Selection: None</span>
    </div>
  </footer>

  <!-- Floating Side Panels -->
  <div class="fixed top-14 right-4">
    <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mb-2">
      <i class="fas fa-cog fa-sm mr-2"></i> Settings
    </button>
    <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mb-2">
      <i class="fas fa-question fa-sm mr-2"></i> Help
    </button>
  </div>

  <!-- Tool Options -->
  <div class="fixed top-14 left-64">
    <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mb-2">
      <i class="fas fa-pencil-alt fa-sm mr-2"></i> Pencil
    </button>
    <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mb-2">
      <i class="fas fa-brush fa-sm mr-2"></i> Brush
    </button>
    <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mb-2">
      <i class="fas fa-eraser fa-sm mr-2"></i> Eraser
    </button>
  </div>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// VectorForge Engine
class VectorForge {
  constructor(canvasId) {
    this.canvasId = canvasId;
    this.canvas = document.getElementById(canvasId);
    this.ctx = this.canvas.getContext('2d');
    this.state = {
      layers: [],
      selectedLayer: null,
      assets: [],
      undoHistory: [],
      redoHistory: []
    };
    this.local Storage = window.localStorage;
    this.initEventListeners();
    this.initState();
  }

  // Initialize event listeners for canvas interactions
  initEventListeners() {
    this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
    this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));
  }

  // Initialize state from local storage
  initState() {
    const storedState = this.localStorage.getItem('vector-forge-state');
    if (storedState) {
      this.state = JSON.parse(storedState);
    }
  }

  // Handle mouse down event
  handleMouseDown(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    this.state.selectedLayer = this.getLayerAt(x, y);
    this.state.undoHistory.push(JSON.parse(JSON.stringify(this.state)));
  }

  // Handle mouse move event
  handleMouseMove(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    if (this.state.selectedLayer) {
      this.state.selectedLayer.x = x;
      this.state.selectedLayer.y = y;
      this.renderCanvas();
    }
  }

  // Handle mouse up event
  handleMouseUp(e) {
    this.state.redoHistory = [];
  }

  // Get layer at position (x, y)
  getLayerAt(x, y) {
    for (const layer of this.state.layers) {
      if (layer.x <= x && layer.x + layer.width >= x && layer.y <= y && layer.y + layer.height >= y) {
        return layer;
      }
    }
    return null;
  }

  // Render canvas
  renderCanvas() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    for (const layer of this.state.layers) {
      this.ctx.fillStyle = layer.color;
      this.ctx.fillRect(layer.x, layer.y, layer.width, layer.height);
    }
    this.local Storage.setItem('vector-forge-state', JSON.stringify(this.state));
  }

  // Undo last action
  undo() {
    if (this.state.undoHistory.length > 0) {
      this.state = this.state.undoHistory.pop();
      this.renderCanvas();
    }
  }

  // Redo last undone action
  redo() {
    if (this.state.redoHistory.length > 0) {
      this.state = this.state.redoHistory.pop();
      this.renderCanvas();
    }
  }

  // Export canvas as PNG
  exportAsPng() {
    const link = document.createElement('a');
    link.href = this.canvas.toDataURL('image/png');
    link.download = 'vector-forge-export.png';
    link.click();
  }

  // Export canvas as SVG
  exportAsSvg() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', this.canvas.width);
    svg.setAttribute('height', this.canvas.height);
    for (const layer of this.state.layers) {
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', layer.x);
      rect.setAttribute('y', layer.y);
      rect.setAttribute('width', layer.width);
      rect.setAttribute('height', layer.height);
      rect.setAttribute('fill', layer.color);
      svg.appendChild(rect);
    }
    const serializer = new XMLSerializer();
    const svgString = serializer.serializeToString(svg);
    const link = document.createElement('a');
    link.href = 'data:image/svg+xml,' + encodeURIComponent(svgString);
    link.download = 'vector-forge-export.svg';
    link.click();
  }

  // Export canvas as JSON
  exportAsJson() {
    const json = JSON.stringify(this.state);
    const link = document.createElement('a');
    link.href = 'data:application/json,' + encodeURIComponent(json);
    link.download = 'vector-forge-export.json';
    link.click();
  }
}

// Create a new instance of VectorForge
const vectorForge = new VectorForge('canvas');

// Initialize UI components
const toolbar = document.getElementById('toolbar');
const layersSidebar = document.getElementById('layers-sidebar');
const assetsSidebar = document.getElementById('assets-sidebar');
const statusPanel = document.getElementById('status-panel');

// Add event listeners for UI components
toolbar.addEventListener('click', (e) => {
  if (e.target.id === 'undo-button') {
    vectorForge.undo();
  } else if (e.target.id === 'redo-button') {
    vectorForge.redo();
  } else if (e.target.id === 'export-as-png-button') {
    vectorForge.exportAsPng();
  } else if (e.target.id === 'export-as-svg-button') {
    vectorForge.exportAsSvg();
  } else if (e.target.id === 'export-as-json-button') {
    vectorForge.exportAsJson();
  }
});

layersSidebar.addEventListener('click', (e) => {
  if (e.target.id === 'add-layer-button') {
    vectorForge.state.layers.push({
      x: 0,
      y: 0,
      width: 100,
      height: 100,
      color: '#ff0000'
    });
    vectorForge.renderCanvas();
  }
});

assetsSidebar.addEventListener('click', (e) => {
  if (e.target.id === 'add-asset-button') {
    vectorForge.state.assets.push({
      name: 'New Asset',
      type: 'image'
    });
  }
});

statusPanel.addEventListener('click', (e) => {
  if (e.target.id === 'clear-undo-history-button') {
    vectorForge.state.undoHistory = [];
  }
});
</script>
</body>
</html>
