<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectra</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="h-screen w-screen bg-[#090d16] text-white flex flex-col">
  <header class="top-toolbar bg-[#1a2332] py-2 px-4 flex justify-between items-center border-b border-[#2b3a4a]">
    <div class="app-name flex items-center">
      <i class="fa fa-vector-square mr-2" aria-hidden="true"></i>
      <span>Vectra</span>
    </div>
    <div class="toolbar-buttons flex items-center">
      <button class="tool-button bg-[#2b3a4a] hover:bg-[#3a506b] py-1 px-2 mx-1 rounded" title="New File">
        <i class="fa fa-file-o" aria-hidden="true"></i>
      </button>
      <button class="tool-button bg-[#2b3a4a] hover:bg-[#3a506b] py-1 px-2 mx-1 rounded" title="Open File">
        <i class="fa fa-folder-open-o" aria-hidden="true"></i>
      </button>
      <button class="tool-button bg-[#2b3a4a] hover:bg-[#3a506b] py-1 px-2 mx-1 rounded" title="Save File">
        <i class="fa fa-save" aria-hidden="true"></i>
      </button>
      <button class="tool-button bg-[#2b3a4a] hover:bg-[#3a506b] py-1 px-2 mx-1 rounded" title="Settings">
        <i class="fa fa-cog" aria-hidden="true"></i>
      </button>
    </div>
  </header>
  <div class="main-workspace flex flex-1 overflow-hidden">
    <aside class="left-sidebar bg-[#1a2332] py-2 px-4 w-64 border-r border-[#2b3a4a]">
      <h5 class="sidebar-header mb-2">Layers</h5>
      <ul class="layer-list">
        <li class="layer-item py-1 px-2 hover:bg-[#2b3a4a] rounded">
          <i class="fa fa-layer-group mr-2" aria-hidden="true"></i>
          <span>Layer 1</span>
        </li>
        <li class="layer-item py-1 px-2 hover:bg-[#2b3a4a] rounded">
          <i class="fa fa-layer-group mr-2" aria-hidden="true"></i>
          <span>Layer 2</span>
        </li>
        <li class="layer-item py-1 px-2 hover:bg-[#2b3a4a] rounded">
          <i class="fa fa-layer-group mr-2" aria-hidden="true"></i>
          <span>Layer 3</span>
        </li>
      </ul>
      <button class="add-layer-button bg-[#2b3a4a] hover:bg-[#3a506b] py-1 px-2 mt-2 rounded" title="Add Layer">
        <i class="fa fa-plus" aria-hidden="true"></i>
      </button>
    </aside>
    <main class="central-viewport flex-1 overflow-hidden relative">
      <canvas class="canvas absolute top-0 left-0 w-full h-full bg-[#2b3a4a]" width="800" height="600"></canvas>
      <div class="node-editing-tools absolute top-0 left-0 w-full h-full">
        <button class="tool-button bg-[#2b3a4a] hover:bg-[#3a506b] py-1 px-2 absolute top-4 left-4 rounded" title="Select Tool">
          <i class="fa fa-mouse-pointer" aria-hidden="true"></i>
        </button>
        <button class="tool-button bg-[#2b3a4a] hover:bg-[#3a506b] py-1 px-2 absolute top-4 left-12 rounded" title="Rect Tool">
          <i class="fa fa-square-o" aria-hidden="true"></i>
        </button>
        <button class="tool-button bg-[#2b3a4a] hover:bg-[#3a506b] py-1 px-2 absolute top-4 left-20 rounded" title="Ellipse Tool">
          <i class="fa fa-circle-o" aria-hidden="true"></i>
        </button>
      </div>
    </main>
    <aside class="right-sidebar bg-[#1a2332] py-2 px-4 w-64 border-l border-[#2b3a4a]">
      <h5 class="sidebar-header mb-2">Properties</h5>
      <ul class="property-list">
        <li class="property-item py-1 px-2 hover:bg-[#2b3a4a] rounded">
          <label class="block text-sm">Fill Color</label>
          <input class="property-input w-full py-1 px-2" type="color" value="#ffffff">
        </li>
        <li class="property-item py-1 px-2 hover:bg-[#2b3a4a] rounded">
          <label class="block text-sm">Stroke Color</label>
          <input class="property-input w-full py-1 px-2" type="color" value="#000000">
        </li>
        <li class="property-item py-1 px-2 hover:bg-[#2b3a4a] rounded">
          <label class="block text-sm">Stroke Width</label>
          <input class="property-input w-full py-1 px-2" type="number" value="1">
        </li>
      </ul>
    </aside>
  </div>
  <footer class="status-panel bg-[#1a2332] py-2 px-4 border-t border-[#2b3a4a]">
    <div class="status-message flex items-center">
      <i class="fa fa-info-circle mr-2" aria-hidden="true"></i>
      <span>Ready</span>
    </div>
    <div class="status-indicators flex items-center">
      <i class="fa fa-circle-o mr-1 text-green-500" aria-hidden="true"></i>
      <i class="fa fa-circle-o mr-1 text-yellow-500" aria-hidden="true"></i>
      <i class="fa fa-circle-o mr-1 text-red-500" aria-hidden="true"></i>
    </div>
  </footer>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// Vectra Vector Graphics Editor Engine

// Import required libraries
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');

// Define the state management store
class Store {
  constructor() {
    this.state = {
      layers: [],
      selectedLayer: null,
      undoHistory: [],
      redoHistory: []
    };
    this.listeners = [];
  }

  dispatch(action) {
    switch (action.type) {
      case 'ADD_LAYER':
        this.state.layers.push(action.layer);
        break;
      case 'SELECT_LAYER':
        this.state.selectedLayer = action.layer;
        break;
      case 'UNDO':
        if (this.state.undoHistory.length > 0) {
          const previousState = this.state.undoHistory.pop();
          this.state = previousState;
        }
        break;
      case 'REDO':
        if (this.state.redoHistory.length > 0) {
          const nextState = this.state.redoHistory.pop();
          this.state = nextState;
        }
        break;
      default:
        break;
    }
    this.listeners.forEach(listener => listener(this.state));
  }

  subscribe(listener) {
    this.listeners.push(listener);
  }

  saveToLocalStorage() {
    localStorage.setItem('vectra-state', JSON.stringify(this.state));
  }

  loadFromLocalStorage() {
    const storedState = localStorage.getItem('vectra-state');
    if (storedState) {
      this.state = JSON.parse(storedState);
    }
  }
}

// Define the SVG rendering engine
class SVGRenderer {
  constructor(canvas, ctx) {
    this.canvas = canvas;
    this.ctx = ctx;
  }

  render(layers) {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    layers.forEach(layer => {
      if (layer.type === 'shape') {
        this.renderShape(layer);
      } else if (layer.type === 'path') {
        this.renderPath(layer);
      }
    });
  }

  renderShape(layer) {
    this.ctx.fillStyle = layer.fill;
    this.ctx.beginPath();
    this.ctx.moveTo(layer.x, layer.y);
    this.ctx.lineTo(layer.x + layer.width, layer.y);
    this.ctx.lineTo(layer.x + layer.width, layer.y + layer.height);
    this.ctx.lineTo(layer.x, layer.y + layer.height);
    this.ctx.closePath();
    this.ctx.fill();
  }

  renderPath(layer) {
    this.ctx.strokeStyle = layer.stroke;
    this.ctx.beginPath();
    layer.points.forEach(point => {
      this.ctx.lineTo(point.x, point.y);
    });
    this.ctx.stroke();
  }
}

// Define the file export logic
class FileExporter {
  constructor(canvas) {
    this.canvas = canvas;
  }

  exportAsPNG() {
    const dataURL = this.canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = 'vectra-export.png';
    a.click();
  }

  exportAsSVG() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', this.canvas.width);
    svg.setAttribute('height', this.canvas.height);
    const layers = store.state.layers;
    layers.forEach(layer => {
      if (layer.type === 'shape') {
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', layer.x);
        rect.setAttribute('y', layer.y);
        rect.setAttribute('width', layer.width);
        rect.setAttribute('height', layer.height);
        rect.setAttribute('fill', layer.fill);
        svg.appendChild(rect);
      } else if (layer.type === 'path') {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', layer.points.map(point => `${point.x} ${point.y} L`).join(''));
        path.setAttribute('stroke', layer.stroke);
        svg.appendChild(path);
      }
    });
    const serializer = new XMLSerializer();
    const svgString = serializer.serializeToString(svg);
    const a = document.createElement('a');
    a.href = 'data:image/svg+xml,' + encodeURIComponent(svgString);
    a.download = 'vectra-export.svg';
    a.click();
  }

  exportAsJSON() {
    const layers = store.state.layers;
    const json = JSON.stringify(layers);
    const a = document.createElement('a');
    a.href = 'data:application/json,' + encodeURIComponent(json);
    a.download = 'vectra-export.json';
    a.click();
  }
}

// Define the event listeners for canvas/DOM interactions
class EventListener {
  constructor(canvas, store) {
    this.canvas = canvas;
    this.store = store;
    this.canvas.addEventListener('mousedown', this.handleMouseDown.bind(this));
    this.canvas.addEventListener('mousemove', this.handleMouseMove.bind(this));
    this.canvas.addEventListener('mouseup', this.handleMouseUp.bind(this));
  }

  handleMouseDown(event) {
    const layers = this.store.state.layers;
    const layer = layers.find(layer => {
      return layer.x < event.clientX && layer.x + layer.width > event.clientX && layer.y < event.clientY && layer.y + layer.height > event.clientY;
    });
    if (layer) {
      this.store.dispatch({ type: 'SELECT_LAYER', layer });
    } else {
      this.store.dispatch({ type: 'ADD_LAYER', layer: { type: 'shape', x: event.clientX, y: event.clientY, width: 100, height: 100, fill: 'black' } });
    }
  }

  handleMouseMove(event) {
    const layer = this.store.state.selectedLayer;
    if (layer) {
      layer.x = event.clientX;
      layer.y = event.clientY;
      this.store.dispatch({ type: 'UPDATE_LAYER', layer });
    }
  }

  handleMouseUp(event) {
    const layer = this.store.state.selectedLayer;
    if (layer) {
      this.store.dispatch({ type: 'UPDATE_LAYER', layer });
    }
  }
}

// Initialize the application
const store = new Store();
const svgRenderer = new SVGRenderer(canvas, ctx);
const fileExporter = new FileExporter(canvas);
const eventListener = new EventListener(canvas, store);

// Load state from local storage
store.loadFromLocalStorage();

// Render the initial state
svgRenderer.render(store.state.layers);

// Add event listeners for file export
document.addEventListener('keydown', event => {
  if (event.ctrlKey && event.key === 's') {
    fileExporter.exportAsPNG();
  } else if (event.ctrlKey && event.key === 'e') {
    fileExporter.exportAsSVG();
  } else if (event.ctrlKey && event.key === 'j') {
    fileExporter.exportAsJSON();
  }
});

// Add event listener for undo/redo
document.addEventListener('keydown', event => {
  if (event.ctrlKey && event.key === 'z') {
    store.dispatch({ type: 'UNDO' });
  } else if (event.ctrlKey && event.key === 'y') {
    store.dispatch({ type: 'REDO' });
  }
});

// Subscribe to state changes
store.subscribe(state => {
  svgRenderer.render(state.layers);
  store.saveToLocalStorage();
});
</script>
</body>
</html>
