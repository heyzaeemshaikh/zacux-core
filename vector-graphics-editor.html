<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectra</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="h-screen w-screen bg-gray-900 text-gray-100 flex flex-col">
  <!-- Header Toolbar -->
  <header class="flex justify-between items-center py-4 bg-gray-800 text-gray-100 border-b border-gray-700">
    <div class="flex items-center">
      <h1 class="text-lg font-bold mr-4"><i class="fas fa-vector-square fa-lg mr-2"></i>Vectra</h1>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mr-2" title="New File"><i class="fas fa-file fa-lg"></i></button>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mr-2" title="Open File"><i class="fas fa-folder-open fa-lg"></i></button>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mr-2" title="Save File"><i class="fas fa-save fa-lg"></i></button>
    </div>
    <div class="flex items-center">
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mr-2" title="Undo"><i class="fas fa-undo fa-lg"></i></button>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mr-2" title="Redo"><i class="fas fa-redo fa-lg"></i></button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex flex-1 overflow-hidden">
    <!-- Canvas Viewport -->
    <div class="flex-1 overflow-auto border-r border-gray-700" id="canvas-viewport">
      <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"></svg>
    </div>
    <!-- Properties Sidebar -->
    <aside class="w-64 p-4 border-l border-gray-700" id="properties-sidebar">
      <h2 class="text-lg font-bold mb-2">Properties</h2>
      <form>
        <label class="block mb-2">
          <span class="block text-sm font-medium text-gray-100">Node ID</span>
          <input type="text" class="block w-full p-2 bg-gray-700 text-gray-100 border border-gray-600 rounded" disabled>
        </label>
        <label class="block mb-2">
          <span class="block text-sm font-medium text-gray-100">Node Type</span>
          <select class="block w-full p-2 bg-gray-700 text-gray-100 border border-gray-600 rounded">
            <option value="">Select Type</option>
          </select>
        </label>
      </form>
    </aside>
  </main>

  <!-- Node Editing Toolbar -->
  <div class="fixed bottom-0 left-0 p-4 bg-gray-800 text-gray-100 border-t border-gray-700" id="node-editing-toolbar">
    <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mr-2" title="Node Edit"><i class="fas fa-pencil-alt fa-lg"></i></button>
    <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mr-2" title="Node Delete"><i class="fas fa-trash fa-lg"></i></button>
  </div>

  <!-- Layers Panel -->
  <div class="fixed top-0 right-0 p-4 bg-gray-800 text-gray-100 border-l border-gray-700 w-64" id="layers-panel">
    <h2 class="text-lg font-bold mb-2">Layers</h2>
    <ul>
      <li class="py-2 border-b border-gray-700">
        <span class="text-sm font-medium text-gray-100">Layer 1</span>
        <button class="bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded ml-2" title="Layer Visibility"><i class="fas fa-eye fa-lg"></i></button>
      </li>
    </ul>
  </div>

  <!-- Status Panel -->
  <div class="fixed bottom-0 right-0 p-4 bg-gray-800 text-gray-100 border-t border-gray-700 w-64" id="status-panel">
    <h2 class="text-lg font-bold mb-2">Status</h2>
    <p class="text-sm font-medium text-gray-100">Zoom: 100% | Cursor: (0, 0)</p>
  </div>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// Core Engine for Vectra
class VectraEngine {
  constructor(canvasId, toolbarId, layersId, propertiesId, statusId) {
    this.canvasId = canvasId;
    this.toolbarId = toolbarId;
    this.layersId = layersId;
    this.propertiesId = propertiesId;
    this.statusId = statusId;
    this.state = {
      nodes: [],
      history: [],
      currentHistoryIndex: -1,
      selectedNode: null
    };
    this.loadData();
    this.initEventListeners();
    this.renderCanvas();
    this.renderToolbar();
    this.renderLayersPanel();
    this.renderPropertiesSidebar();
    this.renderStatusPanel();
  }

  // State Management
  saveData() {
    localStorage.setItem('vectra-state', JSON.stringify(this.state));
  }

  loadData() {
    const storedState = localStorage.getItem('vectra-state');
    if (storedState) {
      this.state = JSON.parse(storedState);
      this.state.history = this.state.history.slice(0, this.state.history.length);
    }
  }

  undo() {
    if (this.state.currentHistoryIndex > 0) {
      this.state.currentHistoryIndex--;
      this.setState(this.state.history[this.state.currentHistoryIndex]);
    }
  }

  redo() {
    if (this.state.currentHistoryIndex < this.state.history.length - 1) {
      this.state.currentHistoryIndex++;
      this.setState(this.state.history[this.state.currentHistoryIndex]);
    }
  }

  addHistory(state) {
    if (this.state.currentHistoryIndex < this.state.history.length - 1) {
      this.state.history = this.state.history.slice(0, this.state.currentHistoryIndex + 1);
    }
    this.state.history.push(state);
    this.state.currentHistoryIndex++;
  }

  setState(state) {
    this.state = state;
    this.renderCanvas();
  }

  // Event Listeners
  initEventListeners() {
    const canvas = document.getElementById(this.canvasId);
    canvas.addEventListener('click', (e) => this.handleCanvasClick(e));
    canvas.addEventListener('mousemove', (e) => this.handleCanvasMouseMove(e));
    const toolbar = document.getElementById(this.toolbarId);
    toolbar.addEventListener('click', (e) => this.handleToolbarClick(e));
    const layersPanel = document.getElementById(this.layersId);
    layersPanel.addEventListener('click', (e) => this.handleLayersPanelClick(e));
    const propertiesSidebar = document.getElementById(this.propertiesId);
    propertiesSidebar.addEventListener('click', (e) => this.handlePropertiesSidebarClick(e));
  }

  handleCanvasClick(e) {
    const node = this.getNodeAtPosition(e.clientX, e.clientY);
    if (node) {
      this.state.selectedNode = node;
    } else {
      this.state.selectedNode = null;
    }
    this.saveData();
  }

  handleCanvasMouseMove(e) {
    if (this.state.selectedNode) {
      const node = this.state.selectedNode;
      node.x = e.clientX;
      node.y = e.clientY;
      this.renderCanvas();
      this.saveData();
    }
  }

  handleToolbarClick(e) {
    if (e.target.id === 'undo') {
      this.undo();
    } else if (e.target.id === 'redo') {
      this.redo();
    }
  }

  handleLayersPanelClick(e) {
    if (e.target.tagName === 'LI') {
      const node = this.state.nodes.find((n) => n.id === e.target.dataset.id);
      this.state.selectedNode = node;
      this.saveData();
    }
  }

  handlePropertiesSidebarClick(e) {
    if (e.target.tagName === 'INPUT') {
      const node = this.state.selectedNode;
      node[e.target.name] = e.target.value;
      this.renderCanvas();
      this.saveData();
    }
  }

  // Canvas Rendering
  renderCanvas() {
    const canvas = document.getElementById(this.canvasId);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    this.state.nodes.forEach((node) => {
      ctx.fillStyle = node.fill;
      ctx.fillRect(node.x, node.y, node.width, node.height);
    });
  }

  // Toolbar Rendering
  renderToolbar() {
    const toolbar = document.getElementById(this.toolbarId);
    const undoButton = document.createElement('button');
    undoButton.id = 'undo';
    undoButton.textContent = 'Undo';
    toolbar.appendChild(undoButton);
    const redoButton = document.createElement('button');
    redoButton.id = 'redo';
    redoButton.textContent = 'Redo';
    toolbar.appendChild(redoButton);
  }

  // Layers Panel Rendering
  renderLayersPanel() {
    const layersPanel = document.getElementById(this.layersId);
    layersPanel.innerHTML = '';
    this.state.nodes.forEach((node) => {
      const li = document.createElement('li');
      li.dataset.id = node.id;
      li.textContent = node.name;
      layersPanel.appendChild(li);
    });
  }

  // Properties Sidebar Rendering
  renderPropertiesSidebar() {
    const propertiesSidebar = document.getElementById(this.propertiesId);
    propertiesSidebar.innerHTML = '';
    if (this.state.selectedNode) {
      const node = this.state.selectedNode;
      const fillInput = document.createElement('input');
      fillInput.name = 'fill';
      fillInput.value = node.fill;
      propertiesSidebar.appendChild(fillInput);
      const xInput = document.createElement('input');
      xInput.name = 'x';
      xInput.value = node.x;
      propertiesSidebar.appendChild(xInput);
      const yInput = document.createElement('input');
      yInput.name = 'y';
      yInput.value = node.y;
      propertiesSidebar.appendChild(yInput);
      const widthInput = document.createElement('input');
      widthInput.name = 'width';
      widthInput.value = node.width;
      propertiesSidebar.appendChild(widthInput);
      const heightInput = document.createElement('input');
      heightInput.name = 'height';
      heightInput.value = node.height;
      propertiesSidebar.appendChild(heightInput);
    }
  }

  // Status Panel Rendering
  renderStatusPanel() {
    const statusPanel = document.getElementById(this.statusId);
    statusPanel.innerHTML = '';
    if (this.state.selectedNode) {
      const node = this.state.selectedNode;
      const text = document.createElement('p');
      text.textContent = `Node ${node.id} selected`;
      statusPanel.appendChild(text);
    } else {
      const text = document.createElement('p');
      text.textContent = 'No node selected';
      statusPanel.appendChild(text);
    }
  }

  // Node Management
  addNode(node) {
    this.state.nodes.push(node);
    this.saveData();
  }

  removeNode(node) {
    const index = this.state.nodes.indexOf(node);
    if (index!== -1) {
      this.state.nodes.splice(index, 1);
      this.saveData();
    }
  }

  getNodeAtPosition(x, y) {
    for (const node of this.state.nodes) {
      if (x >= node.x && x <= node.x + node.width && y >= node.y && y <= node.y + node.height) {
        return node;
      }
    }
    return null;
  }

  // File Export
  exportPNG() {
    const canvas = document.getElementById(this.canvasId);
    const ctx = canvas.getContext('2d');
    const pngData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const pngBlob = new Blob([pngData.data], { type: 'image/png' });
    const pngUrl = URL.createObjectURL(pngBlob);
    const pngLink = document.createElement('a');
    pngLink.href = pngUrl;
    pngLink.download = 'vectra.png';
    pngLink.click();
  }

  exportSVG() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', document.getElementById(this.canvasId).width);
    svg.setAttribute('height', document.getElementById(this.canvasId).height);
    this.state.nodes.forEach((node) => {
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', node.x);
      rect.setAttribute('y', node.y);
      rect.setAttribute('width', node.width);
      rect.setAttribute('height', node.height);
      rect.setAttribute('fill', node.fill);
      svg.appendChild(rect);
    });
    const svgBlob = new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' });
    const svgUrl = URL.createObjectURL(svgBlob);
    const svgLink = document.createElement('a');
    svgLink.href = svgUrl;
    svgLink.download = 'vectra.svg';
    svgLink.click();
  }

  exportJSON() {
    const jsonBlob = new Blob([JSON.stringify(this.state)], { type: 'application/json' });
    const jsonUrl = URL.createObjectURL(jsonBlob);
    const jsonLink = document.createElement('a');
    jsonLink.href = jsonUrl;
    jsonLink.download = 'vectra.json';
    jsonLink.click();
  }
}

// Initialize Vectra Engine
const vectraEngine = new VectraEngine('canvas', 'toolbar', 'layers', 'properties', 'status');



// Add example nodes
vectraEngine.addNode({ id: 1, name: 'Node 1', x: 10, y: 10, width: 50, height: 50, fill: 'red' });
vectraEngine.addNode({ id: 2, name: 'Node 2', x: 70, y: 70, width: 50, height: 50, fill: 'blue' });

// Export buttons
document.getElementById('export-png').addEventListener('click', () => vectraEngine.exportPNG());
document.getElementById('export-svg').addEventListener('click', () => vectraEngine.exportSVG());
document.getElementById('export-json').addEventListener('click', () => vectraEngine.exportJSON());
</script>
</body>
</html>
