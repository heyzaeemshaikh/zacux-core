<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvoicePilot — Automated Invoice Data Extraction</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  </script>
  <style>
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-12">

  <header class="border-b border-slate-800 bg-slate-900/60 sticky top-0 z-50 backdrop-blur-md px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="h-9 w-9 bg-emerald-600 rounded-lg flex items-center justify-center shadow-lg shadow-emerald-500/30">
        <i class="fa-solid fa-file-invoice-dollar text-white text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg text-white">InvoicePilot</h1>
        <p class="text-xs text-slate-400 font-mono">Automated Invoice Data Parser</p>
      </div>
    </div>
    <span class="px-2.5 py-1 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 font-mono text-xs flex items-center gap-1.5">
      <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span> Client-Side Private
    </span>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-8 space-y-6">

    <!-- UPLOAD ZONE -->
    <div class="glass p-8 rounded-3xl text-center border-2 border-dashed border-slate-700 hover:border-emerald-500 transition cursor-pointer" onclick="document.getElementById('file-input').click()">
      <input type="file" id="file-input" class="hidden" accept=".pdf,.txt" onchange="handleFile(event)">
      <div class="h-14 w-14 mx-auto bg-slate-800 rounded-2xl flex items-center justify-center text-emerald-400 text-2xl mb-4">
        <i class="fa-solid fa-file-pdf"></i>
      </div>
      <h2 class="text-base font-bold text-slate-100">Upload Real Invoice (PDF or Text)</h2>
      <p class="text-xs text-slate-400 mt-1">Extracts clean text directly from PDF pages</p>
    </div>

    <!-- TEXT / STATUS -->
    <div class="glass p-5 rounded-2xl space-y-3">
      <div class="flex justify-between items-center">
        <label class="text-xs font-mono text-slate-400 uppercase">Document Text Content:</label>
        <button onclick="loadSample()" class="text-xs text-emerald-400 hover:underline font-mono">Load Sample Bill</button>
      </div>
      <textarea id="raw-text" rows="5" class="w-full bg-black/60 border border-slate-800 rounded-xl p-3 text-xs font-mono text-slate-300 focus:outline-none focus:border-emerald-500" placeholder="Extracted invoice text will appear here..."></textarea>
      <button onclick="parseInvoiceText()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs rounded-xl transition text-white">Parse & Extract Values</button>
    </div>

    <!-- EXTRACTED RESULTS -->
    <div id="results" class="hidden space-y-4">
      <div class="glass p-6 rounded-3xl space-y-4">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
          <h3 class="font-bold text-sm text-emerald-400 flex items-center gap-2">
            <i class="fa-solid fa-check-circle"></i> Extracted Structured Data
          </h3>
          <button onclick="exportJSON()" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg font-mono text-slate-300 border border-slate-700">Export JSON</button>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-xs">
          <div class="p-3 bg-slate-900 rounded-xl border border-slate-800">
            <span class="text-slate-500 font-mono">Invoice / Bill No:</span>
            <p id="res-inv" class="font-bold text-slate-200 mt-1 font-mono text-sm">Not Found</p>
          </div>
          <div class="p-3 bg-slate-900 rounded-xl border border-slate-800">
            <span class="text-slate-500 font-mono">Date:</span>
            <p id="res-date" class="font-bold text-slate-200 mt-1 font-mono text-sm">Not Found</p>
          </div>
          <div class="p-3 bg-slate-900 rounded-xl border border-slate-800">
            <span class="text-slate-500 font-mono">Vendor / From:</span>
            <p id="res-vendor" class="font-bold text-slate-200 mt-1 text-sm">Not Found</p>
          </div>
          <div class="p-3 bg-slate-900 rounded-xl border border-slate-800">
            <span class="text-slate-500 font-mono">Total Amount:</span>
            <p id="res-total" class="font-bold text-emerald-400 mt-1 font-mono text-sm">Not Found</p>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script>
    let extractedData = {};

    function loadSample() {
      document.getElementById('raw-text').value = `TAX INVOICE
Invoice No: INV-2026-904
Date: 15/08/2026
Vendor: Flipkart Internet Pvt Ltd
Customer: Zaeem Shaikh
Items: Wireless Mechanical Keyboard (x1)
Tax (GST 18%): ₹340.00
Grand Total: ₹2,199.00`;
      parseInvoiceText();
    }

    async function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (file.type === "application/pdf") {
        const fileReader = new FileReader();
        fileReader.onload = async function() {
          const typedarray = new Uint8Array(this.result);
          const pdf = await pdfjsLib.getDocument(typedarray).promise;
          let fullText = "";
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(" ");
            fullText += pageText + "\n";
          }
          document.getElementById('raw-text').value = fullText;
          parseInvoiceText();
        };
        fileReader.readAsArrayBuffer(file);
      } else {
        const textReader = new FileReader();
        textReader.onload = function(evt) {
          document.getElementById('raw-text').value = evt.target.result;
          parseInvoiceText();
        };
        textReader.readAsText(file);
      }
    }

    function parseInvoiceText() {
      const text = document.getElementById('raw-text').value;
      if (!text.trim()) return;

      // Real extraction logic (No dummy fallbacks)
      const invMatch = text.match(/(?:invoice|bill|inv)[\s#:]*([A-Za-z0-9-_]+)/i);
      const totalMatch = text.match(/(?:total|amount|due|grand total)[\s:₹$]*([₹$€£]?\s?[0-9,]+(?:\.[0-9]{2})?)/i);
      const dateMatch = text.match(/\b(?:\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4}|\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2}|[A-Za-z]{3,9}\s+\d{1,2},?\s+\d{4})\b/);
      const vendorMatch = text.match(/(?:from|vendor|seller|company|merchant)[\s:]*([A-Za-z0-9\s.,]+)/i);

      extractedData = {
        invoice_number: invMatch ? invMatch[1].trim() : "Not Detected",
        total: totalMatch ? totalMatch[1].trim() : "Not Detected",
        date: dateMatch ? dateMatch[0].trim() : "Not Detected",
        vendor: vendorMatch ? vendorMatch[1].split("\n")[0].trim() : "Not Detected"
      };

      document.getElementById('res-inv').innerText = extractedData.invoice_number;
      document.getElementById('res-date').innerText = extractedData.date;
      document.getElementById('res-vendor').innerText = extractedData.vendor;
      document.getElementById('res-total').innerText = extractedData.total;

      document.getElementById('results').classList.remove('hidden');
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(extractedData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `invoice_data_${extractedData.invoice_number || 'extract'}.json`;
      a.click();
    }
  </script>
</body>
</html>
