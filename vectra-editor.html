<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectra Editor</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="h-screen w-screen bg-[#090d16] text-white overflow-hidden">
  <!-- Top Toolbar -->
  <nav class="flex justify-between items-center p-4 border-b border-gray-600">
    <div class="flex items-center">
      <i class="fas fa-vector-square fa-lg mr-2"></i>
      <span class="text-lg font-bold">Vectra Editor</span>
    </div>
    <div class="flex items-center space-x-4">
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded" title="New File">
        <i class="fas fa-file fa-lg"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded" title="Open File">
        <i class="fas fa-folder-open fa-lg"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded" title="Save File">
        <i class="fas fa-save fa-lg"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded" title="Undo">
        <i class="fas fa-undo fa-lg"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded" title="Redo">
        <i class="fas fa-redo fa-lg"></i>
      </button>
    </div>
    <div class="flex items-center space-x-4">
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded" title="Zoom In">
        <i class="fas fa-search-plus fa-lg"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded" title="Zoom Out">
        <i class="fas fa-search-minus fa-lg"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded" title="Pan">
        <i class="fas fa-hand-paper fa-lg"></i>
      </button>
    </div>
  </nav>

  <!-- Left Sidebar -->
  <aside class="fixed top-16 left-0 bottom-16 w-64 bg-gray-800 p-4 border-r border-gray-600">
    <h5 class="text-lg font-bold mb-4">Layers</h5>
    <ul>
      <li class="py-2 border-b border-gray-600">
        <i class="fas fa-layer-group fa-lg mr-2"></i>
        <span>Layer 1</span>
      </li>
      <li class="py-2 border-b border-gray-600">
        <i class="fas fa-layer-group fa-lg mr-2"></i>
        <span>Layer 2</span>
      </li>
      <li class="py-2 border-b border-gray-600">
        <i class="fas fa-layer-group fa-lg mr-2"></i>
        <span>Layer 3</span>
      </li>
    </ul>
    <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded mt-4" title="New Layer">
      <i class="fas fa-plus fa-lg mr-2"></i>
      <span>New Layer</span>
    </button>
  </aside>

  <!-- Main Viewport -->
  <main class="relative top-16 left-64 right-64 bottom-16 bg-gray-900 p-4 overflow-auto">
    <svg class="absolute top-0 left-0 right-0 bottom-0" width="100%" height="100%">
      <!-- SVG content will be rendered here -->
    </svg>
  </main>

  <!-- Right Sidebar -->
  <aside class="fixed top-16 right-0 bottom-16 w-64 bg-gray-800 p-4 border-l border-gray-600">
    <h5 class="text-lg font-bold mb-4">Properties</h5>
    <div class="space-y-4">
      <div class="flex items-center">
        <label class="mr-2">Fill:</label>
        <input type="color" value="#ffffff" class="w-8 h-8">
      </div>
      <div class="flex items-center">
        <label class="mr-2">Stroke:</label>
        <input type="color" value="#000000" class="w-8 h-8">
      </div>
      <div class="flex items-center">
        <label class="mr-2">Stroke Width:</label>
        <input type="number" value="1" class="w-8 h-8">
      </div>
    </div>
    <h5 class="text-lg font-bold mt-4 mb-4">Node Editing Tools</h5>
    <div class="space-y-4">
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded" title="Select">
        <i class="fas fa-mouse-pointer fa-lg mr-2"></i>
        <span>Select</span>
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded" title="Move">
        <i class="fas fa-arrows-alt fa-lg mr-2"></i>
        <span>Move</span>
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded" title="Scale">
        <i class="fas fa-expand-arrows-alt fa-lg mr-2"></i>
        <span>Scale</span>
      </button>
    </div>
  </aside>

  <!-- Bottom Status Panel -->
  <footer class="fixed bottom-0 left-0 right-0 p-4 bg-gray-800 border-t border-gray-600">
    <div class="flex items-center space-x-4">
      <span>Undo History:</span>
      <ul class="flex items-center space-x-2">
        <li class="py-2 px-4 bg-gray-700 rounded">Action 1</li>
        <li class="py-2 px-4 bg-gray-700 rounded">Action 2</li>
        <li class="py-2 px-4 bg-gray-700 rounded">Action 3</li>
      </ul>
    </div>
    <div class="flex items-center space-x-4 ml-auto">
      <span>Notifications:</span>
      <ul class="flex items-center space-x-2">
        <li class="py-2 px-4 bg-gray-700 rounded">Notification 1</li>
        <li class="py-2 px-4 bg-gray-700 rounded">Notification 2</li>
        <li class="py-2 px-4 bg-gray-700 rounded">Notification 3</li>
      </ul>
    </div>
  </footer>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
class VectraEditor {
  constructor() {
    this.state = {
      layers: [],
      currentLayer: null,
      nodes: [],
      selectedNode: null,
      undoHistory: [],
      redoHistory: []
    };

    this.canvas = document.getElementById('canvas');
    this.ctx = this.canvas.getContext('2d');

    this.toolbar = document.getElementById('toolbar');
    this.leftSidebar = document.getElementById('left-sidebar');
    this.rightSidebar = document.getElementById('right-sidebar');
    this.viewport = document.getElementById('viewport');
    this.statusPanel = document.getElementById('status-panel');

    this.initEventListeners();
    this.initStateManagement();
    this.initRenderingEngine();
  }

  initEventListeners() {
    this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
    this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));

    this.toolbar.addEventListener('click', (e) => this.handleToolbarClick(e));
    this.leftSidebar.addEventListener('click', (e) => this.handleLeftSidebarClick(e));
    this.rightSidebar.addEventListener('click', (e) => this.handleRightSidebarClick(e));
  }

  initStateManagement() {
    this.stateStore = new ReduxStateStore(this.state);
    this.stateStore.subscribe((state) => this.setState(state));
    this.stateStore.persist();
  }

  initRenderingEngine() {
    this.renderingEngine = new SVGRenderingEngine(this.canvas, this.ctx);
    this.renderingEngine.render(this.state.nodes);
  }

  handleMouseDown(e) {
    const node = this.getNodeAtPosition(e.clientX, e.clientY);
    if (node) {
      this.stateStore.dispatch({ type: 'SELECT_NODE', payload: node });
    }
  }

  handleMouseMove(e) {
    if (this.state.selectedNode) {
      this.stateStore.dispatch({ type: 'UPDATE_NODE_POSITION', payload: { x: e.clientX, y: e.clientY } });
    }
  }

  handleMouseUp(e) {
    this.stateStore.dispatch({ type: 'DESELECT_NODE' });
  }

  handleToolbarClick(e) {
    const target = e.target;
    switch (target.id) {
      case 'undo-button':
        this.stateStore.dispatch({ type: 'UNDO' });
        break;
      case 'redo-button':
        this.stateStore.dispatch({ type: 'REDO' });
        break;
      case 'export-button':
        this.exportFile();
        break;
    }
  }

  handleLeftSidebarClick(e) {
    const target = e.target;
    switch (target.id) {
      case 'layer-management-button':
        this.stateStore.dispatch({ type: 'TOGGLE_LAYER_MANAGEMENT' });
        break;
    }
  }

  handleRightSidebarClick(e) {
    const target = e.target;
    switch (target.id) {
      case 'properties-button':
        this.stateStore.dispatch({ type: 'TOGGLE_PROPERTIES' });
        break;
      case 'node-editing-tools-button':
        this.stateStore.dispatch({ type: 'TOGGLE_NODE_EDITING_TOOLS' });
        break;
    }
  }

  getNodeAtPosition(x, y) {
    const nodes = this.state.nodes;
    for (let i = 0; i < nodes.length; i++) {
      const node = nodes[i];
      if (node.x <= x && x <= node.x + node.width && node.y <= y && y <= node.y + node.height) {
        return node;
      }
    }
    return null;
  }

  setState(state) {
    this.state = state;
    this.renderingEngine.render(this.state.nodes);
  }

  exportFile() {
    const format = document.getElementById('export-format').value;
    const data = this.stateStore.getState();
    switch (format) {
      case 'PNG':
        this.renderingEngine.exportPNG(data.nodes);
        break;
      case 'SVG':
        this.renderingEngine.exportSVG(data.nodes);
        break;
      case 'JSON':
        this.renderingEngine.exportJSON(data.nodes);
        break;
      case 'FILE':
        this.downloadFile(data.nodes);
        break;
    }
  }

  downloadFile(data) {
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'vectra-editor-data.json';
    link.click();
  }
}

class ReduxStateStore {
  constructor(state) {
    this.state = state;
    this.listeners = [];
    this.persistence = new LocalStoragePersistence();
  }

  subscribe(listener) {
    this.listeners.push(listener);
  }

  dispatch(action) {
    switch (action.type) {
      case 'SELECT_NODE':
        this.state.selectedNode = action.payload;
        break;
      case 'DESELECT_NODE':
        this.state.selectedNode = null;
        break;
      case 'UPDATE_NODE_POSITION':
        this.state.nodes.forEach((node) => {
          if (node.id === this.state.selectedNode.id) {
            node.x = action.payload.x;
            node.y = action.payload.y;
          }
        });
        break;
      case 'UNDO':
        this.state.undoHistory.push(this.state);
        this.state = this.state.redoHistory.pop();
        break;
      case 'REDO':
        this.state.redoHistory.push(this.state);
        this.state = this.state.undoHistory.pop();
        break;
    }
    this.notifyListeners();
    this.persistence.save(this.state);
  }

  notifyListeners() {
    this.listeners.forEach((listener) => listener(this.state));
  }

  persist() {
    this.persistence.load((state) => {
      if (state) {
        this.state = state;
        this.notifyListeners();
      }
    });
  }

  getState() {
    return this.state;
  }
}

class LocalStoragePersistence {
  save(state) {
    localStorage.setItem('vectra-editor-state', JSON.stringify(state));
  }

  load(callback) {
    const state = localStorage.getItem('vectra-editor-state');
    if (state) {
      callback(JSON.parse(state));
    } else {
      callback(null);
    }
  }
}

class SVGRenderingEngine {
  constructor(canvas, ctx) {
    this.canvas = canvas;
    this.ctx = ctx;
  }

  render(nodes) {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    nodes.forEach((node) => {
      this.ctx.fillStyle = node.color;
      this.ctx.fillRect(node.x, node.y, node.width, node.height);
    });
  }

  exportPNG(nodes) {
    const pngData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height).data;
    const pngBlob = new Blob([pngData], { type: 'image/png' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(pngBlob);
    link.download = 'vectra-editor-export.png';
    link.click();
  }

  exportSVG(nodes) {
    const svgData = [];
    nodes.forEach((node) => {
      svgData.push(`<rect x="${node.x}" y="${node.y}" width="${node.width}" height="${node.height}" fill="${node.color}" />`);
    });
    const svgBlob = new Blob([`<svg width="${this.canvas.width}" height="${this.canvas.height}">${svgData.join('')}</svg>`], { type: 'image/svg+xml' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(svgBlob);
    link.download = 'vectra-editor-export.svg';
    link.click();
  }

  exportJSON(nodes) {
    const jsonBlob = new Blob([JSON.stringify(nodes)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(jsonBlob);
    link.download = 'vectra-editor-export.json';
    link.click();
  }
}

const editor = new VectraEditor();
</script>
</body>
</html>
