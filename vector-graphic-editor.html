<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VectorCraft</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="bg-[#090d16] text-white h-screen overflow-hidden">
  <!-- Toolbar -->
  <nav class="flex justify-between bg-[#111826] p-2 fixed top-0 left-0 right-0 z-10">
    <div class="flex items-center">
      <button class="mr-2 hover:text-gray-400" title="Undo">
        <i class="fas fa-undo fa-lg"></i>
      </button>
      <button class="mr-2 hover:text-gray-400" title="Redo">
        <i class="fas fa-redo fa-lg"></i>
      </button>
    </div>
    <div class="flex items-center">
      <span class="text-lg font-bold mr-4">VectorCraft</span>
      <button class="mr-2 hover:text-gray-400" title="New File">
        <i class="fas fa-file fa-lg"></i>
      </button>
      <button class="mr-2 hover:text-gray-400" title="Open File">
        <i class="fas fa-folder-open fa-lg"></i>
      </button>
      <button class="mr-2 hover:text-gray-400" title="Save File">
        <i class="fas fa-save fa-lg"></i>
      </button>
    </div>
  </nav>

  <!-- Layers Panel -->
  <aside class="fixed left-0 top-12 h-screen w-64 bg-[#1a202c] p-4 z-0">
    <h2 class="text-lg font-bold mb-4">Layers</h2>
    <ul class="list-none m-0 p-0">
      <li class="mb-2">
        <button class="w-full text-left hover:bg-[#272e3f] py-2">
          <i class="fas fa-layer-group fa-lg mr-2"></i> Layer 1
        </button>
      </li>
      <li class="mb-2">
        <button class="w-full text-left hover:bg-[#272e3f] py-2">
          <i class="fas fa-layer-group fa-lg mr-2"></i> Layer 2
        </button>
      </li>
    </ul>
  </aside>

  <!-- Main SVG Viewport -->
  <main class="flex-1 relative overflow-hidden" style="margin-left: 16rem; margin-top: 4rem;">
    <svg class="absolute inset-0" id="svg-viewport">
      <!-- SVG Content will be rendered here -->
    </svg>
  </main>

  <!-- Node Editing Tools -->
  <aside class="fixed right-0 top-12 h-screen w-64 bg-[#1a202c] p-4 z-0">
    <h2 class="text-lg font-bold mb-4">Node Editing Tools</h2>
    <div class="flex flex-col mb-4">
      <button class="mb-2 hover:bg-[#272e3f] py-2 w-full text-left">
        <i class="fas fa-pen fa-lg mr-2"></i> Edit Node
      </button>
      <button class="mb-2 hover:bg-[#272e3f] py-2 w-full text-left">
        <i class="fas fa-clone fa-lg mr-2"></i> Duplicate Node
      </button>
      <button class="mb-2 hover:bg-[#272e3f] py-2 w-full text-left">
        <i class="fas fa-trash fa-lg mr-2"></i> Delete Node
      </button>
    </div>
    <h2 class="text-lg font-bold mb-4">Node Properties</h2>
    <form class="mb-4">
      <label class="block mb-2" for="node-id">ID:</label>
      <input type="text" id="node-id" class="w-full p-2">
      <label class="block mb-2" for="nodeclass">Class:</label>
      <input type="text" id="node-class" class="w-full p-2">
    </form>
  </aside>

  <!-- Status Panel -->
  <footer class="fixed bottom-0 left-0 right-0 bg-[#111826] p-2 z-10">
    <div class="flex justify-between items-center">
      <span class="text-gray-400 mr-4">Notifications and Export Options</span>
      <button class="mr-2 hover:text-gray-400" title="Export as PNG">
        <i class="fas fa-file-image fa-lg"></i>
      </button>
      <button class="mr-2 hover:text-gray-400" title="Export as JPEG">
        <i class="fas fa-file-image fa-lg"></i>
      </button>
      <button class="mr-2 hover:text-gray-400" title="Export as SVG">
        <i class="fas fa-file-code fa-lg"></i>
      </button>
    </div>
  </footer>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// VectorCraft Engine

// Import required libraries
import { createStore, combineReducers } from 'redux';
import { applyMiddleware } from 'redux';
import { composeWithDevTools } from 'redux-devtools-extension';
import { localStorageMiddleware } from './localStorageMiddleware';
import { indexedDBMiddleware } from './indexedDBMiddleware';

// Constants and Variables
const APP_NAME = 'VectorCraft';
const SLUG = 'vector-graphic-editor';

// Redux State Management
const initialState = {
  nodes: [],
  selectedNode: null,
  undoHistory: [],
  redoHistory: [],
  userPreferences: {}
};

const rootReducer = (state = initialState, action) => {
  switch (action.type) {
    case 'ADD_NODE':
      return {...state, nodes: [...state.nodes, action.node] };
    case 'SELECT_NODE':
      return {...state, selectedNode: action.node };
    case 'UNDO':
      return {...state, undoHistory: [...state.undoHistory, state] };
    case 'REDO':
      return {...state, redoHistory: [...state.redoHistory, state] };
    case 'SAVE_USER_PREFERENCES':
      return {...state, userPreferences: action.preferences };
    default:
      return state;
  }
};

const store = createStore(
  rootReducer,
  composeWithDevTools(applyMiddleware(localStorageMiddleware, indexedDBMiddleware))
);

// Local Storage Middleware
const localStorageMiddleware = (store) => (next) => (action) => {
  if (action.type === 'SAVE_USER_PREFERENCES') {
    localStorage.setItem('userPreferences', JSON.stringify(action.preferences));
  }
  return next(action);
};

// IndexedDB Middleware
const indexedDBMiddleware = (store) => (next) => (action) => {
  if (action.type === 'SAVE_SVG_DOCUMENT') {
    const request = window.indexedDB.open('vectorcraft_db', 1);
    request.onupgradeneeded = (event) => {
      const db = event.target.result;
      db.createObjectStore('svg_documents');
    };
    request.onsuccess = (event) => {
      const db = event.target.result;
      const transaction = db.transaction('svg_documents', 'readwrite');
      const store = transaction.objectStore('svg_documents');
      store.add(action.svgDocument);
    };
  }
  return next(action);
};

// SVG Engine
class SVGEngine {
  constructor(svgElement) {
    this.svgElement = svgElement;
    this.nodes = [];
    this.selectedNode = null;
    this.nodeEditingTools = {};
  }

  addNode(node) {
    this.nodes.push(node);
    this.svgElement.appendChild(node);
  }

  selectNode(node) {
    this.selectedNode = node;
  }

  renderNode(node) {
    const nodeElement = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    nodeElement.setAttribute('x', node.x);
    nodeElement.setAttribute('y', node.y);
    nodeElement.setAttribute('width', node.width);
    nodeElement.setAttribute('height', node.height);
    nodeElement.setAttribute('fill', node.fill);
    this.svgElement.appendChild(nodeElement);
  }

  handleNodeEditing(event) {
    if (event.type === 'mousedown') {
      this.selectNode(event.target);
    } else if (event.type === 'mousemove' && this.selectedNode) {
      this.selectedNode.x = event.clientX;
      this.selectedNode.y = event.clientY;
      this.renderNode(this.selectedNode);
    } else if (event.type === 'mouseup') {
      this.selectedNode = null;
    }
  }
}

// File Export Logic
const exportFile = (fileType, fileData) => {
  const file = new Blob([fileData], { type: fileType });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = 'vectorcraft_' + new Date().toLocaleString() + '.' + fileType;
  a.click();
};

const exportPNG = (svgElement) => {
  const svgData = new XMLSerializer().serializeToString(svgElement);
  const canvas = document.createElement('canvas');
  canvas.width = svgElement.width.baseVal.value;
  canvas.height = svgElement.height.baseVal.value;
  const ctx = canvas.getContext('2d');
  const image = new Image();
  image.src = 'data:image/svg+xml,' + encodeURIComponent(svgData);
  image.onload = () => {
    ctx.drawImage(image, 0, 0);
    exportFile('image/png', canvas.toDataURL('image/png'));
  };
};

const exportSVG = (svgElement) => {
  const svgData = new XMLSerializer().serializeToString(svgElement);
  exportFile('image/svg+xml', svgData);
};

const exportJSON = (svgElement) => {
  const svgData = new XMLSerializer().serializeToString(svgElement);
  const jsonData = JSON.stringify(svgData);
  exportFile('application/json', jsonData);
};

// Main Function
const main = () => {
  const svgElement = document.getElementById('svg-viewport');
  const svgEngine = new SVGEngine(svgElement);

  // Add event listeners for node editing
  svgElement.addEventListener('mousedown', (event) => svgEngine.handleNodeEditing(event));
  svgElement.addEventListener('mousemove', (event) => svgEngine.handleNodeEditing(event));
  svgElement.addEventListener('mouseup', (event) => svgEngine.handleNodeEditing(event));

  // Add toolbar buttons
  const toolbar = document.getElementById('toolbar');
  const undoButton = document.createElement('button');
  undoButton.textContent = 'Undo';
  undoButton.onclick = () => store.dispatch({ type: 'UNDO' });
  toolbar.appendChild(undoButton);

  const redoButton = document.createElement('button');
  redoButton.textContent = 'Redo';
  redoButton.onclick = () => store.dispatch({ type: 'REDO' });
  toolbar.appendChild(redoButton);

  const saveButton = document.createElement('button');
  saveButton.textContent = 'Save';
  saveButton.onclick = () => {
    const svgData = new XMLSerializer().serializeToString(svgElement);
    exportFile('image/svg+xml', svgData);
  };
  toolbar.appendChild(saveButton);

  const exportPNGButton = document.createElement('button');
  exportPNGButton.textContent = 'Export PNG';
  exportPNGButton.onclick = () => exportPNG(svgElement);
  toolbar.appendChild(exportPNGButton);

  const exportSVGButton = document.createElement('button');
  exportSVGButton.textContent = 'Export SVG';
  exportSVGButton.onclick = () => exportSVG(svgElement);
  toolbar.appendChild(exportSVGButton);

  const exportJSONButton = document.createElement('button');
  exportJSONButton.textContent = 'Export JSON';
  exportJSONButton.onclick = () => exportJSON(svgElement);
  toolbar.appendChild(exportJSONButton);
};

main();
</script>
</body>
</html>
