<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectra</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<div class="flex h-screen flex-col bg-gray-900 text-gray-200" style="background-color: #090d16;">
  <!-- Top Toolbar -->
  <nav class="flex justify-between bg-gray-800 p-2 text-lg">
    <div class="flex items-center">
      <i class="fas fa-vector-square mr-2"></i>
      <span>Vectra</span>
    </div>
    <div class="flex items-center space-x-4">
      <button class="rounded px-2 py-1 hover:bg-gray-700" title="New File">
        <i class="fas fa-file"></i>
      </button>
      <button class="rounded px-2 py-1 hover:bg-gray-700" title="Open File">
        <i class="fas fa-folder-open"></i>
      </button>
      <button class="rounded px-2 py-1 hover:bg-gray-700" title="Save File">
        <i class="fas fa-save"></i>
      </button>
      <button class="rounded px-2 py-1 hover:bg-gray-700" title="Undo">
        <i class="fas fa-undo"></i>
      </button>
      <button class="rounded px-2 py-1 hover:bg-gray-700" title="Redo">
        <i class="fas fa-redo"></i>
      </button>
    </div>
    <div class="flex items-center space-x-4">
      <button class="rounded px-2 py-1 hover:bg-gray-700" title="Export as PNG">
        <i class="fas fa-file-image"></i>
      </button>
      <button class="rounded px-2 py-1 hover:bg-gray-700" title="Export as JPEG">
        <i class="fas fa-file-image"></i>
      </button>
      <button class="rounded px-2 py-1 hover:bg-gray-700" title="Export as SVG">
        <i class="fas fa-file-code"></i>
      </button>
    </div>
  </nav>

  <!-- Left Sidebar -->
  <div class="flex flex-grow flex-col">
    <div class="flex flex-shrink-0 flex-col p-2 text-lg" style="width: 200px; background-color: #0a0f1d;">
      <button class="rounded px-2 py-1 hover:bg-gray-700 mb-2" title="Layers">
        <i class="fas fa-layer-group"></i>
      </button>
      <button class="rounded px-2 py-1 hover:bg-gray-700 mb-2" title="Node Management">
        <i class="fas fa-sitemap"></i>
      </button>
      <button class="rounded px-2 py-1 hover:bg-gray-700 mb-2" title="Settings">
        <i class="fas fa-cog"></i>
      </button>
    </div>

    <!-- Central Viewport -->
    <div class="flex flex-grow overflow-hidden">
      <div class="flex flex-grow overflow-auto p-2" style="background-color: #0a0f1d;">
        <svg class="w-full h-full" id="graphic-editor"></svg>
      </div>
    </div>
  </div>

  <!-- Bottom Status Panel -->
  <div class="flex flex-shrink-0 flex-col p-2 text-lg" style="height: 40px; background-color: #0a0f1d;">
    <div class="flex items-center space-x-4 text-sm">
      <span>Zoom: 100%</span>
      <span>Nodes: 0</span>
      <span>Layers: 0</span>
    </div>
  </div>

  <!-- Floating Side Panels -->
  <div class="fixed right-0 bottom-0 mb-4 mr-4">
    <div class="flex flex-col space-y-2">
      <button class="rounded px-2 py-1 hover:bg-gray-700" title="Tool Options">
        <i class="fas fa-wrench"></i>
      </button>
      <button class="rounded px-2 py-1 hover:bg-gray-700" title="Help">
        <i class="fas fa-question-circle"></i>
      </button>
    </div>
  </div>
</div>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
class VectraEngine {
  constructor() {
    this.initStateStore();
    this.initUI();
    this.initEventListener();
    this.initSVGParser();
    this.initExportEngine();
  }

  initStateStore() {
    this.stateStore = {
      UndoStack: [],
      RedoStack: [],
      LocalStorageKey: 'VectraState',
      GetState: () => {
        const state = localStorage.getItem(this.stateStore.LocalStorageKey);
        return state? JSON.parse(state) : { nodes: [], layers: [] };
      },
      SaveState: (state) => {
        localStorage.setItem(this.stateStore.LocalStorageKey, JSON.stringify(state));
      },
      SnapshotState: () => {
        const currentState = this.stateStore.GetState();
        this.stateStore.UndoStack.push(currentState);
      },
      Undo: () => {
        if (this.stateStore.UndoStack.length > 0) {
          const previousState = this.stateStore.UndoStack.pop();
          this.stateStore.RedoStack.push(this.stateStore.GetState());
          this.stateStore.SaveState(previousState);
        }
      },
      Redo: () => {
        if (this.stateStore.RedoStack.length > 0) {
          const nextState = this.stateStore.RedoStack.pop();
          this.stateStore.UndoStack.push(this.stateStore.GetState());
          this.stateStore.SaveState(nextState);
        }
      },
    };

    this.stateStore.SnapshotState();
  }

  initUI() {
    this.toolbar = document.getElementById('toolbar');
    this.layersPanel = document.getElementById('layers-panel');
    this.viewport = document.getElementById('viewport');
    this.statusPanel = document.getElementById('status-panel');
  }

  initEventListener() {
    this.viewport.addEventListener('click', (event) => {
      const node = this.getNodeUnderMouse(event.clientX, event.clientY);
      if (node) {
        this.selectNode(node);
      }
    });

    this.viewport.addEventListener('mousemove', (event) => {
      this.updateNodePosition(event.clientX, event.clientY);
    });

    this.viewport.addEventListener('contextmenu', (event) => {
      event.preventDefault();
      this.showContextMenu(event.clientX, event.clientY);
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'z' && event.ctrlKey) {
        this.stateStore.Undo();
      } else if (event.key === 'y' && event.ctrlKey) {
        this.stateStore.Redo();
      }
    });
  }

  initSVGParser() {
    this.svgParser = {
      Parse: (svgString) => {
        const parser = new DOMParser();
        const svgDoc = parser.parseFromString(svgString, 'image/svg+xml');
        return svgDoc.documentElement;
      },
    };
  }

  initExportEngine() {
    this.exportEngine = {
      ExportPNG: (canvas) => {
        const PNGEncoder = new PNGEncoder();
        const pngData = PNGEncoder.encode(canvas);
        const blob = new Blob([pngData], { type: 'image/png' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'image.png';
        a.click();
      },
      ExportSVG: (svgString) => {
        const blob = new Blob([svgString], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'image.svg';
        a.click();
      },
      ExportJSON: (nodes) => {
        const json = JSON.stringify(nodes);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'nodes.json';
        a.click();
      },
    };
  }

  getNodeUnderMouse(x, y) {
    const nodes = this.stateStore.GetState().nodes;
    for (const node of nodes) {
      if (node.x <= x && x <= node.x + node.width && node.y <= y && y <= node.y + node.height) {
        return node;
      }
    }
    return null;
  }

  selectNode(node) {
    this.stateStore.SnapshotState();
    node.selected = true;
    this.stateStore.SaveState(this.stateStore.GetState());
    this.updateUI();
  }

  updateNodePosition(x, y) {
    const nodes = this.stateStore.GetState().nodes;
    for (const node of nodes) {
      if (node.selected) {
        node.x = x - node.width / 2;
        node.y = y - node.height / 2;
        this.stateStore.SnapshotState();
        this.stateStore.SaveState(this.stateStore.GetState());
        this.updateUI();
      }
    }
  }

  showContextMenu(x, y) {
    const contextMenu = document.getElementById('context-menu');
    contextMenu.style.left = `${x}px`;
    contextMenu.style.top = `${y}px`;
    contextMenu.style.display = 'block';
  }

  updateUI() {
    this.viewport.innerHTML = '';
    const nodes = this.stateStore.GetState().nodes;
    for (const node of nodes) {
      const nodeElement = document.createElement('div');
      nodeElement.style.left = `${node.x}px`;
      nodeElement.style.top = `${node.y}px`;
      nodeElement.style.width = `${node.width}px`;
      nodeElement.style.height = `${node.height}px`;
      nodeElement.style.border = '1px solid #ccc';
      this.viewport.appendChild(nodeElement);
    }
  }
}

class PNGEncoder {
  encode(canvas) {
    const pngData = [];
    for (let y = 0; y < canvas.height; y++) {
      for (let x = 0; x < canvas.width; x++) {
        const pixel = canvas.getContext('2d').getImageData(x, y, 1, 1).data;
        pngData.push(pixel[0]);
        pngData.push(pixel[1]);
        pngData.push(pixel[2]);
        pngData.push(pixel[3]);
      }
    }
    return new Uint8Array(pngData);
  }
}

const vectraEngine = new VectraEngine();
</script>
</body>
</html>
