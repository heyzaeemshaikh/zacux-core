<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VectorCraft</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="h-screen bg-gray-900 text-gray-100 flex flex-col">
  <!-- Top Toolbar -->
  <header class="flex justify-between items-center p-4 border-b border-gray-700">
    <h1 class="text-2xl font-bold">VectorCraft</h1>
    <div class="flex items-center space-x-4">
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded">
        <i class="fas fa-file fa-lg mr-2"></i> New
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded">
        <i class="fas fa-folder fa-lg mr-2"></i> Open
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded">
        <i class="fas fa-save fa-lg mr-2"></i> Save
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded">
        <i class="fas fa-undo fa-lg mr-2"></i> Undo
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded">
        <i class="fas fa-redo fa-lg mr-2"></i> Redo
      </button>
    </div>
  </header>

  <!-- Left Sidebar -->
  <div class="flex flex-grow">
    <aside class="w-64 p-4 border-r border-gray-700">
      <h2 class="text-xl font-bold mb-4">Layers</h2>
      <ul>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group fa-lg mr-2"></i> Layer 1
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group fa-lg mr-2"></i> Layer 2
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group fa-lg mr-2"></i> Layer 3
        </li>
      </ul>
      <h2 class="text-xl font-bold mt-4 mb-4">Nodes</h2>
      <ul>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-circle fa-lg mr-2"></i> Node 1
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-circle fa-lg mr-2"></i> Node 2
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-circle fa-lg mr-2"></i> Node 3
        </li>
      </ul>
    </aside>

    <!-- Central Viewport -->
    <main class="flex-grow p-4">
      <div class="h-full border border-gray-700 rounded">
        <svg class="h-full w-full" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </main>

    <!-- Right Floating Panel -->
    <div class="fixed right-0 top-0 h-screen w-64 p-4 border-l border-gray-700 bg-gray-900">
      <h2 class="text-xl font-bold mb-4">Tool Options</h2>
      <div class="space-y-4">
        <div class="flex items-center space-x-4">
          <label class="text-lg">Stroke Width:</label>
          <input type="range" min="1" max="10" value="5">
          <span class="text-lg">5</span>
        </div>
        <div class="flex items-center space-x-4">
          <label class="text-lg">Stroke Color:</label>
          <input type="color" value="#000000">
        </div>
        <div class="flex items-center space-x-4">
          <label class="text-lg">Fill Color:</label>
          <input type="color" value="#ffffff">
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Status Panel -->
  <footer class="p-4 border-t border-gray-700">
    <div class="flex justify-between items-center">
      <span class="text-lg">Status: Ready</span>
      <div class="flex items-center space-x-4">
        <i class="fas fa-circle fa-lg text-green-500 mr-2"></i> Connected
        <i class="fas fa-bell fa-lg text-gray-500 mr-2"></i> Notifications
      </div>
    </div>
  </footer>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// VectorCraft Engine
class VectorCraft {
  constructor() {
    this.state = {
      nodes: [],
      history: [],
      currentStep: -1,
    };

    this.toolbar = document.getElementById('toolbar');
    this.layersPanel = document.getElementById('layers-panel');
    this.viewport = document.getElementById('viewport');
    this.statusPanel = document.getElementById('status-panel');

    this.canvas = document.createElement('canvas');
    this.canvas.width = 800;
    this.canvas.height = 600;
    this.viewport.appendChild(this.canvas);

    this.ctx = this.canvas.getContext('2d');

    this.worker = new Worker('worker.js');
    this.worker.onmessage = (event) => {
      if (event.data.type === 'render') {
        this.render(event.data.nodes);
      }
    };

    this.render = this.render.bind(this);
    this.handleEvent = this.handleEvent.bind(this);
    this.exportFile = this.exportFile.bind(this);

    this.canvas.addEventListener('click', this.handleEvent);
    this.canvas.addEventListener('mousemove', this.handleEvent);
    this.canvas.addEventListener('mousedown', this.handleEvent);
    this.canvas.addEventListener('mouseup', this.handleEvent);

    this.loadState();
    this.render();
  }

  render(nodes) {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    nodes.forEach((node) => {
      this.ctx.beginPath();
      this.ctx.moveTo(node.x, node.y);
      this.ctx.lineTo(node.x + node.width, node.y + node.height);
      this.ctx.stroke();
    });
  }

  handleEvent(event) {
    switch (event.type) {
      case 'click':
        this.addNode(event.clientX, event.clientY);
        break;
      case 'mousemove':
        this.updateNode(event.clientX, event.clientY);
        break;
      case 'mousedown':
        this.selectNode(event.clientX, event.clientY);
        break;
      case 'mouseup':
        this.deselectNode();
        break;
      default:
        break;
    }
  }

  addNode(x, y) {
    const newNode = { x, y, width: 50, height: 50 };
    this.state.nodes.push(newNode);
    this.saveState();
    this.render(this.state.nodes);
  }

  updateNode(x, y) {
    const currentNode = this.state.nodes[this.state.currentStep];
    if (currentNode) {
      currentNode.x = x;
      currentNode.y = y;
      this.saveState();
      this.render(this.state.nodes);
    }
  }

  selectNode(x, y) {
    const node = this.state.nodes.find((node) => {
      return node.x <= x && x <= node.x + node.width && node.y <= y && y <= node.y + node.height;
    });
    if (node) {
      this.state.currentStep = this.state.nodes.indexOf(node);
    }
  }

  deselectNode() {
    this.state.currentStep = -1;
  }

  saveState() {
    const state = JSON.parse(JSON.stringify(this.state));
    localStorage.setItem('vectorcraft-state', JSON.stringify(state));
  }

  loadState() {
    const storedState = localStorage.getItem('vectorcraft-state');
    if (storedState) {
      this.state = JSON.parse(storedState);
      this.render(this.state.nodes);
    }
  }

  undo() {
    if (this.state.history.length > 0) {
      this.state.nodes = this.state.history.pop();
      this.saveState();
      this.render(this.state.nodes);
    }
  }

  redo() {
    if (this.state.currentStep < this.state.history.length - 1) {
      this.state.nodes = this.state.history[this.state.currentStep + 1];
      this.state.currentStep++;
      this.saveState();
      this.render(this.state.nodes);
    }
  }

  exportFile(type) {
    const data = this.state.nodes;
    let blob;
    switch (type) {
      case 'png':
        blob = new Blob([this.canvas.toDataURL().replace('image/png', 'image/octet-stream')], { type: 'image/png' });
        break;
      case 'svg':
        const svg = this.getSvg(data);
        blob = new Blob([svg], { type: 'image/svg+xml' });
        break;
      case 'json':
        blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        break;
      default:
        break;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vectorcraft-${type}`;
    a.click();
  }

  getSvg(data) {
    return `
      <svg xmlns="http://www.w3.org/2000/svg" width="${this.canvas.width}" height="${this.canvas.height}">
        ${data.map((node) => {
          return `
            <rect x="${node.x}" y="${node.y}" width="${node.width}" height="${node.height}" fill="none" stroke="black" />
          `;
        }).join('')}
      </svg>
    `;
  }
}

const vectorCraft = new VectorCraft();
</script>
</body>
</html>
