<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectra</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<div class="h-screen w-screen flex flex-col bg-gray-900 text-gray-100" id="app-container">
  <!-- Top Toolbar -->
  <nav class="flex justify-between items-center py-2 px-4 bg-gray-800 border-b border-gray-700">
    <div class="flex items-center">
      <i class="fas fa-vector-square fa-lg mr-2 text-gray-400"></i>
      <span class="text-lg font-bold">Vectra</span>
    </div>
    <div class="flex items-center">
      <button class="bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded mr-2" title="Undo">
        <i class="fas fa-undo fa-lg text-gray-400"></i>
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded mr-2" title="Redo">
        <i class="fas fa-redo fa-lg text-gray-400"></i>
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded mr-4" title="Menu">
        <i class="fas fa-bars fa-lg text-gray-400"></i>
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded mr-2" title="Settings">
        <i class="fas fa-cog fa-lg text-gray-400"></i>
      </button>
    </div>
  </nav>

  <!-- Left Sidebar -->
  <div class="flex flex-row h-screen">
    <div class="w-64 bg-gray-800 p-4 border-r border-gray-700" id="left-sidebar">
      <h2 class="text-lg font-bold mb-2">Layers</h2>
      <ul>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group fa-lg mr-2 text-gray-400"></i>
          <span>Layer 1</span>
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group fa-lg mr-2 text-gray-400"></i>
          <span>Layer 2</span>
        </li>
      </ul>
      <h2 class="text-lg font-bold mt-4 mb-2">Tools</h2>
      <ul>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-pencil-alt fa-lg mr-2 text-gray-400"></i>
          <span>Pencil</span>
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-brush fa-lg mr-2 text-gray-400"></i>
          <span>Brush</span>
        </li>
      </ul>
    </div>

    <!-- Main Viewport -->
    <div class="flex-1 h-screen p-4" id="main-viewport">
      <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" class="bg-gray-700">
        <!-- SVG content will be rendered here -->
      </svg>
    </div>

    <!-- Right Sidebar (Floating) -->
    <div class="fixed right-0 top-0 h-screen w-64 bg-gray-800 p-4 border-l border-gray-700" id="right-sidebar">
      <h2 class="text-lg font-bold mb-2">Node Editing</h2>
      <ul>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-edit fa-lg mr-2 text-gray-400"></i>
          <span>Edit Node</span>
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-trash fa-lg mr-2 text-gray-400"></i>
          <span>Delete Node</span>
        </li>
      </ul>
    </div>
  </div>

  <!-- Bottom Status Bar -->
  <div class="flex justify-between items-center py-2 px-4 bg-gray-800 border-t border-gray-700" id="status-bar">
    <div class="flex items-center">
      <i class="fas fa-info-circle fa-lg mr-2 text-gray-400"></i>
      <span>Notifications</span>
    </div>
    <div class="flex items-center">
      <i class="fas fa-spinner fa-lg mr-2 text-gray-400"></i>
      <span>Progress: 0%</span>
    </div>
  </div>
</div>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// Import required libraries
import * as Redux from 'redux';
import { createStore, applyMiddleware, compose } from 'redux';
import ReduxThunk from 'redux-thunk';
import { localStorage } from 'localStorage';

// Define constants
const APP_NAME = 'Vectra';
const SLUG = 'vector-graphic-editor';
const LOCAL_STORAGE_KEY = 'vectra_state';

// Define initial state
const initialState = {
  nodes: [],
  undoHistory: [],
  redoHistory: [],
  userPreferences: {},
  projectData: {}
};

// Define Redux actions
const ADD_NODE = 'ADD_NODE';
const REMOVE_NODE = 'REMOVE_NODE';
const UPDATE_NODE = 'UPDATE_NODE';
const UNDO_ACTION = 'UNDO_ACTION';
const REDO_ACTION = 'REDO_ACTION';
const SAVE_STATE = 'SAVE_STATE';
const LOAD_STATE = 'LOAD_STATE';

// Define Redux action creators
function addNode(node) {
  return { type: ADD_NODE, node };
}

function removeNode(nodeId) {
  return { type: REMOVE_NODE, nodeId };
}

function updateNode(nodeId, newNode) {
  return { type: UPDATE_NODE, nodeId, newNode };
}

function undoAction() {
  return { type: UNDO_ACTION };
}

function redoAction() {
  return { type: REDO_ACTION };
}

function saveState() {
  return { type: SAVE_STATE };
}

function loadState() {
  return { type: LOAD_STATE };
}

// Define Redux reducer
function reducer(state = initialState, action) {
  switch (action.type) {
    case ADD_NODE:
      return {...state, nodes: [...state.nodes, action.node] };
    case REMOVE_NODE:
      return {...state, nodes: state.nodes.filter(node => node.id!== action.nodeId) };
    case UPDATE_NODE:
      return {...state, nodes: state.nodes.map(node => node.id === action.nodeId? action.newNode : node) };
    case UNDO_ACTION:
      return {...state, undoHistory: [...state.undoHistory, state] };
    case REDO_ACTION:
      return {...state, redoHistory: [...state.redoHistory, state] };
    case SAVE_STATE:
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state));
      return state;
    case LOAD_STATE:
      const storedState = localStorage.getItem(LOCAL_STORAGE_KEY);
      return storedState? JSON.parse(storedState) : state;
    default:
      return state;
  }
}

// Create Redux store with middleware and LocalStorage persistence
const store = createStore(reducer, compose(applyMiddleware(ReduxThunk), window.__REDUX_DEVTOOLS_EXTENSION__ && window.__REDUX_DEVTOOLS_EXTENSION__()));

// Define SVG parsing and rendering engine
class SVGEngine {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.nodes = [];
  }

  parseSVG(svgString) {
    // Parse SVG string and create node objects
    const parser = new DOMParser();
    const svgDoc = parser.parseFromString(svgString, 'image/svg+xml');
    const nodes = svgDoc.querySelectorAll('g, rect, circle, path');
    nodes.forEach(node => {
      const newNode = {
        id: node.id,
        type: node.nodeName,
        attributes: node.attributes
      };
      this.nodes.push(newNode);
    });
  }

  renderSVG() {
    // Render nodes on canvas
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.nodes.forEach(node => {
      switch (node.type) {
        case 'rect':
          this.ctx.fillStyle = node.attributes.getNamedItem('fill').value;
          this.ctx.fillRect(node.attributes.getNamedItem('x').value, node.attributes.getNamedItem('y').value, node.attributes.getNamedItem('width').value, node.attributes.getNamedItem('height').value);
          break;
        case 'circle':
          this.ctx.fillStyle = node.attributes.getNamedItem('fill').value;
          this.ctx.beginPath();
          this.ctx.arc(node.attributes.getNamedItem('cx').value, node.attributes.getNamedItem('cy').value, node.attributes.getNamedItem('r').value, 0, 2 * Math.PI);
          this.ctx.fill();
          break;
        case 'path':
          this.ctx.strokeStyle = node.attributes.getNamedItem('stroke').value;
          this.ctx.lineWidth = node.attributes.getNamedItem('stroke-width').value;
          this.ctx.beginPath();
          this.ctx.moveTo(node.attributes.getNamedItem('d').value.substring(1, node.attributes.getNamedItem('d').value.indexOf(' ')));
          this.ctx.lineTo(node.attributes.getNamedItem('d').value.substring(node.attributes.getNamedItem('d').value.indexOf(' ') + 1));
          this.ctx.stroke();
          break;
      }
    });
  }

  addNode(node) {
    // Add new node to nodes array and dispatch ADD_NODE action
    this.nodes.push(node);
    store.dispatch(addNode(node));
  }

  removeNode(nodeId) {
    // Remove node from nodes array and dispatch REMOVE_NODE action
    this.nodes = this.nodes.filter(node => node.id!== nodeId);
    store.dispatch(removeNode(nodeId));
  }

  updateNode(nodeId, newNode) {
    // Update node in nodes array and dispatch UPDATE_NODE action
    this.nodes = this.nodes.map(node => node.id === nodeId? newNode : node);
    store.dispatch(updateNode(nodeId, newNode));
  }
}

// Create SVG engine instance
const svgEngine = new SVGEngine(document.getElementById('canvas'));

// Define event listeners for canvas interactions
document.getElementById('canvas').addEventListener('click', (event) => {
  // Get node under cursor
  const node = svgEngine.nodes.find(node => {
    const rect = node.attributes.getNamedItem('x') && node.attributes.getNamedItem('y') && node.attributes.getNamedItem('width') && node.attributes.getNamedItem('height');
    if (rect) {
      return event.clientX > rect.x && event.clientX < rect.x + rect.width && event.clientY > rect.y && event.clientY < rect.y + rect.height;
    }
    return false;
  });

  // Dispatch UNDO_ACTION or REDO_ACTION if Ctrl + Z or Ctrl + Y is pressed
  if (event.ctrlKey && event.key === 'z') {
    store.dispatch(undoAction());
  } else if (event.ctrlKey && event.key === 'y') {
    store.dispatch(redoAction());
  }

  // Dispatch ADD_NODE action if new node is created
  if (!node) {
    const newNode = {
      id: Math.random().toString(36).substr(2, 9),
      type: 'rect',
      attributes: {
        x: event.clientX,
        y: event.clientY,
        width: 100,
        height: 100,
        fill: 'black'
      }
    };
    svgEngine.addNode(newNode);
  }
});

// Define file export logic
function exportFile(type) {
  // Get nodes and create SVG string
  const nodes = svgEngine.nodes;
  let svgString = '<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">';
  nodes.forEach(node => {
    switch (node.type) {
      case 'rect':
        svgString += `<rect x="${node.attributes.x}" y="${node.attributes.y}" width="${node.attributes.width}" height="${node.attributes.height}" fill="${node.attributes.fill}"/>`;
        break;
      case 'circle':
        svgString += `<circle cx="${node.attributes.cx}" cy="${node.attributes.cy}" r="${node.attributes.r}" fill="${node.attributes.fill}"/>`;
        break;
      case 'path':
        svgString += `<path d="${node.attributes.d}" stroke="${node.attributes.stroke}" stroke-width="${node.attributes.strokeWidth}"/>`;
        break;
    }
  });
  svgString += '</svg>';

  // Create blob and dispatch file download
  const blob = new Blob([svgString], { type: type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${APP_NAME}.${type === 'image/png'? 'png' : 'svg'}`;
  a.click();
}

// Define export buttons event listeners
document.getElementById('export-png').addEventListener('click', () => {
  exportFile('image/png');
});

document.getElementById('export-svg').addEventListener('click', () => {
  exportFile('image/svg+xml');
});

document.getElementById('export-json').addEventListener('click', () => {
  const nodes = svgEngine.nodes;
  const json = JSON.stringify(nodes);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${APP_NAME}.json`;
  a.click();
});
</script>
</body>
</html>
