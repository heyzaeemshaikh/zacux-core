<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VectorForge</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="h-screen w-screen bg-[#090d16] text-white flex flex-col">
  <!-- Toolbar -->
  <nav class="flex justify-between p-4 border-b border-gray-600">
    <div class="flex items-center">
      <h1 class="text-2xl font-bold mr-4">VectorForge</h1>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg mr-2">
        <i class="fas fa-undo fa-lg mr-2"></i>Undo
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg mr-2">
        <i class="fas fa-redo fa-lg mr-2"></i>Redo
      </button>
    </div>
    <div class="flex items-center">
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg mr-2">
        <i class="fas fa-file-export fa-lg mr-2"></i>Export
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg mr-2">
        <i class="fas fa-cog fa-lg mr-2"></i>Settings
      </button>
    </div>
  </nav>

  <!-- Main Viewport -->
  <div class="flex flex-1">
    <!-- Sidebar -->
    <div class="w-64 p-4 border-r border-gray-600">
      <h2 class="text-xl font-bold mb-4">Layers</h2>
      <ul>
        <li class="py-2 border-b border-gray-600">
          <i class="fas fa-layer-group fa-lg mr-2"></i>Layer 1
        </li>
        <li class="py-2 border-b border-gray-600">
          <i class="fas fa-layer-group fa-lg mr-2"></i>Layer 2
        </li>
        <li class="py-2 border-b border-gray-600">
          <i class="fas fa-layer-group fa-lg mr-2"></i>Layer 3
        </li>
      </ul>
      <h2 class="text-xl font-bold mt-4 mb-4">Properties</h2>
      <div>
        <label class="block mb-2">Fill Color</label>
        <input type="color" value="#ff0000">
      </div>
      <div>
        <label class="block mb-2">Stroke Color</label>
        <input type="color" value="#00ff00">
      </div>
    </div>

    <!-- SVG Canvas -->
    <div class="flex-1 p-4">
      <svg width="100%" height="100%" viewBox="0 0 100 100">
        <!-- SVG Content -->
      </svg>
    </div>

    <!-- Floating Side Panels -->
    <div class="fixed top-0 right-0 p-4">
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg mb-2">
        <i class="fas fa-node fa-lg mr-2"></i>Edit Node
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg mb-2">
        <i class="fas fa-vector-square fa-lg mr-2"></i>Insert Shape
      </button>
    </div>
  </div>

  <!-- Status Panel -->
  <div class="p-4 border-t border-gray-600">
    <div class="flex items-center">
      <i class="fas fa-check fa-lg text-green-500 mr-2"></i>
      <span>Project saved</span>
    </div>
    <div class="flex items-center">
      <i class="fas fa-exclamation-triangle fa-lg text-yellow-500 mr-2"></i>
      <span>Warning: unsaved changes</span>
    </div>
  </div>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// VectorForge Engine
class VectorForge {
  constructor() {
    this.state = {
      nodes: [],
      undoHistory: [],
      redoHistory: [],
      preferences: {
        theme: 'light',
        gridSize: 10,
      },
      project: {
        name: 'New Project',
        data: '',
      },
    };

    this.canvas = document.getElementById('canvas');
    this.toolbar = document.getElementById('toolbar');
    this.sidebar = document.getElementById('sidebar');
    this.viewport = document.getElementById('viewport');
    this.statusPanel = document.getElementById('status-panel');

    this.initEventListeners();
    this.initStateManagement();
    this.initExportEngines();
  }

  initEventListeners() {
    this.canvas.addEventListener('click', (e) => this.handleCanvasClick(e));
    this.canvas.addEventListener('mousedown', (e) => this.handleCanvasMouseDown(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleCanvasMouseMove(e));
    this.canvas.addEventListener('mouseup', (e) => this.handleCanvasMouseUp(e));

    this.toolbar.addEventListener('click', (e) => this.handleToolbarClick(e));
    this.sidebar.addEventListener('click', (e) => this.handleSidebarClick(e));
  }

  initStateManagement() {
    this.loadStateFromLocalStorage();
    this.saveStateToLocalStorage();

    window.addEventListener('beforeunload', () => this.saveStateToLocalStorage());
  }

  initExportEngines() {
    this.exportEngines = {
      png: (data) => this.exportPng(data),
      svg: (data) => this.exportSvg(data),
      json: (data) => this.exportJson(data),
    };
  }

  handleCanvasClick(e) {
    const x = e.clientX;
    const y = e.clientY;
    const node = this.findNodeAtPosition(x, y);

    if (node) {
      this.editNode(node);
    } else {
      this.addNode(x, y);
    }
  }

  handleCanvasMouseDown(e) {
    this.isMouseDown = true;
    this.isDragging = false;
    this.selectedNode = null;
  }

  handleCanvasMouseMove(e) {
    if (this.isMouseDown) {
      const x = e.clientX;
      const y = e.clientY;
      const node = this.findNodeAtPosition(x, y);

      if (node) {
        this.isDragging = true;
        this.selectedNode = node;
        this.updateNodePosition(node, x, y);
      }
    }
  }

  handleCanvasMouseUp(e) {
    this.isMouseDown = false;
    this.isDragging = false;
  }

  handleToolbarClick(e) {
    const target = e.target;
    const action = target.dataset.action;

    switch (action) {
      case 'undo':
        this.undo();
        break;
      case 'redo':
        this.redo();
        break;
      case 'export':
        this.exportProject();
        break;
      default:
        break;
    }
  }

  handleSidebarClick(e) {
    const target = e.target;
    const action = target.dataset.action;

    switch (action) {
      case 'add-node':
        this.addNode();
        break;
      case 'delete-node':
        this.deleteNode();
        break;
      default:
        break;
    }
  }

  findNodeAtPosition(x, y) {
    const nodes = this.state.nodes;

    for (let i = 0; i < nodes.length; i++) {
      const node = nodes[i];
      const rect = node.rect;

      if (x >= rect.x && x <= rect.x + rect.width && y >= rect.y && y <= rect.y + rect.height) {
        return node;
      }
    }

    return null;
  }

  addNode(x, y) {
    const node = {
      id: this.generateNodeId(),
      rect: {
        x: x,
        y: y,
        width: 100,
        height: 100,
      },
    };

    this.state.nodes.push(node);
    this.saveStateToLocalStorage();
  }

  editNode(node) {
    const index = this.state.nodes.indexOf(node);
    const rect = node.rect;

    rect.x = rect.x + 10;
    rect.y = rect.y + 10;

    this.state.nodes[index] = node;
    this.saveStateToLocalStorage();
  }

  deleteNode() {
    const node = this.selectedNode;

    if (node) {
      const index = this.state.nodes.indexOf(node);
      this.state.nodes.splice(index, 1);
      this.saveStateToLocalStorage();
    }
  }

  updateNodePosition(node, x, y) {
    const rect = node.rect;

    rect.x = x;
    rect.y = y;

    this.state.nodes[this.state.nodes.indexOf(node)] = node;
    this.saveStateToLocalStorage();
  }

  loadStateFromLocalStorage() {
    const storedState = localStorage.getItem('vectorforge-state');

    if (storedState) {
      this.state = JSON.parse(storedState);
    }
  }

  saveStateToLocalStorage() {
    const storedState = JSON.stringify(this.state);
    localStorage.setItem('vectorforge-state', storedState);
  }

  generateNodeId() {
    return Math.random().toString(36).substr(2, 9);
  }

  exportProject() {
    const format = document.querySelector('input[name="export-format"]:checked').value;

    switch (format) {
      case 'png':
        this.exportPng(this.state);
        break;
      case 'svg':
        this.exportSvg(this.state);
        break;
      case 'json':
        this.exportJson(this.state);
        break;
      default:
        break;
    }
  }

  exportPng(data) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const svg = new Blob([this.generateSvg(data)], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(svg);

    canvas.width = data.width;
    canvas.height = data.height;
    ctx.drawImage(document.getElementById('viewport').getImage(), 0, 0);

    const png = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = png;
    a.download = 'vectorforge.png';
    a.click();
  }

  exportSvg(data) {
    const svg = this.generateSvg(data);
    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vectorforge.svg';
    a.click();
  }

  exportJson(data) {
    const json = JSON.stringify(data);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vectorforge.json';
    a.click();
  }

  generateSvg(data) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', data.width);
    svg.setAttribute('height', data.height);

    for (let i = 0; i < data.nodes.length; i++) {
      const node = data.nodes[i];
      const rect = node.rect;

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', rect.x + rect.width / 2);
      circle.setAttribute('cy', rect.y + rect.height / 2);
      circle.setAttribute('r', 10);

      g.appendChild(circle);
      svg.appendChild(g);
    }

    return new XMLSerializer().serializeToString(svg);
  }

  undo() {
    const undoHistory = this.state.undoHistory;

    if (undoHistory.length > 0) {
      const previousState = undoHistory.pop();
      this.state = previousState;
      this.saveStateToLocalStorage();
    }
  }

  redo() {
    const redoHistory = this.state.redoHistory;

    if (redoHistory.length > 0) {
      const nextState = redoHistory.pop();
      this.state = nextState;
      this.saveStateToLocalStorage();
    }
  }
}

const vectorForge = new VectorForge();
</script>
</body>
</html>
