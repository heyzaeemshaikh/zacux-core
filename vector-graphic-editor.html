<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VectorForge</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="h-screen bg-gray-900 text-gray-100 flex flex-col">
  <!-- Top Toolbar -->
  <header class="flex justify-between items-center py-2 bg-gray-800 border-b border-gray-700">
    <h1 class="text-2xl font-bold ml-4"><i class="fas fa-vector-square fa-lg text-gray-100"></i> VectorForge</h1>
    <div class="flex items-center justify-center">
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 mx-2 rounded" title="Undo"><i class="fas fa-undo fa-lg text-gray-100"></i></button>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 mx-2 rounded" title="Redo"><i class="fas fa-redo fa-lg text-gray-100"></i></button>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 mx-2 rounded" title="Node Editing"><i class="fas fa-edit fa-lg text-gray-100"></i></button>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 mx-2 rounded" title="Layer Management"><i class="fas fa-layer-group fa-lg text-gray-100"></i></button>
    </div>
  </header>
  
  <!-- Left Sidebar -->
  <aside class="h-screen w-64 bg-gray-800 p-4 border-r border-gray-700 hidden md:block">
    <h2 class="text-xl font-bold mb-4">Asset Library</h2>
    <ul>
      <li class="mb-2"><i class="fas fa-image fa-lg text-gray-100"></i> Images</li>
      <li class="mb-2"><i class="fas fa-vector-square fa-lg text-gray-100"></i> Vectors</li>
      <li class="mb-2"><i class="fas fa-recycle fa-lg text-gray-100"></i> Trash</li>
    </ul>
    <h2 class="text-xl font-bold mt-4 mb-4">Palette</h2>
    <div class="flex flex-wrap">
      <div class="w-10 h-10 bg-red-500 m-2 rounded-full"></div>
      <div class="w-10 h-10 bg-blue-500 m-2 rounded-full"></div>
      <div class="w-10 h-10 bg-green-500 m-2 rounded-full"></div>
    </div>
  </aside>
  
  <!-- Main Viewport -->
  <main class="flex-1 h-screen p-4 overflow-y-auto">
    <div class="h-full w-full bg-gray-700 border border-gray-600 rounded">
      <!-- Canvas Rendering -->
      <svg id="vector-canvas" class="h-full w-full" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </main>
  
  <!-- Bottom Status Panel -->
  <footer class="flex justify-between items-center py-2 bg-gray-800 border-t border-gray-700">
    <div class="flex items-center justify-center">
      <span class="text-gray-100">Selections: </span>
      <span id="selection-count" class="text-gray-100">0</span>
    </div>
    <div class="flex items-center justify-center">
      <span class="text-gray-100">Zoom: </span>
      <span id="zoom-level" class="text-gray-100">100%</span>
    </div>
    <div class="flex items-center justify-center">
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 mx-2 rounded" title="Alerts"><i class="fas fa-exclamation-circle fa-lg text-gray-100"></i></button>
    </div>
  </footer>
  
  <!-- Floating Side Panels -->
  <div class="fixed bottom-0 right-0 mb-4 mr-4">
    <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded" title="Export PNG"><i class="fas fa-image fa-lg text-gray-100"></i></button>
    <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded" title="Export JPEG"><i class="fas fa-file-image fa-lg text-gray-100"></i></button>
    <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded" title="Export SVG"><i class="fas fa-vector-square fa-lg text-gray-100"></i></button>
  </div>
  
  <!-- Tool Options -->
  <div class="fixed top-0 right-0 mt-4 mr-4">
    <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded" title="Node Options"><i class="fas fa-cog fa-lg text-gray-100"></i></button>
    <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded" title="Layer Options"><i class="fas fa-layer-group fa-lg text-gray-100"></i></button>
  </div>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// VectorForge Engine
class VectorForgeEngine {
  constructor() {
    this.canvas = document.getElementById('canvas');
    this.svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    this.canvas.appendChild(this.svg);
    this.state = {
      nodes: [],
      selectedNode: null,
      undoHistory: [],
      redoHistory: []
    };
    this.LoadState();
    this.BindEventListeners();
    this.InitUI();
    this.InitStateManagement();
    this.InitExportEngines();
  }

  // State Management
  LoadState() {
    const storedState = localStorage.getItem('vector-forge-state');
    if (storedState) {
      this.state = JSON.parse(storedState);
      this.DrawCanvas();
    }
  }

  SaveState() {
    localStorage.setItem('vector-forge-state', JSON.stringify(this.state));
  }

  AutoSave() {
    setInterval(() => {
      this.SaveState();
    }, 10000);
  }

  // Event Listeners
  BindEventListeners() {
    this.canvas.addEventListener('click', (e) => {
      this.HandleClick(e);
    });

    this.canvas.addEventListener('mousedown', (e) => {
      this.HandleMouseDown(e);
    });

    this.canvas.addEventListener('mousemove', (e) => {
      this.HandleMouseMove(e);
    });

    this.canvas.addEventListener('mouseup', (e) => {
      this.HandleMouseUp(e);
    });
  }

  HandleClick(e) {
    // Node selection
    const node = this.GetNodeAt(e.clientX, e.clientY);
    if (node) {
      this.SelectNode(node);
    }
  }

  HandleMouseDown(e) {
    // Node dragging
    const node = this.GetNodeAt(e.clientX, e.clientY);
    if (node) {
      this.DragNode(node, e.clientX, e.clientY);
    }
  }

  HandleMouseMove(e) {
    // Node dragging
    if (this.state.selectedNode) {
      this.DragNode(this.state.selectedNode, e.clientX, e.clientY);
    }
  }

  HandleMouseUp(e) {
    // Node drop
    if (this.state.selectedNode) {
      this.DropNode(this.state.selectedNode, e.clientX, e.clientY);
    }
  }

  // Node Management
  GetNodeAt(x, y) {
    const nodes = this.state.nodes;
    for (let i = 0; i < nodes.length; i++) {
      const node = nodes[i];
      if (node.x <= x && node.x + node.width >= x && node.y <= y && node.y + node.height >= y) {
        return node;
      }
    }
    return null;
  }

  SelectNode(node) {
    this.state.selectedNode = node;
    this.DrawCanvas();
  }

  DragNode(node, x, y) {
    node.x = x - node.width / 2;
    node.y = y - node.height / 2;
    this.DrawCanvas();
  }

  DropNode(node, x, y) {
    node.x = x - node.width / 2;
    node.y = y - node.height / 2;
    this.state.selectedNode = null;
    this.DrawCanvas();
  }

  // Canvas Rendering
  DrawCanvas() {
    this.svg.innerHTML = '';
    const nodes = this.state.nodes;
    for (let i = 0; i < nodes.length; i++) {
      const node = nodes[i];
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', node.x);
      rect.setAttribute('y', node.y);
      rect.setAttribute('width', node.width);
      rect.setAttribute('height', node.height);
      rect.setAttribute('fill', node.color);
      this.svg.appendChild(rect);
    }
  }

  // UI Initialization
  InitUI() {
    const topToolbar = document.getElementById('top-toolbar');
    const leftSidebar = document.getElementById('left-sidebar');
    const mainViewport = document.getElementById('main-viewport');
    const bottomStatusPanel = document.getElementById('bottom-status-panel');

    topToolbar.innerHTML = `
      <button id="undo-button">Undo</button>
      <button id="redo-button">Redo</button>
      <button id="save-button">Save</button>
      <button id="export-button">Export</button>
    `;

    leftSidebar.innerHTML = `
      <h2>Asset Library</h2>
      <ul id="asset-list"></ul>
    `;

    mainViewport.innerHTML = `
      <div id="canvas-container">
        <div id="canvas"></div>
      </div>
    `;

    bottomStatusPanel.innerHTML = `
      <p id="selection-info"></p>
      <p id="zoom-info"></p>
      <p id="alert-info"></p>
    `;

    document.getElementById('undo-button').addEventListener('click', () => {
      this.Undo();
    });

    document.getElementById('redo-button').addEventListener('click', () => {
      this.Redo();
    });

    document.getElementById('save-button').addEventListener('click', () => {
      this.SaveState();
    });

    document.getElementById('export-button').addEventListener('click', () => {
      this.Export();
    });
  }

  // State Management
  InitStateManagement() {
    this.state.undoHistory = [];
    this.state.redoHistory = [];
  }

  Undo() {
    if (this.state.undoHistory.length > 0) {
      const state = this.state.undoHistory.pop();
      this.state.redoHistory.push(this.state);
      this.state = state;
      this.DrawCanvas();
    }
  }

  Redo() {
    if (this.state.redoHistory.length > 0) {
      const state = this.state.redoHistory.pop();
      this.state.undoHistory.push(this.state);
      this.state = state;
      this.DrawCanvas();
    }
  }

  // Export Engines
  InitExportEngines() {
    // PNG export
    document.getElementById('export-png-button').addEventListener('click', () => {
      this.ExportPNG();
    });

    // SVG export
    document.getElementById('export-svg-button').addEventListener('click', () => {
      this.ExportSVG();
    });

    // JSON export
    document.getElementById('export-json-button').addEventListener('click', () => {
      this.ExportJSON();
    });
  }

  ExportPNG() {
    const svg = this.svg;
    const canvas = document.createElement('canvas');
    canvas.width = svg.width.baseVal.value;
    canvas.height = svg.height.baseVal.value;
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.src = 'data:image/svg+xml,' + encodeURIComponent(this.svg.outerHTML);
    img.onload = () => {
      ctx.drawImage(img, 0, 0);
      const png = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = png;
      a.download = 'vector-forge.png';
      a.click();
    };
  }

  ExportSVG() {
    const svg = this.svg.outerHTML;
    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vector-forge.svg';
    a.click();
  }

  ExportJSON() {
    const json = JSON.stringify(this.state);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vector-forge.json';
    a.click();
  }
}

// Initialize VectorForge Engine
const engine = new VectorForgeEngine();
</script>
</body>
</html>
