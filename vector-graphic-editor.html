<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectra</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="bg-gray-900 text-gray-200 h-screen overflow-hidden">
  <!-- Toolbar -->
  <div class="flex justify-between items-center py-2 border-b border-gray-700">
    <div class="flex items-center">
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-md mx-2">
        <i class="fas fa-undo fa-lg text-gray-200"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-md mx-2">
        <i class="fas fa-redo fa-lg text-gray-200"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-md mx-2">
        <i class="fas fa-edit fa-lg text-gray-200"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-md mx-2">
        <i class="fas fa-file-export fa-lg text-gray-200"></i>
      </button>
    </div>
    <div class="flex items-center">
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-md mx-2">
        <i class="fas fa-question-circle fa-lg text-gray-200"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-md mx-2">
        <i class="fas fa-cog fa-lg text-gray-200"></i>
      </button>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="flex h-screen">
    <div class="w-64 bg-gray-800 p-4 border-r border-gray-700">
      <h2 class="text-lg font-bold mb-4">Layers</h2>
      <ul>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group fa-lg text-gray-200 mr-2"></i>
          Layer 1
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group fa-lg text-gray-200 mr-2"></i>
          Layer 2
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group fa-lg text-gray-200 mr-2"></i>
          Layer 3
        </li>
      </ul>
      <h2 class="text-lg font-bold mt-4 mb-4">Properties</h2>
      <div class="flex flex-wrap">
        <div class="w-full md:w-1/2 xl:w-1/3 p-2">
          <label class="block text-gray-200 text-sm font-bold mb-2">Fill Color</label>
          <input class="bg-gray-700 text-gray-200 border border-gray-600 rounded py-2 px-4 w-full" type="color" value="#ffffff">
        </div>
        <div class="w-full md:w-1/2 xl:w-1/3 p-2">
          <label class="block text-gray-200 text-sm font-bold mb-2">Stroke Color</label>
          <input class="bg-gray-700 text-gray-200 border border-gray-600 rounded py-2 px-4 w-full" type="color" value="#000000">
        </div>
        <div class="w-full md:w-1/2 xl:w-1/3 p-2">
          <label class="block text-gray-200 text-sm font-bold mb-2">Stroke Width</label>
          <input class="bg-gray-700 text-gray-200 border border-gray-600 rounded py-2 px-4 w-full" type="number" value="1">
        </div>
      </div>
    </div>

    <!-- Main Viewport -->
    <div class="flex-1 overflow-hidden">
      <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
        <!-- SVG Content -->
      </svg>
    </div>

    <!-- Status Panel -->
    <div class="w-64 bg-gray-800 p-4 border-l border-gray-700">
      <h2 class="text-lg font-bold mb-4">Status</h2>
      <p class="text-gray-200 text-sm">No errors or warnings</p>
      <ul>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-check-circle fa-lg text-green-400 mr-2"></i>
          Layer 1 updated
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-check-circle fa-lg text-green-400 mr-2"></i>
          Layer 2 updated
        </li>
      </ul>
    </div>
  </div>

  <!-- Floating Panels -->
  <div class="fixed bottom-0 right-0 mb-4 mr-4">
    <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-md">
      <i class="fas fa-plus fa-lg text-gray-200"></i>
    </button>
    <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-md ml-2">
      <i class="fas fa-minus fa-lg text-gray-200"></i>
    </button>
  </div>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
class VectraEngine {
  constructor() {
    this.state = {
      nodes: [],
      history: [],
      currentHistoryIndex: -1,
    };

    this.toolbar = {
      undo: this.undo.bind(this),
      redo: this.redo.bind(this),
      export: this.export.bind(this),
    };

    this.sidebar = {
      layerManagement: this.layerManagement.bind(this),
      propertiesPanel: this.propertiesPanel.bind(this),
    };

    this.viewport = {
      svg: document.createElementNS("http://www.w3.org/2000/svg", "svg"),
      render: this.render.bind(this),
    };

    this.statusPanel = {
      feedback: this.feedback.bind(this),
      notifications: this.notifications.bind(this),
    };

    this.init();
  }

  init() {
    this.setViewport();
    this.setToolbar();
    this.setSidebar();
    this.setStatusPanel();
    this.loadState();
  }

  setViewport() {
    const viewport = this.viewport.svg;
    viewport.setAttribute("width", "100%");
    viewport.setAttribute("height", "100vh");
    document.body.appendChild(viewport);

    viewport.addEventListener("click", (event) => {
      this.addNode(event.clientX, event.clientY);
    });

    viewport.addEventListener("mousemove", (event) => {
      this.updateNodePosition(event.clientX, event.clientY);
    });
  }

  setToolbar() {
    const toolbar = document.createElement("div");
    toolbar.innerHTML = `
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
      <button id="export">Export</button>
    `;

    document.body.appendChild(toolbar);

    document.getElementById("undo").addEventListener("click", this.toolbar.undo);
    document.getElementById("redo").addEventListener("click", this.toolbar.redo);
    document.getElementById("export").addEventListener("click", this.toolbar.export);
  }

  setSidebar() {
    const sidebar = document.createElement("div");
    sidebar.innerHTML = `
      <div id="layer-management">Layer Management</div>
      <div id="properties-panel">Properties Panel</div>
    `;

    document.body.appendChild(sidebar);

    document.getElementById("layer-management").addEventListener("click", this.sidebar.layerManagement);
    document.getElementById("properties-panel").addEventListener("click", this.sidebar.propertiesPanel);
  }

  setStatusPanel() {
    const statusPanel = document.createElement("div");
    statusPanel.innerHTML = `
      <div id="feedback">Feedback</div>
      <div id="notifications">Notifications</div>
    `;

    document.body.appendChild(statusPanel);

    document.getElementById("feedback").addEventListener("click", this.statusPanel.feedback);
    document.getElementById("notifications").addEventListener("click", this.statusPanel.notifications);
  }

  addNode(x, y) {
    const node = {
      x,
      y,
      width: 100,
      height: 100,
    };

    this.state.nodes.push(node);
    this.state.history.push(JSON.parse(JSON.stringify(this.state)));
    this.state.currentHistoryIndex++;

    this.render();
  }

  updateNodePosition(x, y) {
    if (this.state.nodes.length > 0) {
      this.state.nodes[this.state.nodes.length - 1].x = x;
      this.state.nodes[this.state.nodes.length - 1].y = y;

      this.state.history.push(JSON.parse(JSON.stringify(this.state)));
      this.state.currentHistoryIndex++;

      this.render();
    }
  }

  undo() {
    if (this.state.currentHistoryIndex > 0) {
      this.state.currentHistoryIndex--;
      this.state = JSON.parse(JSON.stringify(this.state.history[this.state.currentHistoryIndex]));
      this.render();
    }
  }

  redo() {
    if (this.state.currentHistoryIndex < this.state.history.length - 1) {
      this.state.currentHistoryIndex++;
      this.state = JSON.parse(JSON.stringify(this.state.history[this.state.currentHistoryIndex]));
      this.render();
    }
  }

  export() {
    const svg = this.viewport.svg.outerHTML;
    const png = this.getPNG();
    const json = JSON.stringify(this.state);

    this.downloadFile("vectra.svg", svg);
    this.downloadFile("vectra.png", png);
    this.downloadFile("vectra.json", json);
  }

  getPNG() {
    const canvas = document.createElement("canvas");
    canvas.width = this.viewport.svg.width.baseVal.value;
    canvas.height = this.viewport.svg.height.baseVal.value;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(this.viewport.svg, 0, 0);

    return canvas.toDataURL("image/png");
  }

  downloadFile(filename, data) {
    const a = document.createElement("a");
    a.href = `data:${typeof data},${data}`;
    a.download = filename;
    a.click();
  }

  render() {
    this.viewport.svg.innerHTML = "";

    for (const node of this.state.nodes) {
      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", node.x);
      rect.setAttribute("y", node.y);
      rect.setAttribute("width", node.width);
      rect.setAttribute("height", node.height);
      rect.setAttribute("fill", "black");

      this.viewport.svg.appendChild(rect);
    }
  }

  layerManagement() {
    console.log("Layer management clicked");
  }

  propertiesPanel() {
    console.log("Properties panel clicked");
  }

  feedback() {
    console.log("Feedback clicked");
  }

  notifications() {
    console.log("Notifications clicked");
  }

  loadState() {
    const storedState = localStorage.getItem("vectra-state");

    if (storedState) {
      this.state = JSON.parse(storedState);
      this.state.currentHistoryIndex = this.state.history.length - 1;
      this.render();
    }
  }

  saveState() {
    localStorage.setItem("vectra-state", JSON.stringify(this.state));
  }
}

const vectra = new VectraEngine();
</script>
</body>
</html>
