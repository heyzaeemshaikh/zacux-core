<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VectorMaster</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="h-screen w-screen bg-[#090d16] text-white overflow-hidden">
  <!-- Top Toolbar -->
  <nav class="flex justify-between items-center py-2 px-4 border-b border-gray-600">
    <h1 class="text-2xl font-bold">VectorMaster</h1>
    <div class="flex items-center space-x-2">
      <button class="bg-gray-800 hover:bg-gray-700 py-2 px-4 rounded" title="Undo">
        <i class="fas fa-undo"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 py-2 px-4 rounded" title="Redo">
        <i class="fas fa-redo"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 py-2 px-4 rounded" title="Save">
        <i class="fas fa-save"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 py-2 px-4 rounded" title="Export">
        <i class="fas fa-file-export"></i>
      </button>
    </div>
  </nav>
  
  <!-- Node Editing Panel (Floating) -->
  <aside class="fixed top-16 left-4 w-64 bg-gray-800 p-4 border rounded shadow-md">
    <h2 class="text-lg font-bold mb-2">Node Editing</h2>
    <div class="space-y-2">
      <label class="block">
        <span class="text-sm font-medium">X:</span>
        <input type="number" class="w-full p-2 bg-gray-700 border border-gray-600 rounded">
      </label>
      <label class="block">
        <span class="text-sm font-medium">Y:</span>
        <input type="number" class="w-full p-2 bg-gray-700 border border-gray-600 rounded">
      </label>
      <label class="block">
        <span class="text-sm font-medium">Width:</span>
        <input type="number" class="w-full p-2 bg-gray-700 border border-gray-600 rounded">
      </label>
      <label class="block">
        <span class="text-sm font-medium">Height:</span>
        <input type="number" class="w-full p-2 bg-gray-700 border border-gray-600 rounded">
      </label>
    </div>
  </aside>
  
  <!-- Layered Sidebar (Floating) -->
  <aside class="fixed top-16 right-4 w-64 bg-gray-800 p-4 border rounded shadow-md">
    <h2 class="text-lg font-bold mb-2">Layers</h2>
    <ul class="space-y-2">
      <li>
        <button class="w-full p-2 bg-gray-700 hover:bg-gray-600 border border-gray-600 rounded flex justify-between items-center">
          <span>Layer 1</span>
          <i class="fas fa-chevron-down"></i>
        </button>
      </li>
      <li>
        <button class="w-full p-2 bg-gray-700 hover:bg-gray-600 border border-gray-600 rounded flex justify-between items-center">
          <span>Layer 2</span>
          <i class="fas fa-chevron-down"></i>
        </button>
      </li>
    </ul>
  </aside>
  
  <!-- Main Viewport -->
  <main class="flex-1 relative">
    <canvas class="absolute inset-0" id="viewport"></canvas>
    <div class="absolute bottom-4 left-4 flex items-center space-x-2">
      <button class="bg-gray-800 hover:bg-gray-700 py-2 px-4 rounded" title="Zoom In">
        <i class="fas fa-search-plus"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 py-2 px-4 rounded" title="Zoom Out">
        <i class="fas fa-search-minus"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 py-2 px-4 rounded" title="Pan">
        <i class="fas fa-hand-paper"></i>
      </button>
    </div>
  </main>
  
  <!-- Status Panel (Bottom) -->
  <footer class="flex justify-between items-center py-2 px-4 border-t border-gray-600">
    <div class="flex items-center space-x-2">
      <span>Snapping: </span>
      <button class="bg-gray-800 hover:bg-gray-700 py-2 px-4 rounded" title="Snapping Toggle">
        <i class="fas fa-toggle-on"></i>
      </button>
    </div>
    <div class="flex items-center space-x-2">
      <span>Alignment: </span>
      <button class="bg-gray-800 hover:bg-gray-700 py-2 px-4 rounded" title="Alignment Toggle">
        <i class="fas fa-align-center"></i>
      </button>
    </div>
  </footer>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// Import required libraries
import Paper from 'paper';
import * as d3 from 'd3';
import { SVGOptimizer } from 'svgo';
import { createStore, combineReducers } from 'redux';
import { applyMiddleware, compose } from 'redux';

// Initialize Paper.js
Paper.setup(new Paper.Size(800, 600));

// Define Redux store
const initialState = {
  nodes: [],
  edges: [],
  undoHistory: [],
  redoHistory: []
};

const nodeReducer = (state = initialState.nodes, action) => {
  switch (action.type) {
    case 'ADD_NODE':
      return [...state, action.node];
    case 'REMOVE_NODE':
      return state.filter(node => node.id!== action.id);
    default:
      return state;
  }
};

const edgeReducer = (state = initialState.edges, action) => {
  switch (action.type) {
    case 'ADD_EDGE':
      return [...state, action.edge];
    case 'REMOVE_EDGE':
      return state.filter(edge => edge.id!== action.id);
    default:
      return state;
  }
};

const historyReducer = (state = initialState.undoHistory, action) => {
  switch (action.type) {
    case 'UNDO':
      return state.slice(0, -1);
    case 'REDO':
      return state.concat(action.state);
    default:
      return state;
  }
};

const rootReducer = combineReducers({
  nodes: nodeReducer,
  edges: edgeReducer,
  undoHistory: historyReducer
});

const store = createStore(rootReducer);

// Define actions
const addNode = (node) => {
  store.dispatch({ type: 'ADD_NODE', node });
};

const removeNode = (id) => {
  store.dispatch({ type: 'REMOVE_NODE', id });
};

const addEdge = (edge) => {
  store.dispatch({ type: 'ADD_EDGE', edge });
};

const removeEdge = (id) => {
  store.dispatch({ type: 'REMOVE_EDGE', id });
};

const undo = () => {
  store.dispatch({ type: 'UNDO' });
};

const redo = (state) => {
  store.dispatch({ type: 'REDO', state });
};

// Define event listeners
document.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // Handle canvas events
  canvas.addEventListener('mousedown', (e) => {
    const x = e.clientX;
    const y = e.clientY;
    addNode({ x, y, id: Math.random() });
  });

  canvas.addEventListener('mousemove', (e) => {
    const x = e.clientX;
    const y = e.clientY;
    const node = store.getState().nodes.find(node => node.x === x && node.y === y);
    if (node) {
      node.x = x;
      node.y = y;
    }
  });

  // Handle node editing panel events
  document.getElementById('node-edit-panel').addEventListener('click', (e) => {
    const nodeId = e.target.dataset.nodeId;
    const node = store.getState().nodes.find(node => node.id === nodeId);
    if (node) {
      removeNode(nodeId);
    }
  });

  // Handle layered sidebar events
  document.getElementById('layered-sidebar').addEventListener('click', (e) => {
    const layerId = e.target.dataset.layerId;
    const layer = store.getState().layers.find(layer => layer.id === layerId);
    if (layer) {
      addNode({ x: 0, y: 0, id: Math.random(), layerId });
    }
  });
});

// Define export logic
const exportAsPNG = () => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const png = canvas.toDataURL('image/png');
  const link = document.createElement('a');
  link.href = png;
  link.download = 'vector-master.png';
  link.click();
};

const exportAsSVG = () => {
  const svg = new SVGOptimizer();
  const nodes = store.getState().nodes;
  const edges = store.getState().edges;
  const svgData = svg.optimize({
    type: 'doc',
    children: nodes.map(node => ({
      type: 'elem',
      elem: 'circle',
      attrs: {
        cx: node.x,
        cy: node.y,
        r: 5
      }
    })).concat(edges.map(edge => ({
      type: 'elem',
      elem: 'line',
      attrs: {
        x1: edge.from.x,
        y1: edge.from.y,
        x2: edge.to.x,
        y2: edge.to.y
      }
    })))
  });
  const link = document.createElement('a');
  link.href = 'data:image/svg+xml,' + encodeURIComponent(svgData.data);
  link.download = 'vector-master.svg';
  link.click();
};

const exportAsJSON = () => {
  const nodes = store.getState().nodes;
  const edges = store.getState().edges;
  const jsonData = JSON.stringify({ nodes, edges });
  const link = document.createElement('a');
  link.href = 'data:application/json,' + encodeURIComponent(jsonData);
  link.download = 'vector-master.json';
  link.click();
};

// Define file download logic
const downloadFile = (filename, data) => {
  const link = document.createElement('a');
  link.href = 'data:application/octet-stream,' + encodeURIComponent(data);
  link.download = filename;
  link.click();
};

// Define undo/redo logic
const undoHistory = [];
const redoHistory = [];

const undoAction = () => {
  if (undoHistory.length > 0) {
    const state = undoHistory.pop();
    redoHistory.push(store.getState());
    store.dispatch({ type: 'UNDO', state });
  }
};

const redoAction = () => {
  if (redoHistory.length > 0) {
    const state = redoHistory.pop();
    undoHistory.push(store.getState());
    store.dispatch({ type: 'REDO', state });
  }
};

// Define local storage save/load logic
const saveToLocalStorage = () => {
  const state = store.getState();
  localStorage.setItem('vector-master-state', JSON.stringify(state));
};

const loadFromLocalStorage = () => {
  const state = JSON.parse(localStorage.getItem('vector-master-state'));
  if (state) {
    store.dispatch({ type: 'LOAD_STATE', state });
  }
};

// Initialize application
loadFromLocalStorage();

// Handle window events
window.addEventListener('beforeunload', () => {
  saveToLocalStorage();
});

window.addEventListener('load', () => {
  // Initialize Paper.js
  Paper.setup(new Paper.Size(800, 600));

  // Initialize D3.js
  d3.select('body')
   .append('svg')
   .attr('width', 800)
   .attr('height', 600);
});
</script>
</body>
</html>
