<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectrix</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="h-screen w-screen bg-[#090d16] text-white flex flex-col">
  <!-- Top Toolbar -->
  <div class="flex justify-between items-center p-4 border-b border-gray-700">
    <h1 class="text-2xl font-bold">Vectrix</h1>
    <div class="flex space-x-4">
      <button class="btn btn-primary" title="New File">
        <i class="fas fa-file fa-sm"></i>
      </button>
      <button class="btn btn-primary" title="Open File">
        <i class="fas fa-folder-open fa-sm"></i>
      </button>
      <button class="btn btn-primary" title="Save File">
        <i class="fas fa-save fa-sm"></i>
      </button>
      <button class="btn btn-primary" title="Undo">
        <i class="fas fa-undo fa-sm"></i>
      </button>
      <button class="btn btn-primary" title="Redo">
        <i class="fas fa-redo fa-sm"></i>
      </button>
    </div>
  </div>
  
  <!-- Main Workspace -->
  <div class="flex flex-1">
    <!-- Left Sidebar -->
    <div class="w-64 p-4 border-r border-gray-700">
      <h2 class="text-xl font-bold mb-4">Layers</h2>
      <ul>
        <li class="py-2 border-b border-gray-700">Layer 1</li>
        <li class="py-2 border-b border-gray-700">Layer 2</li>
        <li class="py-2 border-b border-gray-700">Layer 3</li>
      </ul>
      <h2 class="text-xl font-bold mt-4 mb-4">Node Editor</h2>
      <div class="flex flex-wrap space-x-2">
        <button class="btn btn-primary" title="Add Node">
          <i class="fas fa-plus fa-sm"></i>
        </button>
        <button class="btn btn-primary" title="Remove Node">
          <i class="fas fa-minus fa-sm"></i>
        </button>
      </div>
    </div>
    
    <!-- Main Viewport -->
    <div class="flex-1 p-4 overflow-auto">
      <div class="w-full h-full border border-gray-700" id="canvas">
        <!-- Canvas will be rendered here -->
      </div>
      <div class="absolute top-0 left-0 flex justify-center w-full py-2 border-b border-gray-700 bg-[#090d16]">
        <input type="range" id="zoom" min="0.1" max="10" step="0.1" value="1">
        <button class="btn btn-primary" title="Zoom In">
          <i class="fas fa-search-plus fa-sm"></i>
        </button>
        <button class="btn btn-primary" title="Zoom Out">
          <i class="fas fa-search-minus fa-sm"></i>
        </button>
      </div>
    </div>
    
    <!-- Right Sidebar -->
    <div class="w-64 p-4 border-l border-gray-700">
      <h2 class="text-xl font-bold mb-4">Tool Options</h2>
      <div class="flex flex-wrap space-x-2">
        <button class="btn btn-primary" title="Select Tool">
          <i class="fas fa-mouse-pointer fa-sm"></i>
        </button>
        <button class="btn btn-primary" title="Rectangle Tool">
          <i class="fas fa-square fa-sm"></i>
        </button>
        <button class="btn btn-primary" title="Ellipse Tool">
          <i class="fas fa-circle fa-sm"></i>
        </button>
      </div>
    </div>
  </div>
  
  <!-- Status Bar -->
  <div class="flex justify-between items-center p-4 border-t border-gray-700">
    <span>Files: 1, Nodes: 10, Zoom: 100%</span>
    <span> CPU: 20%, Memory: 500MB </span>
    <button class="btn btn-primary" title="Export">
      <i class="fas fa-file-export fa-sm"></i>
    </button>
    <button class="btn btn-primary" title="Settings">
      <i class="fas fa-cog fa-sm"></i>
    </button>
  </div>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// vectrix.js

class Vectrix {
  constructor() {
    this.state = {
      layers: [],
      nodes: [],
      undoHistory: [],
      redoHistory: []
    };
    this.storage = window.localStorage;
    this.autoSaveInterval = 10000; // 10 seconds

    this.toolbar = document.getElementById('toolbar');
    this.sidebar = document.getElementById('sidebar');
    this.viewport = document.getElementById('viewport');
    this.statusPanel = document.getElementById('status-panel');

    this.initUI();
    this.initEventListeners();
    this.initStateManagement();
    this.initAutoSave();
  }

  initUI() {
    this.toolbar.innerHTML = `
      <button id="undo-button">Undo</button>
      <button id="redo-button">Redo</button>
      <button id="save-button">Save</button>
      <button id="export-button">Export</button>
    `;

    this.sidebar.innerHTML = `
      <h2>Layers</h2>
      <ul id="layers-list"></ul>
      <h2>Nodes</h2>
      <ul id="nodes-list"></ul>
    `;

    this.viewport.innerHTML = `
      <canvas id="canvas" width="800" height="600"></canvas>
    `;

    this.statusPanel.innerHTML = `
      <p id="metrics-text">Metrics: 0 objects, 0 layers</p>
    `;
  }

  initEventListeners() {
    document.getElementById('undo-button').addEventListener('click', () => this.undo());
    document.getElementById('redo-button').addEventListener('click', () => this.redo());
    document.getElementById('save-button').addEventListener('click', () => this.save());
    document.getElementById('export-button').addEventListener('click', () => this.export());

    this.viewport.addEventListener('mousedown', (event) => this.handleMouseDown(event));
    this.viewport.addEventListener('mousemove', (event) => this.handleMouseMove(event));
    this.viewport.addEventListener('mouseup', (event) => this.handleMouseUp(event));
  }

  initStateManagement() {
    this.state = JSON.parse(this.storage.getItem('vectrix-state')) || this.state;
    this.state.layers.forEach((layer) => {
      const layerElement = document.createElement('li');
      layerElement.textContent = layer.name;
      document.getElementById('layers-list').appendChild(layerElement);
    });
    this.state.nodes.forEach((node) => {
      const nodeElement = document.createElement('li');
      nodeElement.textContent = node.name;
      document.getElementById('nodes-list').appendChild(nodeElement);
    });
  }

  initAutoSave() {
    setInterval(() => {
      this.save();
    }, this.autoSaveInterval);
  }

  handleMouseDown(event) {
    const canvas = document.getElementById('canvas');
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    console.log(`Mouse down at (${x}, ${y})`);
  }

  handleMouseMove(event) {
    const canvas = document.getElementById('canvas');
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    console.log(`Mouse move at (${x}, ${y})`);
  }

  handleMouseUp(event) {
    const canvas = document.getElementById('canvas');
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    console.log(`Mouse up at (${x}, ${y})`);
  }

  undo() {
    if (this.state.undoHistory.length > 0) {
      const currentState = this.state.undoHistory.pop();
      this.state = currentState;
      this.updateUI();
    }
  }

  redo() {
    if (this.state.redoHistory.length > 0) {
      const nextState = this.state.redoHistory.pop();
      this.state = nextState;
      this.updateUI();
    }
  }

  save() {
    this.storage.setItem('vectrix-state', JSON.stringify(this.state));
  }

  updateUI() {
    document.getElementById('layers-list').innerHTML = '';
    document.getElementById('nodes-list').innerHTML = '';
    this.state.layers.forEach((layer) => {
      const layerElement = document.createElement('li');
      layerElement.textContent = layer.name;
      document.getElementById('layers-list').appendChild(layerElement);
    });
    this.state.nodes.forEach((node) => {
      const nodeElement = document.createElement('li');
      nodeElement.textContent = node.name;
      document.getElementById('nodes-list').appendChild(nodeElement);
    });
  }

  export() {
    const exportFormat = prompt('Choose export format (PNG, SVG, JSON)');
    if (exportFormat === 'PNG') {
      this.exportPNG();
    } else if (exportFormat === 'SVG') {
      this.exportSVG();
    } else if (exportFormat === 'JSON') {
      this.exportJSON();
    }
  }

  exportPNG() {
    const canvas = document.getElementById('canvas');
    const dataURL = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = 'vectrix.png';
    a.click();
  }

  exportSVG() {
    const svg = document.getElementById('canvas').outerHTML;
    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'vectrix.svg';
    a.click();
  }

  exportJSON() {
    const json = JSON.stringify(this.state);
    const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'vectrix.json';
    a.click();
  }
}

const vectrix = new Vectrix();
</script>
</body>
</html>
