<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VectorForge</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<div class="h-screen w-screen flex flex-col bg-[#090d16] text-white">
  <!-- Top Toolbar -->
  <div class="flex justify-between p-2 border-b border-gray-600">
    <div class="flex items-center">
      <i class="fa fa-vector-square fa-lg mr-2"></i>
      <span>VectorForge</span>
    </div>
    <div class="flex items-center space-x-2">
      <button class="px-2 py-1 bg-gray-800 hover:bg-gray-700 rounded">
        <i class="fa fa-file fa-lg mr-2"></i> New
      </button>
      <button class="px-2 py-1 bg-gray-800 hover:bg-gray-700 rounded">
        <i class="fa fa-folder fa-lg mr-2"></i> Open
      </button>
      <button class="px-2 py-1 bg-gray-800 hover:bg-gray-700 rounded">
        <i class="fa fa-save fa-lg mr-2"></i> Save
      </button>
    </div>
  </div>
  <!-- Main Content -->
  <div class="flex flex-1">
    <!-- Left Sidebar -->
    <div class="w-64 p-2 border-r border-gray-600">
      <div class="mb-4">
        <h2 class="mb-2">Layers</h2>
        <ul>
          <li class="py-1 border-b border-gray-600">
            <i class="fa fa-layer-group fa-lg mr-2"></i> Layer 1
          </li>
          <li class="py-1 border-b border-gray-600">
            <i class="fa fa-layer-group fa-lg mr-2"></i> Layer 2
          </li>
        </ul>
      </div>
      <div>
        <h2 class="mb-2">Tool Options</h2>
        <ul>
          <li class="py-1 border-b border-gray-600">
            <i class="fa fa-pen fa-lg mr-2"></i> Pencil
          </li>
          <li class="py-1 border-b border-gray-600">
            <i class="fa fa-vector-square fa-lg mr-2"></i> Shape
          </li>
        </ul>
      </div>
    </div>
    <!-- Main Viewport -->
    <div class="flex-1 p-2 relative">
      <canvas id="viewport" class="w-full h-full absolute"></canvas>
      <div class="absolute top-0 left-0 w-full h-full">
        <i class="fa fa-arrows fa-lg absolute top-2 left-2"></i>
        <i class="fa fa-undo fa-lg absolute top-2 right-2"></i>
        <i class="fa fa-redo fa-lg absolute bottom-2 right-2"></i>
      </div>
    </div>
    <!-- Floating Side Panels -->
    <div class="absolute right-0 top-0 w-64 p-2 border border-gray-600 bg-gray-800">
      <h2 class="mb-2">Properties</h2>
      <ul>
        <li class="py-1 border-b border-gray-600">
          <i class="fa fa-font fa-lg mr-2"></i> Font
        </li>
        <li class="py-1 border-b border-gray-600">
          <i class="fa fa-paint-brush fa-lg mr-2"></i> Color
        </li>
      </ul>
    </div>
    <div class="absolute right-0 bottom-0 w-64 p-2 border border-gray-600 bg-gray-800">
      <h2 class="mb-2">Help</h2>
      <ul>
        <li class="py-1 border-b border-gray-600">
          <i class="fa fa-question fa-lg mr-2"></i> FAQ
        </li>
        <li class="py-1 border-b border-gray-600">
          <i class="fa fa-book fa-lg mr-2"></i> Documentation
        </li>
      </ul>
    </div>
  </div>
  <!-- Bottom Status Panel -->
  <div class="flex justify-between p-2 border-t border-gray-600">
    <div class="flex items-center space-x-2">
      <i class="fa fa-circle fa-lg text-green-500 mr-2"></i>
      <span>Connected</span>
    </div>
    <div class="flex items-center space-x-2">
      <i class="fa fa-clock fa-lg mr-2"></i>
      <span>12:00 PM</span>
    </div>
    <div class="flex items-center space-x-2">
      <i class="fa fa-battery-full fa-lg mr-2"></i>
      <span>100%</span>
    </div>
  </div>
</div>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// VectorForge Engine
class VectorForge {
  constructor() {
    this.state = {
      nodes: [],
      selectedNode: null,
      undoHistory: [],
      redoHistory: []
    };
    this.localStorageKey = 'vector-forge-state';
    this.canvas = document.getElementById('canvas');
    this.ctx = this.canvas.getContext('2d');
    this.toolbar = document.getElementById('toolbar');
    this.sidebar = document.getElementById('sidebar');
    this.viewport = document.getElementById('viewport');
    this.statusPanel = document.getElementById('status-panel');
    this.initEventListeners();
    this.loadStateFromLocalStorage();
  }

  initEventListeners() {
    this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
    this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));
    this.toolbar.addEventListener('click', (e) => this.handleToolbarClick(e));
    this.sidebar.addEventListener('click', (e) => this.handleSidebarClick(e));
  }

  handleMouseDown(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    this.state.selectedNode = this.getNodeAtPosition(x, y);
    if (this.state.selectedNode) {
      this.state.selectedNode.x = x;
      this.state.selectedNode.y = y;
    } else {
      this.state.selectedNode = { x, y, width: 0, height: 0 };
      this.state.nodes.push(this.state.selectedNode);
    }
    this.updateCanvas();
  }

  handleMouseMove(e) {
    if (this.state.selectedNode) {
      const rect = this.canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      this.state.selectedNode.x = x;
      this.state.selectedNode.y = y;
      this.updateCanvas();
    }
  }

  handleMouseUp(e) {
    this.state.selectedNode = null;
  }

  handleToolbarClick(e) {
    if (e.target.id === 'undo-button') {
      this.undo();
    } else if (e.target.id === 'redo-button') {
      this.redo();
    } else if (e.target.id === 'save-button') {
      this.saveStateToLocalStorage();
    } else if (e.target.id === 'export-button') {
      this.exportFile();
    }
  }

  handleSidebarClick(e) {
    if (e.target.id === 'layer-button') {
      this.toggleLayer();
    }
  }

  getNodeAtPosition(x, y) {
    for (const node of this.state.nodes) {
      if (x >= node.x && x <= node.x + node.width && y >= node.y && y <= node.y + node.height) {
        return node;
      }
    }
    return null;
  }

  updateCanvas() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    for (const node of this.state.nodes) {
      this.ctx.fillStyle = 'black';
      this.ctx.fillRect(node.x, node.y, node.width, node.height);
    }
  }

  saveStateToLocalStorage() {
    localStorage.setItem(this.localStorageKey, JSON.stringify(this.state));
  }

  loadStateFromLocalStorage() {
    const storedState = localStorage.getItem(this.localStorageKey);
    if (storedState) {
      this.state = JSON.parse(storedState);
      this.updateCanvas();
    }
  }

  undo() {
    if (this.state.undoHistory.length > 0) {
      const previousState = this.state.undoHistory.pop();
      this.state = previousState;
      this.updateCanvas();
    }
  }

  redo() {
    if (this.state.redoHistory.length > 0) {
      const nextState = this.state.redoHistory.pop();
      this.state = nextState;
      this.updateCanvas();
    }
  }

  exportFile() {
    const fileFormat = document.getElementById('file-format').value;
    const fileName = document.getElementById('file-name').value;
    if (fileFormat === 'png') {
      this.exportPng(fileName);
    } else if (fileFormat === 'svg') {
      this.exportSvg(fileName);
    } else if (fileFormat === 'json') {
      this.exportJson(fileName);
    }
  }

  exportPng(fileName) {
    const link = document.createElement('a');
    link.href = this.canvas.toDataURL('image/png');
    link.download = fileName + '.png';
    link.click();
  }

  exportSvg(fileName) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', this.canvas.width);
    svg.setAttribute('height', this.canvas.height);
    for (const node of this.state.nodes) {
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', node.x);
      rect.setAttribute('y', node.y);
      rect.setAttribute('width', node.width);
      rect.setAttribute('height', node.height);
      rect.setAttribute('fill', 'black');
      svg.appendChild(rect);
    }
    const serializer = new XMLSerializer();
    const svgString = serializer.serializeToString(svg);
    const link = document.createElement('a');
    link.href = 'data:image/svg+xml,' + encodeURIComponent(svgString);
    link.download = fileName + '.svg';
    link.click();
  }

  exportJson(fileName) {
    const json = JSON.stringify(this.state);
    const link = document.createElement('a');
    link.href = 'data:application/json,' + encodeURIComponent(json);
    link.download = fileName + '.json';
    link.click();
  }

  toggleLayer() {
    const layerButton = document.getElementById('layer-button');
    if (layerButton.classList.contains('active')) {
      layerButton.classList.remove('active');
    } else {
      layerButton.classList.add('active');
    }
  }
}

const vectorForge = new VectorForge();
</script>
</body>
</html>
