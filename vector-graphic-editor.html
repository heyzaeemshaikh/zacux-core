<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectra</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="bg-[#090d16] text-white h-screen">
  <!-- Top Toolbar -->
  <header class="flex justify-between py-2 px-4 border-b border-gray-600">
    <div class="flex items-center">
      <button class="btn btn-sm btn-primary mr-2" id="new-file-btn">
        <i class="fas fa-file fa-sm mr-1"></i> New
      </button>
      <button class="btn btn-sm btn-primary mr-2" id="open-file-btn">
        <i class="fas fa-folder-open fa-sm mr-1"></i> Open
      </button>
      <button class="btn btn-sm btn-primary mr-2" id="save-file-btn">
        <i class="fas fa-save fa-sm mr-1"></i> Save
      </button>
      <button class="btn btn-sm btn-primary mr-2" id="undo-btn">
        <i class="fas fa-undo fa-sm mr-1"></i> Undo
      </button>
      <button class="btn btn-sm btn-primary mr-2" id="redo-btn">
        <i class="fas fa-redo fa-sm mr-1"></i> Redo
      </button>
    </div>
    <div class="flex items-center">
      <span class="mr-2">Vectra</span>
      <span class="font-bold mr-2">vector-graphic-editor</span>
    </div>
  </header>

  <!-- Left Sidebar (Layers and Assets) -->
  <aside class="w-64 bg-[#171a29] h-screen p-4 border-r border-gray-600 fixed left-0 top-12">
    <h5 class="text-sm font-bold mb-2">Layers</h5>
    <ul class="list-none mb-4">
      <li class="py-1 border-b border-gray-600">
        <i class="fas fa-layer-group fa-sm mr-1"></i> Layer 1
      </li>
      <li class="py-1 border-b border-gray-600">
        <i class="fas fa-layer-group fa-sm mr-1"></i> Layer 2
      </li>
    </ul>
    <h5 class="text-sm font-bold mb-2">Assets</h5>
    <ul class="list-none">
      <li class="py-1 border-b border-gray-600">
        <i class="fas fa-image fa-sm mr-1"></i> Image 1
      </li>
      <li class="py-1 border-b border-gray-600">
        <i class="fas fa-image fa-sm mr-1"></i> Image 2
      </li>
    </ul>
  </aside>

  <!-- Main Viewport (Canvas and Node Editing Tools) -->
  <main class="ml-64 p-4 h-screen">
    <div class="bg-white h-full rounded-md shadow-md p-4 relative">
      <canvas id="editor-canvas" width="800" height="600"></canvas>
      <div class="absolute top-0 left-0 p-2 bg-[#171a29] rounded-md">
        <button class="btn btn-sm btn-primary mr-2" id="select-tool-btn">
          <i class="fas fa-mouse-pointer fa-sm mr-1"></i> Select
        </button>
        <button class="btn btn-sm btn-primary mr-2" id="rectangle-tool-btn">
          <i class="fas fa-square fa-sm mr-1"></i> Rectangle
        </button>
        <button class="btn btn-sm btn-primary mr-2" id="ellipse-tool-btn">
          <i class="fas fa-circle fa-sm mr-1"></i> Ellipse
        </button>
      </div>
    </div>
  </main>

  <!-- Right Sidebar (Properties and Styling) -->
  <aside class="w-64 bg-[#171a29] h-screen p-4 border-l border-gray-600 fixed right-0 top-12">
    <h5 class="text-sm font-bold mb-2">Properties</h5>
    <div class="mb-4">
      <label class="block text-sm font-bold mb-1" for="property-name">Name</label>
      <input type="text" id="property-name" class="form-input block w-full">
    </div>
    <div class="mb-4">
      <label class="block text-sm font-bold mb-1" for="property-fill">Fill</label>
      <input type="color" id="property-fill" class="form-input block w-full">
    </div>
    <h5 class="text-sm font-bold mb-2">Styling</h5>
    <div class="mb-4">
      <label class="block text-sm font-bold mb-1" for="styling-stroke">Stroke</label>
      <input type="color" id="styling-stroke" class="form-input block w-full">
    </div>
    <div class="mb-4">
      <label class="block text-sm font-bold mb-1" for="styling-stroke-width">Stroke Width</label>
      <input type="number" id="styling-stroke-width" class="form-input block w-full">
    </div>
  </aside>

  <!-- Status Panel (Notifications and Progress Indicators) -->
  <footer class="bg-[#171a29] p-4 border-t border-gray-600 fixed bottom-0 left-0 right-0">
    <div class="flex justify-between">
      <div class="flex items-center">
        <i class="fas fa-spinner fa-spin fa-sm mr-1"></i> Processing...
      </div>
      <div class="flex items-center">
        <i class="fas fa-bell fa-sm mr-1"></i> Notifications
      </div>
      <div class="flex items-center">
        <i class="fas fa-sync fa-spin fa-sm mr-1"></i> Auto Saving...
      </div>
    </div>
  </footer>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// Core Engine Class
class VectraEngine {
  constructor() {
    this.state = {
      nodes: [],
      layers: [],
      assets: [],
      undoHistory: [],
      redoHistory: []
    };

    this.localStorageKey = 'vectra-state';
    this.fileExportOptions = ['png', 'jpeg', 'svg'];
    this.canvas = document.getElementById('canvas');
    this.ctx = this.canvas.getContext('2d');
    this.tools = {
      nodeEditing: {}
    };

    this.initEventListeners();
    this.initStateStore();
    this.initCanvas();
  }

  // Initialize Event Listeners
  initEventListeners() {
    this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
    this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));

    document.getElementById('undo-btn').addEventListener('click', () => this.undo());
    document.getElementById('redo-btn').addEventListener('click', () => this.redo());

    document.getElementById('save-btn').addEventListener('click', () => this.saveToFile());
  }

  // Initialize State Store
  initStateStore() {
    const storedState = localStorage.getItem(this.localStorageKey);
    if (storedState) {
      this.state = JSON.parse(storedState);
    }

    this.state.listeners = [];
    this.state.addListener = (listener) => {
      this.state.listeners.push(listener);
    };

    this.state.removeListener = (listener) => {
      this.state.listeners = this.state.listeners.filter((l) => l!== listener);
    };

    this.state.notifyListeners = () => {
      this.state.listeners.forEach((listener) => listener(this.state));
    };

    this.autoSave = setInterval(() => {
      this.saveToLocalStorage();
    }, 1000);
  }

  // Initialize Canvas
  initCanvas() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    this.drawNodes();
    this.drawLayers();
    this.drawAssets();
  }

  // Draw Nodes
  drawNodes() {
    this.state.nodes.forEach((node) => {
      this.ctx.fillStyle = node.color;
      this.ctx.fillRect(node.x, node.y, node.width, node.height);
    });
  }

  // Draw Layers
  drawLayers() {
    this.state.layers.forEach((layer) => {
      this.ctx.fillStyle = layer.color;
      this.ctx.fillRect(layer.x, layer.y, layer.width, layer.height);
    });
  }

  // Draw Assets
  drawAssets() {
    this.state.assets.forEach((asset) => {
      this.ctx.drawImage(asset.image, asset.x, asset.y, asset.width, asset.height);
    });
  }

  // Handle Mouse Down
  handleMouseDown(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    this.state.nodes.forEach((node) => {
      if (x >= node.x && x <= node.x + node.width && y >= node.y && y <= node.y + node.height) {
        node.selected = true;
      } else {
        node.selected = false;
      }
    });
  }

  // Handle Mouse Up
  handleMouseUp(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    this.state.nodes.forEach((node) => {
      if (node.selected) {
        node.x = x;
        node.y = y;
      }
    });
  }

  // Handle Mouse Move
  handleMouseMove(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    this.state.nodes.forEach((node) => {
      if (node.selected) {
        node.x = x;
        node.y = y;
      }
    });
  }

  // Undo
  undo() {
    if (this.state.undoHistory.length > 0) {
      const previousState = this.state.undoHistory.pop();
      this.state.redoHistory.push(this.state);
      this.state = previousState;
      this.notifyStateChange();
    }
  }

  // Redo
  redo() {
    if (this.state.redoHistory.length > 0) {
      const nextState = this.state.redoHistory.pop();
      this.state.undoHistory.push(this.state);
      this.state = nextState;
      this.notifyStateChange();
    }
  }

  // Save To Local Storage
  saveToLocalStorage() {
    localStorage.setItem(this.localStorageKey, JSON.stringify(this.state));
  }

  // Save To File
  saveToFile() {
    const fileName = 'vectra-state.json';
    const file = new Blob([JSON.stringify(this.state)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = fileName;
    a.click();
  }

  // Notify State Change
  notifyStateChange() {
    this.state.notifyListeners();
    this.initCanvas();
  }

  // Export To File
  exportToFile(type) {
    if (this.fileExportOptions.includes(type)) {
      const fileName = `vectra-${type}.${type}`;
      let file;

      if (type === 'png' || type === 'jpeg') {
        const dataURL = this.canvas.toDataURL(`image/${type}`);
        file = new Blob([dataURL], { type: `image/${type}` });
      } else if (type === 'svg') {
        const svg = this.getSVG();
        file = new Blob([svg], { type: 'image/svg+xml' });
      }

      const a = document.createElement('a');
      a.href = URL.createObjectURL(file);
      a.download = fileName;
      a.click();
    }
  }

  // Get SVG
  getSVG() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', this.canvas.width);
    svg.setAttribute('height', this.canvas.height);

    this.state.nodes.forEach((node) => {
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', node.x);
      rect.setAttribute('y', node.y);
      rect.setAttribute('width', node.width);
      rect.setAttribute('height', node.height);
      rect.setAttribute('fill', node.color);
      svg.appendChild(rect);
    });

    const svgString = new XMLSerializer().serializeToString(svg);
    return svgString;
  }
}

// Create Instance
const vectraEngine = new VectraEngine();

// Add Buttons Event Listeners
document.getElementById('export-png-btn').addEventListener('click', () => vectraEngine.exportToFile('png'));
document.getElementById('export-jpeg-btn').addEventListener('click', () => vectraEngine.exportToFile('jpeg'));
document.getElementById('export-svg-btn').addEventListener('click', () => vectraEngine.exportToFile('svg'));
</script>
</body>
</html>
