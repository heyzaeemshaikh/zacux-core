<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VectorPro</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body>
  <!-- Background and overall layout -->
  <div class="h-screen w-full bg-[#090d16] flex flex-col">
    <!-- Top toolbar -->
    <div class="flex justify-between p-4 border-b border-gray-600">
      <div class="flex">
        <button class="text-white mx-2">
          <i class="fas fa-file fa-lg"></i>
        </button>
        <button class="text-white mx-2">
          <i class="fas fa-save fa-lg"></i>
        </button>
      </div>
      <div class="flex">
        <button class="text-white mx-2">
          <i class="fas fa-undo fa-lg"></i>
        </button>
        <button class="text-white mx-2">
          <i class="fas fa-redo fa-lg"></i>
        </button>
      </div>
    </div>
    <!-- Main content area -->
    <div class="flex flex-grow">
      <!-- Main viewport for graphic editing -->
      <div class="flex-grow p-4 overflow-auto">
        <!-- This is where the graphic editing happens -->
      </div>
      <!-- Floating side panel for layers -->
      <div class="p-4 border-l border-gray-600">
        <div class="text-white mb-2">
          Layers
        </div>
        <!-- Layers are listed here -->
      </div>
      <!-- Floating side panel for node editing -->
      <div class="p-4 border-l border-gray-600">
        <div class="text-white mb-2">
          Node Editing
        </div>
        <!-- Node editing options are here -->
      </div>
    </div>
    <!-- Status bar at the bottom -->
    <div class="p-4 border-t border-gray-600 text-white">
      Status Bar
    </div>
  </div>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
class VectorPro {
  constructor() {
    this.state = {
      nodes: [],
      layers: [],
      shapes: [],
      selectedNode: null,
      selectedIndex: null,
      undoHistory: [],
      redoHistory: [],
    };

    this.toolbar = document.getElementById('toolbar');
    this.sidebar = document.getElementById('sidebar');
    this.viewport = document.getElementById('viewport');
    this.statusPanel = document.getElementById('status-panel');

    this.toolbar.addEventListener('click', (e) => this.handleToolbarClick(e));
    this.viewport.addEventListener('click', (e) => this.handleViewportClick(e));
    this.viewport.addEventListener('mousedown', (e) => this.handleMouseDown(e));
    this.viewport.addEventListener('mousemove', (e) => this.handleMouseMove(e));
    this.viewport.addEventListener('mouseup', (e) => this.handleMouseUp(e));

    this.loadStateFromLocalStorage();

    this.draw();
  }

  handleToolbarClick(e) {
    if (e.target.classList.contains('shape-option')) {
      this.addShape(e.target.dataset.shape);
    } else if (e.target.classList.contains('layer-option')) {
      this.addLayer();
    }
  }

  handleViewportClick(e) {
    const node = this.getNodeAtPosition(e.clientX, e.clientY);
    if (node) {
      this.selectNode(node);
    } else {
      this.deselectNode();
    }
  }

  handleMouseDown(e) {
    if (e.button === 0) {
      this.startDrag(e.clientX, e.clientY);
    }
  }

  handleMouseMove(e) {
    if (this.isDragging) {
      this.drag(e.clientX, e.clientY);
    }
  }

  handleMouseUp(e) {
    if (e.button === 0) {
      this.endDrag();
    }
  }

  loadStateFromLocalStorage() {
    const storedState = localStorage.getItem('vector-pro-state');
    if (storedState) {
      this.state = JSON.parse(storedState);
    }
  }

  saveStateToLocalStorage() {
    localStorage.setItem('vector-pro-state', JSON.stringify(this.state));
  }

  addShape(shape) {
    const node = {
      id: Date.now(),
      type: shape,
      x: 100,
      y: 100,
      width: 100,
      height: 100,
    };
    this.state.nodes.push(node);
    this.saveStateToLocalStorage();
    this.draw();
  }

  addLayer() {
    const layer = {
      id: Date.now(),
      name: 'Layer ' + (this.state.layers.length + 1),
      nodes: [],
    };
    this.state.layers.push(layer);
    this.saveStateToLocalStorage();
    this.draw();
  }

  getNodeAtPosition(x, y) {
    for (const node of this.state.nodes) {
      if (x >= node.x && x <= node.x + node.width && y >= node.y && y <= node.y + node.height) {
        return node;
      }
    }
    return null;
  }

  selectNode(node) {
    this.state.selectedNode = node;
    this.state.selectedIndex = this.state.nodes.indexOf(node);
    this.saveStateToLocalStorage();
    this.draw();
  }

  deselectNode() {
    this.state.selectedNode = null;
    this.state.selectedIndex = null;
    this.saveStateToLocalStorage();
    this.draw();
  }

  startDrag(x, y) {
    this.isDragging = true;
    this.dragStartPosition = { x, y };
  }

  drag(x, y) {
    if (this.state.selectedNode) {
      const node = this.state.selectedNode;
      node.x += x - this.dragStartPosition.x;
      node.y += y - this.dragStartPosition.y;
      this.dragStartPosition = { x, y };
      this.saveStateToLocalStorage();
      this.draw();
    }
  }

  endDrag() {
    this.isDragging = false;
  }

  draw() {
    const ctx = this.viewport.getContext('2d');
    ctx.clearRect(0, 0, this.viewport.width, this.viewport.height);
    for (const node of this.state.nodes) {
      ctx.fillStyle = 'black';
      ctx.fillRect(node.x, node.y, node.width, node.height);
    }
  }

  exportPNG() {
    const ctx = this.viewport.getContext('2d');
    const dataURL = this.viewport.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = 'vector-pro-export.png';
    a.click();
  }

  exportSVG() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', this.viewport.width);
    svg.setAttribute('height', this.viewport.height);
    for (const node of this.state.nodes) {
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', node.x);
      rect.setAttribute('y', node.y);
      rect.setAttribute('width', node.width);
      rect.setAttribute('height', node.height);
      rect.setAttribute('fill', 'black');
      svg.appendChild(rect);
    }
    const serializer = new XMLSerializer();
    const svgString = serializer.serializeToString(svg);
    const a = document.createElement('a');
    a.href = 'data:image/svg+xml,' + encodeURIComponent(svgString);
    a.download = 'vector-pro-export.svg';
    a.click();
  }

  exportJSON() {
    const json = JSON.stringify(this.state);
    const a = document.createElement('a');
    a.href = 'data:application/json,' + encodeURIComponent(json);
    a.download = 'vector-pro-export.json';
    a.click();
  }

  undo() {
    if (this.state.undoHistory.length > 0) {
      const prevState = this.state.undoHistory.pop();
      this.state = prevState;
      this.saveStateToLocalStorage();
      this.draw();
    }
  }

  redo() {
    if (this.state.redoHistory.length > 0) {
      const nextState = this.state.redoHistory.pop();
      this.state = nextState;
      this.saveStateToLocalStorage();
      this.draw();
    }
  }
}

const vectorPro = new VectorPro();

document.getElementById('export-png').addEventListener('click', () => vectorPro.exportPNG());
document.getElementById('export-svg').addEventListener('click', () => vectorPro.exportSVG());
document.getElementById('export-json').addEventListener('click', () => vectorPro.exportJSON());
document.getElementById('undo').addEventListener('click', () => vectorPro.undo());
document.getElementById('redo').addEventListener('click', () => vectorPro.redo());
</script>
</body>
</html>
