<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectra</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<div class="min-h-screen flex flex-col bg-gray-900 text-gray-100" id="vectra-app">
  <!-- Top Toolbar -->
  <div class="flex justify-between items-center p-4 border-b border-gray-700" id="top-toolbar">
    <div class="flex items-center">
      <button class="btn btn-sm btn-secondary mr-2" id="undo-btn" title="Undo">
        <i class="fas fa-undo"></i>
      </button>
      <button class="btn btn-sm btn-secondary mr-2" id="redo-btn" title="Redo">
        <i class="fas fa-redo"></i>
      </button>
      <button class="btn btn-sm btn-secondary mr-2" id="node-editing-btn" title="Node Editing">
        <i class="fas fa-edit"></i>
      </button>
      <button class="btn btn-sm btn-secondary mr-2" id="layer-management-btn" title="Layer Management">
        <i class="fas fa-layer-group"></i>
      </button>
    </div>
    <div class="flex items-center">
      <button class="btn btn-sm btn-secondary mr-2" id="export-btn" title="Export">
        <i class="fas fa-file-export"></i>
      </button>
      <button class="btn btn-sm btn-secondary mr-2" id="import-btn" title="Import">
        <i class="fas fa-file-import"></i>
      </button>
    </div>
  </div>

  <!-- Left Sidebar -->
  <div class="flex flex-row" id="left-sidebar">
    <div class="w-64 bg-gray-800 p-4 border-r border-gray-700" id="layer-panel">
      <h5 class="text-lg font-bold mb-2">Layers</h5>
      <ul>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group mr-2"></i>
          <span>Layer 1</span>
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group mr-2"></i>
          <span>Layer 2</span>
        </li>
      </ul>
    </div>
    <div class="w-64 bg-gray-800 p-4" id="object-library">
      <h5 class="text-lg font-bold mb-2">Object Library</h5>
      <ul>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-vector-square mr-2"></i>
          <span>Rectangle</span>
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-vector-circle mr-2"></i>
          <span>Circle</span>
        </li>
      </ul>
    </div>
  </div>

  <!-- Main Viewport -->
  <div class="flex-1 flex flex-row" id="main-viewport">
    <div class="flex-1 bg-gray-900" id="svg-canvas">
      <svg width="100%" height="100%" id="vectra-svg"></svg>
    </div>
    <div class="absolute top-0 right-0 p-4" id="context-menu">
      <button class="btn btn-sm btn-secondary" id="context-menu-btn" title="Context Menu">
        <i class="fas fa-ellipsis-v"></i>
      </button>
      <ul class="bg-gray-800 p-4 border border-gray-700" id="context-menu-list">
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-cut mr-2"></i>
          <span>Cut</span>
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-copy mr-2"></i>
          <span>Copy</span>
        </li>
      </ul>
    </div>
  </div>

  <!-- Bottom Status Panel -->
  <div class="flex justify-between items-center p-4 border-t border-gray-700" id="bottom-status-panel">
    <div class="flex items-center">
      <span id="status-text">Ready</span>
    </div>
    <div class="flex items-center">
      <button class="btn btn-sm btn-secondary mr-2" id="notification-btn" title="Notifications">
        <i class="fas fa-bell"></i>
      </button>
      <button class="btn btn-sm btn-secondary mr-2" id="settings-btn" title="Settings">
        <i class="fas fa-cog"></i>
      </button>
    </div>
  </div>
</div>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// Vectra Engine
class VectraEngine {
  constructor() {
    this.state = {
      nodes: [],
      layers: [],
      undoHistory: [],
      redoHistory: []
    };

    this.localStorageKey = 'vectra-state';
    this.loadFromLocalStorage();

    this.canvas = document.getElementById('canvas');
    this.ctx = this.canvas.getContext('2d');

    this.toolbar = document.getElementById('toolbar');
    this.sidebar = document.getElementById('sidebar');
    this.viewport = document.getElementById('viewport');
    this.statusPanel = document.getElementById('status-panel');

    this.addEventListeners();
  }

  addEventListeners() {
    this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
    this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));

    this.toolbar.addEventListener('click', (e) => this.handleToolbarClick(e));
    this.sidebar.addEventListener('click', (e) => this.handleSidebarClick(e));
  }

  handleMouseDown(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const node = this.getNodeAt(x, y);
    if (node) {
      this.selectNode(node);
    } else {
      this.createNode(x, y);
    }
  }

  handleMouseMove(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (this.selectedNode) {
      this.updateNodePosition(this.selectedNode, x, y);
    }
  }

  handleMouseUp(e) {
    this.selectedNode = null;
  }

  handleToolbarClick(e) {
    if (e.target.id === 'undo-button') {
      this.undo();
    } else if (e.target.id === 'redo-button') {
      this.redo();
    }
  }

  handleSidebarClick(e) {
    if (e.target.id === 'layer-button') {
      this.createLayer();
    } else if (e.target.id === 'object-button') {
      this.createObject();
    }
  }

  getNodeAt(x, y) {
    for (const node of this.state.nodes) {
      if (node.x <= x && x <= node.x + node.width && node.y <= y && y <= node.y + node.height) {
        return node;
      }
    }
    return null;
  }

  selectNode(node) {
    this.selectedNode = node;
  }

  createNode(x, y) {
    const node = {
      x,
      y,
      width: 100,
      height: 100,
      type: 'rect'
    };
    this.state.nodes.push(node);
    this.saveToLocalStorage();
  }

  updateNodePosition(node, x, y) {
    node.x = x;
    node.y = y;
    this.saveToLocalStorage();
  }

  createLayer() {
    const layer = {
      name: 'New Layer',
      nodes: []
    };
    this.state.layers.push(layer);
    this.saveToLocalStorage();
  }

  createObject() {
    const object = {
      type: 'rect',
      x: 100,
      y: 100,
      width: 100,
      height: 100
    };
    this.state.nodes.push(object);
    this.saveToLocalStorage();
  }

  undo() {
    if (this.state.undoHistory.length > 0) {
      const state = this.state.undoHistory.pop();
      this.state = state;
      this.saveToLocalStorage();
    }
  }

  redo() {
    if (this.state.redoHistory.length > 0) {
      const state = this.state.redoHistory.pop();
      this.state = state;
      this.saveToLocalStorage();
    }
  }

  saveToLocalStorage() {
    localStorage.setItem(this.localStorageKey, JSON.stringify(this.state));
  }

  loadFromLocalStorage() {
    const storedState = localStorage.getItem(this.localStorageKey);
    if (storedState) {
      this.state = JSON.parse(storedState);
    }
  }

  exportPNG() {
    const canvas = document.createElement('canvas');
    canvas.width = this.canvas.width;
    canvas.height = this.canvas.height;
    const ctx = canvas.getContext('2d');

    for (const node of this.state.nodes) {
      ctx.fillStyle = 'black';
      ctx.fillRect(node.x, node.y, node.width, node.height);
    }

    const dataURL = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = 'vectra.png';
    a.click();
  }

  exportSVG() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', this.canvas.width);
    svg.setAttribute('height', this.canvas.height);

    for (const node of this.state.nodes) {
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', node.x);
      rect.setAttribute('y', node.y);
      rect.setAttribute('width', node.width);
      rect.setAttribute('height', node.height);
      svg.appendChild(rect);
    }

    const serializer = new XMLSerializer();
    const svgString = serializer.serializeToString(svg);
    const blob = new Blob([svgString], { type: 'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'vectra.svg';
    a.click();
  }

  exportJSON() {
    const json = JSON.stringify(this.state);
    const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'vectra.json';
    a.click();
  }
}

const vectraEngine = new VectraEngine();

document.getElementById('export-png-button').addEventListener('click', () => vectraEngine.exportPNG());
document.getElementById('export-svg-button').addEventListener('click', () => vectraEngine.exportSVG());
document.getElementById('export-json-button').addEventListener('click', () => vectraEngine.exportJSON());
</script>
</body>
</html>
