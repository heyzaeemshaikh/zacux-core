<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectra</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="h-screen bg-gray-900 text-gray-100 flex flex-col">
  <header class="top-toolbar bg-gray-800 py-2 flex justify-between">
    <div class="flex items-center">
      <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 mx-2 rounded">
        <i class="fas fa-file text-lg"></i> New
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 mx-2 rounded">
        <i class="fas fa-folder-open text-lg"></i> Open
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 mx-2 rounded">
        <i class="fas fa-save text-lg"></i> Save
      </button>
    </div>
    <div class="flex items-center">
      <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 mx-2 rounded">
        <i class="fas fa-cog text-lg"></i> Settings
      </button>
    </div>
  </header>
  <div class="flex flex-1 h-screen">
    <aside class="left-sidebar w-64 bg-gray-800 py-4 px-2">
      <h2 class="text-lg font-bold mb-2">Layers</h2>
      <ul>
        <li class="py-2 px-4 hover:bg-gray-700 cursor-pointer">Layer 1</li>
        <li class="py-2 px-4 hover:bg-gray-700 cursor-pointer">Layer 2</li>
        <li class="py-2 px-4 hover:bg-gray-700 cursor-pointer">Layer 3</li>
      </ul>
    </aside>
    <main class="main-viewport flex-1 h-screen overflow-auto relative">
      <div class="svg-editor h-full w-full">
        <!-- SVG Canvas -->
      </div>
    </main>
    <aside class="right-sidebar w-64 bg-gray-800 py-4 px-2">
      <h2 class="text-lg font-bold mb-2">Node Editor</h2>
      <form>
        <label class="block mb-2">
          <span class="text-lg font-bold">Node ID</span>
          <input type="text" class="block w-full p-2 border border-gray-600 rounded">
        </label>
        <label class="block mb-2">
          <span class="text-lg font-bold">Node Type</span>
          <select class="block w-full p-2 border border-gray-600 rounded">
            <option>Circle</option>
            <option>Rect</option>
            <option>Line</option>
          </select>
        </label>
      </form>
    </aside>
  </div>
  <footer class="status-panel bg-gray-800 py-2 flex justify-between">
    <div class="flex items-center">
      <i class="fas fa-sync-alt text-lg mx-2"></i> Processing...
    </div>
    <div class="flex items-center">
      <i class="fas fa-exclamation-circle text-lg mx-2"></i> Errors: 0
    </div>
    <div class="flex items-center">
      <i class="fas fa-check-circle text-lg mx-2"></i> Success: 0
    </div>
  </footer>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// vectra.js
class Vectra {
  constructor() {
    this.state = {
      nodes: [],
      selectedNode: null,
      undoHistory: [],
      redoHistory: []
    };

    this.localStorageKey = 'vectra-state';
    this.loadStateFromLocalStorage();

    this.canvas = document.getElementById('canvas');
    this.ctx = this.canvas.getContext('2d');

    this.toolbar = document.getElementById('toolbar');
    this.layerSidebar = document.getElementById('layer-sidebar');
    this.mainViewport = document.getElementById('main-viewport');
    this.nodeEditingSidebar = document.getElementById('node-editing-sidebar');
    this.statusPanel = document.getElementById('status-panel');

    this.initEventListeners();
    this.initCanvas();
    this.initStateManagement();
    this.initFileExport();
  }

  initEventListeners() {
    this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
    this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));

    this.toolbar.addEventListener('click', (e) => this.handleToolbarClick(e));
    this.layerSidebar.addEventListener('click', (e) => this.handleLayerSidebarClick(e));
    this.nodeEditingSidebar.addEventListener('click', (e) => this.handleNodeEditingSidebarClick(e));
  }

  initCanvas() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.ctx.fillStyle = 'white';
    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
  }

  initStateManagement() {
    this.stateStore = {
      nodes: this.state.nodes,
      selectedNode: this.state.selectedNode,
      undoHistory: this.state.undoHistory,
      redoHistory: this.state.redoHistory
    };

    this.rehydrateState();
  }

  initFileExport() {
    this.exportButton = document.getElementById('export-button');
    this.exportButton.addEventListener('click', (e) => this.handleExportClick(e));
  }

  handleMouseDown(e) {
    const x = e.clientX;
    const y = e.clientY;
    const node = this.getNodeAtPosition(x, y);

    if (node) {
      this.state.selectedNode = node;
      this.stateStore.selectedNode = node;
      this.rehydrateState();
    }
  }

  handleMouseMove(e) {
    const x = e.clientX;
    const y = e.clientY;
    const node = this.getNodeAtPosition(x, y);

    if (node) {
      this.state.selectedNode = node;
      this.stateStore.selectedNode = node;
      this.rehydrateState();
    }
  }

  handleMouseUp(e) {
    const x = e.clientX;
    const y = e.clientY;
    const node = this.getNodeAtPosition(x, y);

    if (node) {
      this.state.selectedNode = null;
      this.stateStore.selectedNode = null;
      this.rehydrateState();
    }
  }

  handleToolbarClick(e) {
    const target = e.target;

    if (target.id === 'new-button') {
      this.createNewNode();
    } else if (target.id === 'save-button') {
      this.saveStateToLocalStorage();
    } else if (target.id === 'load-button') {
      this.loadStateFromLocalStorage();
    }
  }

  handleLayerSidebarClick(e) {
    const target = e.target;

    if (target.id === 'add-layer-button') {
      this.addLayer();
    } else if (target.id === 'remove-layer-button') {
      this.removeLayer();
    }
  }

  handleNodeEditingSidebarClick(e) {
    const target = e.target;

    if (target.id === 'edit-node-button') {
      this.editNode();
    } else if (target.id === 'delete-node-button') {
      this.deleteNode();
    }
  }

  handleExportClick(e) {
    const format = e.target.value;

    if (format === 'png') {
      this.exportAsPng();
    } else if (format === 'svg') {
      this.exportAsSvg();
    } else if (format === 'json') {
      this.exportAsJson();
    }
  }

  createNewNode() {
    const node = {
      x: 100,
      y: 100,
      width: 100,
      height: 100,
      fill: 'red'
    };

    this.state.nodes.push(node);
    this.stateStore.nodes = this.state.nodes;
    this.rehydrateState();
  }

  addLayer() {
    const layer = {
      name: 'New Layer',
      nodes: []
    };

    this.state.layers.push(layer);
    this.stateStore.layers = this.state.layers;
    this.rehydrateState();
  }

  removeLayer() {
    const layerIndex = this.state.layers.indexOf(this.state.selectedLayer);
    this.state.layers.splice(layerIndex, 1);
    this.stateStore.layers = this.state.layers;
    this.rehydrateState();
  }

  editNode() {
    const node = this.state.selectedNode;
    node.fill = 'blue';
    this.stateStore.nodes = this.state.nodes;
    this.rehydrateState();
  }

  deleteNode() {
    const nodeIndex = this.state.nodes.indexOf(this.state.selectedNode);
    this.state.nodes.splice(nodeIndex, 1);
    this.stateStore.nodes = this.state.nodes;
    this.rehydrateState();
  }

  exportAsPng() {
    const link = document.createElement('a');
    link.href = this.canvas.toDataURL('image/png');
    link.download = 'vectra.png';
    link.click();
  }

  exportAsSvg() {
    const svg = this.canvas.toDataURL('image/svg+xml');
    const link = document.createElement('a');
    link.href = svg;
    link.download = 'vectra.svg';
    link.click();
  }

  exportAsJson() {
    const json = JSON.stringify(this.state);
    const link = document.createElement('a');
    link.href = 'data:application/json,' + encodeURIComponent(json);
    link.download = 'vectra.json';
    link.click();
  }

  getNodeAtPosition(x, y) {
    for (const node of this.state.nodes) {
      if (x >= node.x && x <= node.x + node.width && y >= node.y && y <= node.y + node.height) {
        return node;
      }
    }

    return null;
  }

  rehydrateState() {
    this.stateStore = {
      nodes: this.state.nodes,
      selectedNode: this.state.selectedNode,
      undoHistory: this.state.undoHistory,
      redoHistory: this.state.redoHistory
    };

    this.saveStateToLocalStorage();
  }

  saveStateToLocalStorage() {
    localStorage.setItem(this.localStorageKey, JSON.stringify(this.state));
  }

  loadStateFromLocalStorage() {
    const storedState = localStorage.getItem(this.localStorageKey);

    if (storedState) {
      this.state = JSON.parse(storedState);
    }
  }
}

const vectra = new Vectra();
</script>
</body>
</html>
