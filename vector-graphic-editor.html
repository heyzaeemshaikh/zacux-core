<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectra</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="h-screen w-screen bg-gray-900 text-gray-100 flex flex-col overflow-hidden" id="vectra-app">
  <!-- Top Toolbar -->
  <nav class="flex justify-between items-center py-2 bg-gray-800 border-b border-gray-700">
    <div class="flex items-center">
      <button class="text-lg font-bold mr-4">Vectra</button>
      <button class="mr-2">
        <i class="fas fa-file fa-lg"></i>
      </button>
      <button class="mr-2">
        <i class="fas fa-edit fa-lg"></i>
      </button>
      <button class="mr-2">
        <i class="fas fa-share fa-lg"></i>
      </button>
    </div>
    <div class="flex items-center">
      <button class="mr-2">
        <i class="fas fa-undo fa-lg"></i>
      </button>
      <button class="mr-2">
        <i class="fas fa-redo fa-lg"></i>
      </button>
      <button class="mr-4">
        <i class="fas fa-cog fa-lg"></i>
      </button>
    </div>
  </nav>

  <!-- Left Sidebar -->
  <div class="flex h-screen">
    <aside class="w-64 bg-gray-800 p-4 border-r border-gray-700">
      <h5 class="text-lg font-bold mb-2">Layers</h5>
      <ul>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group fa-lg mr-2"></i>
          Layer 1
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group fa-lg mr-2"></i>
          Layer 2
        </li>
      </ul>
      <h5 class="text-lg font-bold mt-4 mb-2">Assets</h5>
      <ul>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-image fa-lg mr-2"></i>
          Image 1
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-image fa-lg mr-2"></i>
          Image 2
        </li>
      </ul>
    </aside>

    <!-- Main Viewport -->
    <main class="flex-1 overflow-auto p-4">
      <div class="h-screen w-screen bg-gray-700" id="canvas">
        <!-- Canvas Rendering -->
      </div>
    </main>

    <!-- Right Sidebar -->
    <aside class="w-64 bg-gray-800 p-4 border-l border-gray-700">
      <h5 class="text-lg font-bold mb-2">Properties</h5>
      <form>
        <label class="block mb-2">
          <span class="text-lg font-bold">Fill Color</span>
          <input type="color" class="block w-full mt-1" value="#ffffff">
        </label>
        <label class="block mb-2">
          <span class="text-lg font-bold">Stroke Color</span>
          <input type="color" class="block w-full mt-1" value="#000000">
        </label>
      </form>
      <h5 class="text-lg font-bold mt-4 mb-2">Settings</h5>
      <form>
        <label class="block mb-2">
          <span class="text-lg font-bold">Grid Size</span>
          <input type="number" class="block w-full mt-1" value="10">
        </label>
        <label class="block mb-2">
          <span class="text-lg font-bold">Snap to Grid</span>
          <input type="checkbox" class="block w-full mt-1">
        </label>
      </form>
    </aside>
  </div>

  <!-- Status Panel -->
  <div class="bg-gray-800 p-2 border-t border-gray-700 text-sm">
    <span class="mr-2">
      <i class="fas fa-circle fa-lg text-green-500"></i>
      Connected
    </span>
    <span class="mr-2">
      <i class="fas fa-spinner fa-lg text-blue-500"></i>
      Loading...
    </span>
    <span class="mr-2">
      <i class="fas fa-exclamation-circle fa-lg text-yellow-500"></i>
      Warning
    </span>
  </div>

  <!-- Floating Side Panels -->
  <div class="fixed bottom-0 right-0 mb-4 mr-4">
    <button class="bg-gray-800 hover:bg-gray-700 text-gray-100 py-2 px-4 rounded">
      <i class="fas fa-question-circle fa-lg mr-2"></i>
      Help
    </button>
  </div>
  <div class="fixed top-0 right-0 mt-4 mr-4">
    <button class="bg-gray-800 hover:bg-gray-700 text-gray-100 py-2 px-4 rounded">
      <i class="fas fa-cog fa-lg mr-2"></i>
      Settings
    </button>
  </div>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// Vectra Vector Graphic Editor Engine

// Core Engine
class VectraEngine {
  constructor() {
    this.state = {
      nodes: [],
      selectedNode: null,
      undoHistory: [],
      redoHistory: []
    };
    this.nodes = {};
    this.toolbar = null;
    this.sidebar = null;
    this.viewport = null;
    this.properties = null;
    this.statusPanel = null;
    this.snapshots = {};
    this.localStorageKey = 'vectra-editor-state';
    this.init();
  }

  init() {
    this.createToolbar();
    this.createSidebar();
    this.createViewport();
    this.createProperties();
    this.createStatusPanel();
    this.loadState();
    this.addEventListeners();
  }

  createToolbar() {
    this.toolbar = document.createElement('div');
    this.toolbar.id = 'toolbar';
    document.body.appendChild(this.toolbar);
  }

  createSidebar() {
    this.sidebar = document.createElement('div');
    this.sidebar.id = 'sidebar';
    document.body.appendChild(this.sidebar);
  }

  createViewport() {
    this.viewport = document.createElement('div');
    this.viewport.id = 'viewport';
    document.body.appendChild(this.viewport);
    this.canvas = document.createElement('canvas');
    this.canvas.id = 'canvas';
    this.viewport.appendChild(this.canvas);
    this.ctx = this.canvas.getContext('2d');
  }

  createProperties() {
    this.properties = document.createElement('div');
    this.properties.id = 'properties';
    document.body.appendChild(this.properties);
  }

  createStatusPanel() {
    this.statusPanel = document.createElement('div');
    this.statusPanel.id = 'status-panel';
    document.body.appendChild(this.statusPanel);
  }

  loadState() {
    const storedState = localStorage.getItem(this.localStorageKey);
    if (storedState) {
      this.state = JSON.parse(storedState);
      this.loadNodes();
    }
  }

  saveState() {
    localStorage.setItem(this.localStorageKey, JSON.stringify(this.state));
  }

  addEventListeners() {
    this.canvas.addEventListener('click', (e) => this.handleCanvasClick(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleCanvasMouseMove(e));
    this.canvas.addEventListener('mousedown', (e) => this.handleCanvasMouseDown(e));
    this.canvas.addEventListener('mouseup', (e) => this.handleCanvasMouseUp(e));
  }

  handleCanvasClick(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const node = this.getNodeAt(x, y);
    if (node) {
      this.selectNode(node);
    }
  }

  handleCanvasMouseMove(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const node = this.getNodeAt(x, y);
    if (node) {
      this.updateNode(node, x, y);
    }
  }

  handleCanvasMouseDown(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const node = this.getNodeAt(x, y);
    if (node) {
      this.selectNode(node);
    }
  }

  handleCanvasMouseUp(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const node = this.getNodeAt(x, y);
    if (node) {
      this.updateNode(node, x, y);
    }
  }

  getNodeAt(x, y) {
    for (const node of this.state.nodes) {
      if (node.x <= x && x <= node.x + node.width && node.y <= y && y <= node.y + node.height) {
        return node;
      }
    }
    return null;
  }

  updateNode(node, x, y) {
    node.x = x;
    node.y = y;
    this.saveState();
    this.redrawCanvas();
  }

  selectNode(node) {
    this.state.selectedNode = node;
    this.saveState();
    this.redrawCanvas();
  }

  redrawCanvas() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    for (const node of this.state.nodes) {
      this.ctx.fillStyle = node.color;
      this.ctx.fillRect(node.x, node.y, node.width, node.height);
    }
  }

  createNode(x, y, width, height, color) {
    const node = {
      x,
      y,
      width,
      height,
      color
    };
    this.state.nodes.push(node);
    this.saveState();
    this.redrawCanvas();
  }

  addUndoHistory() {
    this.state.undoHistory.push(JSON.parse(JSON.stringify(this.state.nodes)));
  }

  addRedoHistory() {
    this.state.redoHistory.push(JSON.parse(JSON.stringify(this.state.nodes)));
  }

  undo() {
    if (this.state.undoHistory.length > 0) {
      this.state.nodes = this.state.undoHistory.pop();
      this.redrawCanvas();
    }
  }

  redo() {
    if (this.state.redoHistory.length > 0) {
      this.state.nodes = this.state.redoHistory.pop();
      this.redrawCanvas();
    }
  }

  exportPNG() {
    const link = document.createElement('a');
    link.href = this.canvas.toDataURL();
    link.download = 'vectra-export.png';
    link.click();
  }

  exportSVG() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', this.canvas.width);
    svg.setAttribute('height', this.canvas.height);
    for (const node of this.state.nodes) {
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', node.x);
      rect.setAttribute('y', node.y);
      rect.setAttribute('width', node.width);
      rect.setAttribute('height', node.height);
      rect.setAttribute('fill', node.color);
      svg.appendChild(rect);
    }
    const svgString = new XMLSerializer().serializeToString(svg);
    const link = document.createElement('a');
    link.href = 'data:image/svg+xml,' + encodeURIComponent(svgString);
    link.download = 'vectra-export.svg';
    link.click();
  }

  exportJSON() {
    const json = JSON.stringify(this.state.nodes);
    const link = document.createElement('a');
    link.href = 'data:application/json,' + encodeURIComponent(json);
    link.download = 'vectra-export.json';
    link.click();
  }

  loadJSON(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const nodes = JSON.parse(e.target.result);
      this.state.nodes = nodes;
      this.saveState();
      this.redrawCanvas();
    };
    reader.readAsText(file);
  }
}

const vectra = new VectraEngine();

// UI Layout
document.addEventListener('DOMContentLoaded', () => {
  const toolbar = document.getElementById('toolbar');
  const sidebar = document.getElementById('sidebar');
  const viewport = document.getElementById('viewport');
  const properties = document.getElementById('properties');
  const statusPanel = document.getElementById('status-panel');
  toolbar.innerHTML = `
    <button id="create-node">Create Node</button>
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <button id="export-png">Export PNG</button>
    <button id="export-svg">Export SVG</button>
    <button id="export-json">Export JSON</button>
    <input id="load-json" type="file" accept=".json">
  `;
  sidebar.innerHTML = `
    <h2>Layers</h2>
    <ul id="layers"></ul>
    <h2>Assets</h2>
    <ul id="assets"></ul>
  `;
  viewport.innerHTML = `
    <canvas id="canvas" width="800" height="600"></canvas>
  `;
  properties.innerHTML = `
    <h2>Properties</h2>
    <ul id="properties-list"></ul>
  `;
  statusPanel.innerHTML = `
    <h2>Status</h2>
    <p id="status-message"></p>
  `;
  document.getElementById('create-node').addEventListener('click', () => {
    vectra.createNode(10, 10, 50, 50, 'red');
  });
  document.getElementById('undo').addEventListener('click', () => {
    vectra.undo();
  });
  document.getElementById('redo').addEventListener('click', () => {
    vectra.redo();
  });
  document.getElementById('export-png').addEventListener('click', () => {
    vectra.exportPNG();
  });
  document.getElementById('export-svg').addEventListener('click', () => {
    vectra.exportSVG();
  });
  document.getElementById('export-json').addEventListener('click', () => {
    vectra.exportJSON();
  });
  document.getElementById('load-json').addEventListener('change', (e) => {
    vectra.loadJSON(e.target.files[0]);
  });
});
</script>
</body>
</html>
