<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VectorForge</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="h-screen w-screen bg-gray-900 text-gray-100 flex flex-col">
  <!-- Top Toolbar -->
  <nav class="flex justify-between items-center py-2 bg-gray-800 border-b border-gray-700">
    <div class="flex items-center">
      <i class="fas fa-vector-square text-gray-100 mr-2"></i>
      <span class="text-lg font-bold">VectorForge</span>
    </div>
    <div class="flex items-center justify-center">
      <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 rounded mr-2" title="New Project">
        <i class="fas fa-plus text-gray-100"></i>
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 rounded mr-2" title="Open Project">
        <i class="fas fa-folder-open text-gray-100"></i>
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 rounded mr-2" title="Save Project">
        <i class="fas fa-save text-gray-100"></i>
      </button>
    </div>
    <div class="flex items-center justify-end">
      <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 rounded mr-2" title="Undo">
        <i class="fas fa-undo text-gray-100"></i>
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 rounded mr-2" title="Redo">
        <i class="fas fa-redo text-gray-100"></i>
      </button>
    </div>
  </nav>

  <!-- Left Sidebar (Layer Management) -->
  <div class="flex flex-row h-screen">
    <div class="bg-gray-800 w-64 p-4 border-r border-gray-700">
      <h2 class="text-lg font-bold mb-2">Layers</h2>
      <ul>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group text-gray-100 mr-2"></i>
          <span>Layer 1</span>
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group text-gray-100 mr-2"></i>
          <span>Layer 2</span>
        </li>
      </ul>
      <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 rounded mt-2" title="New Layer">
        <i class="fas fa-plus text-gray-100"></i>
      </button>
    </div>

    <!-- Central Canvas Viewport -->
    <div class="flex-grow h-screen">
      <div class="relative w-full h-full">
        <svg class="absolute top-0 left-0 w-full h-full" id="canvas"></svg>
        <div class="absolute top-0 left-0 w-full h-full">
          <div class="flex justify-center items-center h-full">
            <i class="fas fa-vector-square text-gray-100 text-5xl"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Sidebar (Properties Panel) -->
    <div class="bg-gray-800 w-64 p-4 border-l border-gray-700">
      <h2 class="text-lg font-bold mb-2">Properties</h2>
      <form>
        <div class="mb-4">
          <label class="block text-gray-100 text-sm font-bold mb-2" for="name">Name</label>
          <input class="bg-gray-700 text-gray-100 border border-gray-600 py-2 px-4 w-full" id="name" type="text">
        </div>
        <div class="mb-4">
          <label class="block text-gray-100 text-sm font-bold mb-2" for="color">Color</label>
          <input class="bg-gray-700 text-gray-100 border border-gray-600 py-2 px-4 w-full" id="color" type="color">
        </div>
      </form>
    </div>
  </div>

  <!-- Bottom Status Panel -->
  <div class="bg-gray-800 p-2 border-t border-gray-700 text-sm flex justify-between items-center">
    <span>Zoom: 100%</span>
    <span>Selected: None</span>
    <span>Collaborators: 0</span>
  </div>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
class VectorForge {
  constructor() {
    this.state = {
      nodes: [],
      selectedNode: null,
      undoHistory: [],
      redoHistory: []
    };
    this.localStorageKey = 'vector-forge-state';
    this.loadStateFromLocalStorage();

    this.toolbar = document.getElementById('toolbar');
    this.layerSidebar = document.getElementById('layer-sidebar');
    this.canvasViewport = document.getElementById('canvas-viewport');
    this.propertiesPanel = document.getElementById('properties-panel');
    this.statusPanel = document.getElementById('status-panel');

    this.canvas = document.createElement('canvas');
    this.canvas.width = 800;
    this.canvas.height = 600;
    this.canvasViewport.appendChild(this.canvas);

    this.ctx = this.canvas.getContext('2d');
    this.svgParser = new SVGParser();
    this.exportEngine = new ExportEngine();

    this.addEventListenerToListeners();
    this.addEventListenersToDOM();
  }

  addEventListenerToListeners() {
    this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
    this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));
  }

  addEventListenersToDOM() {
    document.addEventListener('keydown', (e) => this.handleKeyDown(e));
    document.addEventListener('wheel', (e) => this.handleWheel(e));
  }

  handleMouseDown(e) {
    const x = e.clientX;
    const y = e.clientY;
    const node = this.getNodeAtPosition(x, y);
    if (node) {
      this.state.selectedNode = node;
      this.updatePropertiesPanel();
    } else {
      this.state.selectedNode = null;
      this.updatePropertiesPanel();
    }
  }

  handleMouseMove(e) {
    const x = e.clientX;
    const y = e.clientY;
    if (this.state.selectedNode) {
      this.state.selectedNode.x = x;
      this.state.selectedNode.y = y;
      this.updateCanvas();
    }
  }

  handleMouseUp(e) {
    this.state.selectedNode = null;
    this.updatePropertiesPanel();
  }

  handleKeyDown(e) {
    if (e.key === 'z' && e.ctrlKey) {
      this.undoLastAction();
    } else if (e.key === 'y' && e.ctrlKey) {
      this.redoLastAction();
    }
  }

  handleWheel(e) {
    if (e.deltaY < 0) {
      this.zoomIn();
    } else if (e.deltaY > 0) {
      this.zoomOut();
    }
  }

  getNodeAtPosition(x, y) {
    for (const node of this.state.nodes) {
      if (x >= node.x && x <= node.x + node.width && y >= node.y && y <= node.y + node.height) {
        return node;
      }
    }
    return null;
  }

  updatePropertiesPanel() {
    if (this.state.selectedNode) {
      const properties = {
        x: this.state.selectedNode.x,
        y: this.state.selectedNode.y,
        width: this.state.selectedNode.width,
        height: this.state.selectedNode.height
      };
      this.propertiesPanel.innerHTML = '';
      for (const key in properties) {
        const p = document.createElement('p');
        p.textContent = `${key}: ${properties[key]}`;
        this.propertiesPanel.appendChild(p);
      }
    } else {
      this.propertiesPanel.innerHTML = '';
    }
  }

  updateCanvas() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    for (const node of this.state.nodes) {
      this.ctx.fillStyle = node.fill;
      this.ctx.fillRect(node.x, node.y, node.width, node.height);
    }
  }

  undoLastAction() {
    if (this.state.undoHistory.length > 0) {
      const lastAction = this.state.undoHistory.pop();
      this.state.redoHistory.push(lastAction);
      this.state = lastAction.state;
      this.updateCanvas();
    }
  }

  redoLastAction() {
    if (this.state.redoHistory.length > 0) {
      const lastAction = this.state.redoHistory.pop();
      this.state.undoHistory.push(lastAction);
      this.state = lastAction.state;
      this.updateCanvas();
    }
  }

  zoomIn() {
    this.canvas.width *= 1.1;
    this.canvas.height *= 1.1;
  }

  zoomOut() {
    this.canvas.width /= 1.1;
    this.canvas.height /= 1.1;
  }

  saveStateToLocalStorage() {
    localStorage.setItem(this.localStorageKey, JSON.stringify(this.state));
  }

  loadStateFromLocalStorage() {
    const state = localStorage.getItem(this.localStorageKey);
    if (state) {
      this.state = JSON.parse(state);
    }
  }

  exportAsPNG() {
    const dataURL = this.canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = 'vector-forge.png';
    a.click();
  }

  exportAsSVG() {
    const svg = this.svgParser.parse(this.state.nodes);
    const dataURL = 'data:image/svg+xml,' + encodeURIComponent(svg);
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = 'vector-forge.svg';
    a.click();
  }

  exportAsJSON() {
    const data = JSON.stringify(this.state);
    const dataURL = 'data:application/json,' + encodeURIComponent(data);
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = 'vector-forge.json';
    a.click();
  }

  exportAsFile() {
    const data = new Blob([JSON.stringify(this.state)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(data);
    a.download = 'vector-forge.json';
    a.click();
  }
}

class SVGParser {
  parse(nodes) {
    let svg = '<svg width="100%" height="100%">';
    for (const node of nodes) {
      svg += `<rect x="${node.x}" y="${node.y}" width="${node.width}" height="${node.height}" fill="${node.fill}" />`;
    }
    svg += '</svg>';
    return svg;
  }
}

class ExportEngine {
  exportAsPNG(canvas) {
    return canvas.toDataURL('image/png');
  }

  exportAsSVG(nodes) {
    const svg = new SVGParser().parse(nodes);
    return svg;
  }

  exportAsJSON(state) {
    return JSON.stringify(state);
  }
}

new VectorForge();
</script>
</body>
</html>
