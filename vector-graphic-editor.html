<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectra</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="h-screen bg-gray-900 text-gray-200 flex flex-col">
  <!-- Top Toolbar -->
  <div class="flex justify-between items-center py-2 bg-gray-800 border-b border-gray-700">
    <div class="flex items-center">
      <h1 class="text-lg font-bold ml-4">Vectra</h1>
      <a href="#" class="text-gray-200 hover:text-white ml-4">File</a>
      <a href="#" class="text-gray-200 hover:text-white ml-4">Edit</a>
      <a href="#" class="text-gray-200 hover:text-white ml-4">View</a>
    </div>
    <div class="flex items-center">
      <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 rounded mr-2">
        <i class="fas fa-undo fa-lg text-gray-200"></i>
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 rounded mr-2">
        <i class="fas fa-redo fa-lg text-gray-200"></i>
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 rounded mr-4">
        <i class="fas fa-save fa-lg text-gray-200"></i>
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 rounded mr-2" id="theme-toggle">
        <i class="fas fa-moon fa-lg text-gray-200"></i>
      </button>
    </div>
  </div>

  <!-- Left Sidebar (Layer Management) -->
  <div class="hidden md:flex md:w-64 xl:w-80 p-4 flex-col bg-gray-800 border-r border-gray-700 h-screen">
    <h2 class="text-lg font-bold mb-2">Layers</h2>
    <ul>
      <li class="py-2 border-b border-gray-700">
        <a href="#" class="text-gray-200 hover:text-white flex items-center">
          <i class="fas fa-layer-group fa-lg mr-2"></i>
          Layer 1
        </a>
      </li>
      <li class="py-2 border-b border-gray-700">
        <a href="#" class="text-gray-200 hover:text-white flex items-center">
          <i class="fas fa-layer-group fa-lg mr-2"></i>
          Layer 2
        </a>
      </li>
      <li class="py-2 border-b border-gray-700">
        <a href="#" class="text-gray-200 hover:text-white flex items-center">
          <i class="fas fa-layer-group fa-lg mr-2"></i>
          Layer 3
        </a>
      </li>
    </ul>
    <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 rounded mt-4 w-full">
      <i class="fas fa-plus fa-lg text-gray-200 mr-2"></i>
      New Layer
    </button>
  </div>

  <!-- Central Canvas Viewport -->
  <div class="flex-1 flex justify-center items-center overflow-hidden">
    <svg id="canvas" class="w-full h-full" width="100%" height="100%"></svg>
  </div>

  <!-- Right Sidebar (Properties and Node Editing Tools) -->
  <div class="hidden md:flex md:w-64 xl:w-80 p-4 flex-col bg-gray-800 border-l border-gray-700 h-screen">
    <h2 class="text-lg font-bold mb-2">Properties</h2>
    <form>
      <label class="block text-gray-200 text-sm mb-2" for="node-name">Node Name:</label>
      <input type="text" id="node-name" class="bg-gray-700 text-gray-200 py-2 px-4 rounded w-full mb-2">
      <label class="block text-gray-200 text-sm mb-2" for="node-x">X:</label>
      <input type="number" id="node-x" class="bg-gray-700 text-gray-200 py-2 px-4 rounded w-full mb-2">
      <label class="block text-gray-200 text-sm mb-2" for="node-y">Y:</label>
      <input type="number" id="node-y" class="bg-gray-700 text-gray-200 py-2 px-4 rounded w-full mb-2">
    </form>
    <button class="bg-gray-700 hover:bg-gray-600 py-2 px-4 rounded mt-4 w-full">
      <i class="fas fa-edit fa-lg text-gray-200 mr-2"></i>
      Edit Node
    </button>
  </div>

  <!-- Bottom Status Panel -->
  <div class="flex justify-between items-center py-2 bg-gray-800 border-t border-gray-700">
    <p class="text-gray-200 ml-4">Zoom: 100% | Selected Node: None</p>
    <p class="text-gray-200 mr-4">Vectra - Vector Graphic Editor</p>
  </div>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// Import required libraries
const fs = require('fs');
const { createCanvas } = require('canvas');

// Initialize the application
class Vectra {
  constructor() {
    this.state = {
      nodes: [],
      selectedNode: null,
      undoHistory: [],
      redoHistory: []
    };
    this.localStorage = window.localStorage;
    this.canvas = document.getElementById('canvas');
    this.ctx = this.canvas.getContext('2d');
    this.toolbar = document.getElementById('toolbar');
    this.layerManagement = document.getElementById('layer-management');
    this.propertiesPanel = document.getElementById('properties-panel');
    this.nodeEditingTools = document.getElementById('node-editing-tools');
    this.statusPanel = document.getElementById('status-panel');
    this.initEventListeners();
    this.initState();
  }

  // Initialize event listeners
  initEventListeners() {
    this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
    this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));
    this.toolbar.addEventListener('click', (e) => this.handleToolbarClick(e));
    this.layerManagement.addEventListener('click', (e) => this.handleLayerManagementClick(e));
    this.propertiesPanel.addEventListener('click', (e) => this.handlePropertiesPanelClick(e));
    this.nodeEditingTools.addEventListener('click', (e) => this.handleNodeEditingToolsClick(e));
  }

  // Initialize state
  initState() {
    const storedState = this.localStorage.getItem('vectra-state');
    if (storedState) {
      this.state = JSON.parse(storedState);
    }
    this.renderCanvas();
  }

  // Handle mouse down event
  handleMouseDown(e) {
    const node = this.getNodeAtPosition(e.clientX, e.clientY);
    if (node) {
      this.state.selectedNode = node;
      this.renderCanvas();
    }
  }

  // Handle mouse move event
  handleMouseMove(e) {
    if (this.state.selectedNode) {
      this.state.selectedNode.x = e.clientX;
      this.state.selectedNode.y = e.clientY;
      this.renderCanvas();
    }
  }

  // Handle mouse up event
  handleMouseUp(e) {
    this.state.selectedNode = null;
    this.renderCanvas();
  }

  // Handle toolbar click event
  handleToolbarClick(e) {
    const target = e.target;
    if (target.id === 'undo-button') {
      this.undo();
    } else if (target.id === 'redo-button') {
      this.redo();
    } else if (target.id === 'save-button') {
      this.save();
    } else if (target.id === 'export-button') {
      this.export();
    }
  }

  // Handle layer management click event
  handleLayerManagementClick(e) {
    const target = e.target;
    if (target.id === 'add-layer-button') {
      this.addLayer();
    } else if (target.id === 'remove-layer-button') {
      this.removeLayer();
    }
  }

  // Handle properties panel click event
  handlePropertiesPanelClick(e) {
    const target = e.target;
    if (target.id === 'node-properties-button') {
      this.showNodeProperties();
    }
  }

  // Handle node editing tools click event
  handleNodeEditingToolsClick(e) {
    const target = e.target;
    if (target.id === 'node-editing-tools-button') {
      this.showNodeEditingTools();
    }
  }

  // Get node at position
  getNodeAtPosition(x, y) {
    for (const node of this.state.nodes) {
      if (node.x <= x && node.x + node.width >= x && node.y <= y && node.y + node.height >= y) {
        return node;
      }
    }
    return null;
  }

  // Render canvas
  renderCanvas() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    for (const node of this.state.nodes) {
      this.ctx.fillStyle = node.color;
      this.ctx.fillRect(node.x, node.y, node.width, node.height);
    }
    this.ctx.fillStyle = 'black';
    this.ctx.font = '12px Arial';
    this.ctx.textAlign = 'left';
    this.ctx.textBaseline = 'top';
    for (const node of this.state.nodes) {
      this.ctx.fillText(node.text, node.x, node.y);
    }
  }

  // Undo
  undo() {
    if (this.state.undoHistory.length > 0) {
      const previousState = this.state.undoHistory.pop();
      this.state = previousState;
      this.renderCanvas();
    }
  }

  // Redo
  redo() {
    if (this.state.redoHistory.length > 0) {
      const nextState = this.state.redoHistory.pop();
      this.state = nextState;
      this.renderCanvas();
    }
  }

  // Save
  save() {
    this.localStorage.setItem('vectra-state', JSON.stringify(this.state));
  }

  // Export
  export() {
    const exportType = document.getElementById('export-type').value;
    if (exportType === 'png') {
      this.exportPng();
    } else if (exportType === 'svg') {
      this.exportSvg();
    } else if (exportType === 'json') {
      this.exportJson();
    }
  }

  // Export PNG
  exportPng() {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const pngStream = canvas.toDataURL('image/png').split(',')[1];
    const blob = new Blob([pngStream], { type: 'image/png' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vectra.png';
    a.click();
  }

  // Export SVG
  exportSvg() {
    const svg = document.getElementById('svg');
    const svgXml = new XMLSerializer().serializeToString(svg);
    const blob = new Blob([svgXml], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vectra.svg';
    a.click();
  }

  // Export JSON
  exportJson() {
    const json = JSON.stringify(this.state);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vectra.json';
    a.click();
  }

  // Add layer
  addLayer() {
    const layer = {
      id: Date.now(),
      name: 'New Layer',
      nodes: []
    };
    this.state.layers.push(layer);
    this.renderCanvas();
  }

  // Remove layer
  removeLayer() {
    const layerId = document.getElementById('layer-id').value;
    const layerIndex = this.state.layers.findIndex((layer) => layer.id === layerId);
    if (layerIndex !== -1) {
      this.state.layers.splice(layerIndex, 1);
      this.renderCanvas();
    }
  }

  // Show node properties
  showNodeProperties() {
    const nodeId = document.getElementById('node-id').value;
    const node = this.state.nodes.find((node) => node.id === nodeId);
    if (node) {
      document.getElementById('node-properties').innerHTML = `
        <p>Node ID: ${node.id}</p>
        <p>Node Name: ${node.name}</p>
        <p>Node Type: ${node.type}</p>
      `;
    }
  }

  // Show node editing tools
  showNodeEditingTools() {
    const nodeId = document.getElementById('node-id').value;
    const node = this.state.nodes.find((node) => node.id === nodeId);
    if (node) {
      document.getElementById('node-editing-tools').innerHTML = `
        <button id="edit-node-button">Edit Node</button>
        <button id="delete-node-button">Delete Node</button>
      `;
    }
  }
}

// Initialize the application
const vectra = new Vectra();
</script>
</body>
</html>
