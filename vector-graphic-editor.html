<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectroid</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<div class="h-screen w-screen flex flex-col bg-gray-900 text-white" id="vectroid-app">
  <!-- Top Toolbar -->
  <nav class="flex justify-between bg-gray-800 p-2 shadow-md">
    <div class="flex items-center">
      <h1 class="text-2xl font-bold mr-4">
        <i class="fas fa-cubes mr-2"></i> Vectroid
      </h1>
      <button class="btn btn-sm btn-primary mr-2">
        <i class="fas fa-file mr-2"></i> New
      </button>
      <button class="btn btn-sm btn-primary mr-2">
        <i class="fas fa-folder mr-2"></i> Open
      </button>
      <button class="btn btn-sm btn-primary mr-2">
        <i class="fas fa-save mr-2"></i> Save
      </button>
    </div>
    <div class="flex items-center">
      <button class="btn btn-sm btn-primary mr-2">
        <i class="fas fa-undo mr-2"></i> Undo
      </button>
      <button class="btn btn-sm btn-primary mr-2">
        <i class="fas fa-redo mr-2"></i> Redo
      </button>
      <button class="btn btn-sm btn-primary mr-2">
        <i class="fas fa-cog mr-2"></i> Settings
      </button>
    </div>
  </nav>

  <!-- Left Sidebar (Layers, Assets) -->
  <div class="flex flex-row h-screen">
    <div class="w-64 bg-gray-800 p-2 shadow-md">
      <h2 class="text-xl font-bold mb-2">
        <i class="fas fa-layer-group mr-2"></i> Layers
      </h2>
      <ul class="list-none mb-4">
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group mr-2"></i> Layer 1
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-layer-group mr-2"></i> Layer 2
        </li>
      </ul>
      <h2 class="text-xl font-bold mb-2">
        <i class="fas fa-database mr-2"></i> Assets
      </h2>
      <ul class="list-none mb-4">
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-image mr-2"></i> Image 1
        </li>
        <li class="py-2 border-b border-gray-700">
          <i class="fas fa-image mr-2"></i> Image 2
        </li>
      </ul>
    </div>

    <!-- Main Viewport (SVG Editor) -->
    <div class="flex-1 bg-gray-900 p-2 overflow-auto">
      <svg id="vectroid-svg" class="w-full h-full" viewBox="0 0 100 100"></svg>
    </div>

    <!-- Right Sidebar (Object Properties) -->
    <div class="w-64 bg-gray-800 p-2 shadow-md">
      <h2 class="text-xl font-bold mb-2">
        <i class="fas fa-object-ungroup mr-2"></i> Object Properties
      </h2>
      <form class="mb-4">
        <label class="block mb-2">
          <span class="text-sm font-bold">X:</span>
          <input type="number" class="w-full p-2 bg-gray-700 border border-gray-600" value="10">
        </label>
        <label class="block mb-2">
          <span class="text-sm font-bold">Y:</span>
          <input type="number" class="w-full p-2 bg-gray-700 border border-gray-600" value="20">
        </label>
        <label class="block mb-2">
          <span class="text-sm font-bold">Width:</span>
          <input type="number" class="w-full p-2 bg-gray-700 border border-gray-600" value="50">
        </label>
        <label class="block mb-2">
          <span class="text-sm font-bold">Height:</span>
          <input type="number" class="w-full p-2 bg-gray-700 border border-gray-600" value="30">
        </label>
      </form>
    </div>
  </div>

  <!-- Bottom Status Panel -->
  <footer class="bg-gray-800 p-2 shadow-md text-sm">
    <div class="flex justify-between">
      <span>
        <i class="fas fa-circle mr-2 text-green-500"></i> Connected
      </span>
      <span>
        <i class="fas fa-user mr-2"></i> User: John Doe
      </span>
      <span>
        <i class="fas fa-clock mr-2"></i> 12:34:56 PM
      </span>
    </div>
  </footer>
</div>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// Core Engine
class CoreEngine {
  constructor(canvas) {
    this.canvas = canvas;
    this.svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    this.svg.setAttribute('width', canvas.width);
    this.svg.setAttribute('height', canvas.height);
    this.canvas.appendChild(this.svg);
    this.nodes = [];
    this.selectedNode = null;
    this.addEventListener();
  }

  addEventListener() {
    this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
    this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));
  }

  handleMouseDown(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const node = this.getNodeAt(x, y);
    if (node) {
      this.selectedNode = node;
      this.svg.appendChild(node);
    } else {
      this.addNode(x, y);
    }
  }

  handleMouseMove(e) {
    if (this.selectedNode) {
      const rect = this.canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      this.selectedNode.setAttribute('cx', x);
      this.selectedNode.setAttribute('cy', y);
    }
  }

  handleMouseUp(e) {
    this.selectedNode = null;
  }

  addNode(x, y) {
    const node = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    node.setAttribute('cx', x);
    node.setAttribute('cy', y);
    node.setAttribute('r', 10);
    node.setAttribute('fill', 'black');
    this.svg.appendChild(node);
    this.nodes.push(node);
  }

  getNodeAt(x, y) {
    const node = this.nodes.find((node) => {
      const rect = node.getBBox();
      return rect.x <= x && x <= rect.x + rect.width && rect.y <= y && y <= rect.y + rect.height;
    });
    return node;
  }
}

// State Management
class State {
  constructor() {
    this.undoStack = [];
    this.redoStack = [];
    this.currentState = {};
  }

  saveState(state) {
    this.undoStack.push(this.currentState);
    this.currentState = state;
    this.redoStack = [];
  }

  undo() {
    if (this.undoStack.length > 0) {
      this.redoStack.push(this.currentState);
      this.currentState = this.undoStack.pop();
    }
  }

  redo() {
    if (this.redoStack.length > 0) {
      this.undoStack.push(this.currentState);
      this.currentState = this.redoStack.pop();
    }
  }
}

// Redux Store
class ReduxStore {
  constructor() {
    this.state = new State();
    this.SaveChanges();
  }

  dispatch(action) {
    switch (action.type) {
      case 'SAVE_STATE':
        this.state.saveState(action.state);
        break;
      case 'UNDO':
        this.state.undo();
        break;
      case 'REDO':
        this.state.redo();
        break;
      default:
        break;
    }
    this.SaveChanges();
  }

  SaveChanges() {
    localStorage.setItem('vectroid-state', JSON.stringify(this.state));
  }

  LoadChanges() {
    const state = localStorage.getItem('vectroid-state');
    if (state) {
      this.state = JSON.parse(state);
    }
  }
}

// Export Engines
class ExportEngine {
  constructor() {}

  exportPNG(svg) {
    const serializer = new XMLSerializer();
    const xml = serializer.serializeToString(svg);
    const url = 'data:image/png;base64,' + btoa(xml);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'vectroid.png';
    link.click();
  }

  exportSVG(svg) {
    const serializer = new XMLSerializer();
    const xml = serializer.serializeToString(svg);
    const url = 'data:text/plain;base64,' + btoa(xml);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'vectroid.svg';
    link.click();
  }

  exportJSON(svg) {
    const nodes = Array.prototype.slice.call(svg.children);
    const data = nodes.map((node) => {
      return {
        type: node.tagName,
        x: node.getAttribute('x'),
        y: node.getAttribute('y'),
      };
    });
    const json = JSON.stringify(data);
    const url = 'data:text/plain;base64,' + btoa(json);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'vectroid.json';
    link.click();
  }
}

// Main Application
class Vectroid {
  constructor() {
    this.canvas = document.getElementById('canvas');
    this.coreEngine = new CoreEngine(this.canvas);
    this.reduxStore = new ReduxStore();
    this.exportEngine = new ExportEngine();
    this.reduxStore.LoadChanges();
  }

  run() {
    document.getElementById('undo').addEventListener('click', () => this.reduxStore.dispatch({ type: 'UNDO' }));
    document.getElementById('redo').addEventListener('click', () => this.reduxStore.dispatch({ type: 'REDO' }));
    document.getElementById('export-png').addEventListener('click', () => this.exportEngine.exportPNG(this.coreEngine.svg));
    document.getElementById('export-svg').addEventListener('click', () => this.exportEngine.exportSVG(this.coreEngine.svg));
    document.getElementById('export-json').addEventListener('click', () => this.exportEngine.exportJSON(this.coreEngine.svg));
  }
}

// Initialize Application
const vectroid = new Vectroid();
vectroid.run();
</script>
</body>
</html>
