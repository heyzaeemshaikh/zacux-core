<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectra</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="h-screen bg-gray-900 text-gray-100 dark:bg-[#090d16]">
  <!-- Top Toolbar -->
  <header class="flex justify-between items-center py-4 bg-gray-800 dark:bg-[#060b14] border-b border-gray-700">
    <div class="flex items-center">
      <h1 class="text-2xl font-bold mr-4">Vectra</h1>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-md mr-2">
        <i class="fas fa-file fa-lg mr-2"></i> New
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-md mr-2">
        <i class="fas fa-open fa-lg mr-2"></i> Open
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-md mr-2">
        <i class="fas fa-save fa-lg mr-2"></i> Save
      </button>
    </div>
    <div class="flex items-center">
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-md mr-2">
        <i class="fas fa-undo fa-lg mr-2"></i> Undo
      </button>
      <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-md mr-2">
        <i class="fas fa-redo fa-lg mr-2"></i> Redo
      </button>
    </div>
  </header>

  <!-- Left Sidebar -->
  <aside class="w-64 bg-gray-800 dark:bg-[#060b14] h-screen p-4 border-r border-gray-700">
    <h2 class="text-xl font-bold mb-4">Layers</h2>
    <ul>
      <li class="py-2 border-b border-gray-700">
        <i class="fas fa-layer-group fa-lg mr-2"></i> Layer 1
      </li>
      <li class="py-2 border-b border-gray-700">
        <i class="fas fa-layer-group fa-lg mr-2"></i> Layer 2
      </li>
      <li class="py-2 border-b border-gray-700">
        <i class="fas fa-layer-group fa-lg mr-2"></i> Layer 3
      </li>
    </ul>
    <h2 class="text-xl font-bold mt-4 mb-4">Assets</h2>
    <ul>
      <li class="py-2 border-b border-gray-700">
        <i class="fas fa-image fa-lg mr-2"></i> Image 1
      </li>
      <li class="py-2 border-b border-gray-700">
        <i class="fas fa-image fa-lg mr-2"></i> Image 2
      </li>
      <li class="py-2 border-b border-gray-700">
        <i class="fas fa-image fa-lg mr-2"></i> Image 3
      </li>
    </ul>
  </aside>

  <!-- Main Viewport -->
  <main class="h-screen p-4 flex-1 overflow-y-auto">
    <div class="h-full w-full bg-gray-100 dark:bg-[#0a0f1d] border border-gray-300 rounded-md">
      <!-- Canvas editing area -->
      <svg class="h-full w-full" viewBox="0 0 100 100">
        <!-- SVG content goes here -->
      </svg>
    </div>
  </main>

  <!-- Bottom Status Panel -->
  <footer class="bg-gray-800 dark:bg-[#060b14] py-2 border-t border-gray-700">
    <div class="flex justify-between items-center">
      <div class="ml-4">
        <span class="text-sm">Selection: </span>
        <span class="text-sm font-bold">None</span>
      </div>
      <div class="mr-4">
        <span class="text-sm">Snap Guides: </span>
        <span class="text-sm font-bold">On</span>
      </div>
    </div>
  </footer>

  <!-- Floating Side Panels -->
  <div class="fixed top-0 right-0 p-4">
    <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-md">
      <i class="fas fa-ellipsis-v fa-lg mr-2"></i> More
    </button>
  </div>
  <div class="fixed bottom-0 right-0 p-4">
    <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-md">
      <i class="fas fa-share fa-lg mr-2"></i> Share
    </button>
  </div>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// Vectra Engine
class VectraEngine {
  constructor(canvas, toolbar, sidebar, statusPanel) {
    this.canvas = canvas;
    this.toolbar = toolbar;
    this.sidebar = sidebar;
    this.statusPanel = statusPanel;
    this.state = {
      nodes: [],
      selectedNode: null,
      undoHistory: [],
      redoHistory: []
    };
    this.loadState();
    this.bindEventListeners();
  }

  bindEventListeners() {
    this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
    this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));
    this.toolbar.addEventListener('click', (e) => this.handleToolbarClick(e));
    this.sidebar.addEventListener('click', (e) => this.handleSidebarClick(e));
  }

  handleMouseDown(e) {
    const node = this.getNodeAtPosition(e.clientX, e.clientY);
    if (node) {
      this.selectNode(node);
    } else {
      this.createNode(e.clientX, e.clientY);
    }
  }

  handleMouseMove(e) {
    if (this.state.selectedNode) {
      this.moveNode(this.state.selectedNode, e.clientX, e.clientY);
    }
  }

  handleMouseUp(e) {
    this.state.selectedNode = null;
  }

  handleToolbarClick(e) {
    if (e.target.dataset.action === 'undo') {
      this.undo();
    } else if (e.target.dataset.action === 'redo') {
      this.redo();
    } else if (e.target.dataset.action === 'export') {
      this.exportFile(e.target.dataset.format);
    }
  }

  handleSidebarClick(e) {
    if (e.target.dataset.action === 'add-layer') {
      this.addLayer();
    } else if (e.target.dataset.action === 'add-asset') {
      this.addAsset();
    }
  }

  getNodeAtPosition(x, y) {
    for (const node of this.state.nodes) {
      if (node.x <= x && node.x + node.width >= x && node.y <= y && node.y + node.height >= y) {
        return node;
      }
    }
    return null;
  }

  createNode(x, y) {
    const node = {
      x: x,
      y: y,
      width: 100,
      height: 100
    };
    this.state.nodes.push(node);
    this.saveState();
  }

  selectNode(node) {
    this.state.selectedNode = node;
    this.saveState();
  }

  moveNode(node, x, y) {
    node.x = x;
    node.y = y;
    this.saveState();
  }

  addLayer() {
    const layer = {
      name: 'New Layer',
      nodes: []
    };
    this.state.layers.push(layer);
    this.saveState();
  }

  addAsset() {
    const asset = {
      name: 'New Asset',
      nodes: []
    };
    this.state.assets.push(asset);
    this.saveState();
  }

  undo() {
    if (this.state.undoHistory.length > 0) {
      const state = this.state.undoHistory.pop();
      this.state = state;
      this.saveState();
    }
  }

  redo() {
    if (this.state.redoHistory.length > 0) {
      const state = this.state.redoHistory.pop();
      this.state = state;
      this.saveState();
    }
  }

  exportFile(format) {
    if (format === 'png') {
      this.exportPng();
    } else if (format === 'svg') {
      this.exportSvg();
    } else if (format === 'json') {
      this.exportJson();
    }
  }

  exportPng() {
    const canvas = document.createElement('canvas');
    canvas.width = this.canvas.width;
    canvas.height = this.canvas.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(this.canvas, 0, 0);
    const png = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = png;
    a.download = 'vectra.png';
    a.click();
  }

  exportSvg() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', this.canvas.width);
    svg.setAttribute('height', this.canvas.height);
    for (const node of this.state.nodes) {
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', node.x);
      rect.setAttribute('y', node.y);
      rect.setAttribute('width', node.width);
      rect.setAttribute('height', node.height);
      svg.appendChild(rect);
    }
    const svgXml = new XMLSerializer().serializeToString(svg);
    const a = document.createElement('a');
    a.href = 'data:image/svg+xml,' + encodeURIComponent(svgXml);
    a.download = 'vectra.svg';
    a.click();
  }

  exportJson() {
    const json = JSON.stringify(this.state);
    const a = document.createElement('a');
    a.href = 'data:application/json,' + encodeURIComponent(json);
    a.download = 'vectra.json';
    a.click();
  }

  saveState() {
    localStorage.setItem('vectra-state', JSON.stringify(this.state));
    this.state.undoHistory.push(JSON.parse(JSON.stringify(this.state)));
    this.state.redoHistory = [];
  }

  loadState() {
    const state = localStorage.getItem('vectra-state');
    if (state) {
      this.state = JSON.parse(state);
    }
  }
}

// Initialize Vectra Engine
const canvas = document.getElementById('canvas');
const toolbar = document.getElementById('toolbar');
const sidebar = document.getElementById('sidebar');
const statusPanel = document.getElementById('status-panel');
const vectra = new VectraEngine(canvas, toolbar, sidebar, statusPanel);
</script>
</body>
</html>
