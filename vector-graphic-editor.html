<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VectorForge</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="h-screen w-screen bg-[#090d16] text-white flex flex-col">
  <!-- Top Toolbar -->
  <div class="flex justify-between items-center p-4 border-b border-gray-600">
    <h1 class="text-2xl font-bold">VectorForge</h1>
    <div class="flex space-x-4">
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded" title="New Project">
        <i class="fas fa-file fa-lg"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded" title="Open Project">
        <i class="fas fa-folder-open fa-lg"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded" title="Save Project">
        <i class="fas fa-save fa-lg"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded" title="Undo">
        <i class="fas fa-undo fa-lg"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded" title="Redo">
        <i class="fas fa-redo fa-lg"></i>
      </button>
    </div>
  </div>

  <!-- Main Workspace -->
  <div class="flex flex-1">
    <!-- Left Sidebar -->
    <div class="w-64 bg-gray-800 p-4 border-r border-gray-600">
      <h2 class="text-xl font-bold mb-4">Layers</h2>
      <ul>
        <li class="py-2 border-b border-gray-600">
          <i class="fas fa-layer-group fa-lg mr-2"></i>
          Layer 1
        </li>
        <li class="py-2 border-b border-gray-600">
          <i class="fas fa-layer-group fa-lg mr-2"></i>
          Layer 2
        </li>
        <li class="py-2 border-b border-gray-600">
          <i class="fas fa-layer-group fa-lg mr-2"></i>
          Layer 3
        </li>
      </ul>
    </div>

    <!-- Main Viewport -->
    <div class="flex-1 p-4">
      <div class="relative w-full h-full">
        <canvas class="absolute top-0 left-0 w-full h-full" id="canvas"></canvas>
        <div class="absolute top-0 left-0 w-full h-full flex justify-center items-center">
          <div class="bg-gray-800 p-4 rounded">
            <h2 class="text-xl font-bold mb-4">Node Editing Tools</h2>
            <div class="flex space-x-4">
              <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded" title="Select">
                <i class="fas fa-mouse-pointer fa-lg"></i>
              </button>
              <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded" title="Draw">
                <i class="fas fa-pen fa-lg"></i>
              </button>
              <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded" title="Eraser">
                <i class="fas fa-eraser fa-lg"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Sidebar -->
    <div class="w-64 bg-gray-800 p-4 border-l border-gray-600">
      <h2 class="text-xl font-bold mb-4">Properties</h2>
      <div class="space-y-4">
        <div class="flex space-x-4">
          <label class="text-lg font-bold">Fill Color:</label>
          <input type="color" class="w-12 h-12">
        </div>
        <div class="flex space-x-4">
          <label class="text-lg font-bold">Stroke Color:</label>
          <input type="color" class="w-12 h-12">
        </div>
        <div class="flex space-x-4">
          <label class="text-lg font-bold">Stroke Width:</label>
          <input type="number" class="w-12 h-12">
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Status Panel -->
  <div class="flex justify-between items-center p-4 border-t border-gray-600">
    <div class="flex space-x-4">
      <span class="text-lg font-bold">Zoom:</span>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded" title="Zoom In">
        <i class="fas fa-plus fa-lg"></i>
      </button>
      <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded" title="Zoom Out">
        <i class="fas fa-minus fa-lg"></i>
      </button>
    </div>
    <div class="flex space-x-4">
      <span class="text-lg font-bold">Collaborators:</span>
      <span class="text-lg font-bold">2</span>
    </div>
  </div>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
class VectorForge {
  constructor() {
    this.initUI();
    this.initStateStore();
    this.initEventListeners();
    this.initExportServer();
  }

  initUI() {
    this.topToolbar = document.createElement('div');
    this.leftSidebar = document.createElement('div');
    this.mainViewport = document.createElement('div');
    this.rightSidebar = document.createElement('div');
    this.bottomStatusPanel = document.createElement('div');
    this.canvas = document.createElement('canvas');
    this.ctx = this.canvas.getContext('2d');

    document.body.appendChild(this.topToolbar);
    document.body.appendChild(this.leftSidebar);
    document.body.appendChild(this.mainViewport);
    document.body.appendChild(this.rightSidebar);
    document.body.appendChild(this.bottomStatusPanel);
    this.mainViewport.appendChild(this.canvas);

    this.topToolbar.innerHTML = `
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
    `;

    this.leftSidebar.innerHTML = `
      <div id="layer-management"></div>
    `;

    this.rightSidebar.innerHTML = `
      <div id="properties"></div>
      <div id="settings"></div>
    `;

    this.bottomStatusPanel.innerHTML = `
      <div id="status"></div>
    `;
  }

  initStateStore() {
    this.state = {
      nodes: [],
      history: [],
      redoHistory: []
    };

    this.loadStateFromLocalStorage();
  }

  loadStateFromLocalStorage() {
    const storedState = localStorage.getItem('vector-forge-state');
    if (storedState) {
      this.state = JSON.parse(storedState);
    }
  }

  saveStateToLocalStorage() {
    localStorage.setItem('vector-forge-state', JSON.stringify(this.state));
  }

  initEventListeners() {
    this.canvas.addEventListener('mousedown', (e) => {
      this.handleMouseDown(e);
    });

    this.canvas.addEventListener('mousemove', (e) => {
      this.handleMouseMove(e);
    });

    this.canvas.addEventListener('mouseup', (e) => {
      this.handleMouseUp(e);
    });

    document.getElementById('undo').addEventListener('click', () => {
      this.undo();
    });

    document.getElementById('redo').addEventListener('click', () => {
      this.redo();
    });

    window.addEventListener('keydown', (e) => {
      this.handleKeyDown(e);
    });

    window.addEventListener('keyup', (e) => {
      this.handleKeyUp(e);
    });
  }

  handleMouseDown(e) {
    const node = this.getNodeAtPosition(e.clientX, e.clientY);
    if (node) {
      this.startEditingNode(node);
    } else {
      this.startCreatingNode();
    }
  }

  handleMouseMove(e) {
    if (this.editingNode) {
      this.updateNodePosition(this.editingNode, e.clientX, e.clientY);
    }
  }

  handleMouseUp(e) {
    if (this.editingNode) {
      this.stopEditingNode();
    }
  }

  undo() {
    if (this.state.history.length > 0) {
      const lastState = this.state.history.pop();
      this.state.redoHistory.push(lastState);
      this.updateState(lastState);
    }
  }

  redo() {
    if (this.state.redoHistory.length > 0) {
      const nextState = this.state.redoHistory.pop();
      this.state.history.push(nextState);
      this.updateState(nextState);
    }
  }

  updateState(state) {
    this.state.nodes = state.nodes;
    this.renderCanvas();
  }

  renderCanvas() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    for (const node of this.state.nodes) {
      this.renderNode(node);
    }
  }

  renderNode(node) {
    this.ctx.beginPath();
    this.ctx.arc(node.x, node.y, node.radius, 0, 2 * Math.PI);
    this.ctx.fillStyle = node.color;
    this.ctx.fill();
  }

  getNodeAtPosition(x, y) {
    for (const node of this.state.nodes) {
      if (Math.hypot(node.x - x, node.y - y) < node.radius) {
        return node;
      }
    }
    return null;
  }

  startEditingNode(node) {
    this.editingNode = node;
  }

  stopEditingNode() {
    this.editingNode = null;
  }

  updateNodePosition(node, x, y) {
    node.x = x;
    node.y = y;
    this.renderCanvas();
  }

  startCreatingNode() {
    const node = {
      x: this.canvas.width / 2,
      y: this.canvas.height / 2,
      radius: 10,
      color: 'black'
    };
    this.state.nodes.push(node);
    this.editingNode = node;
    this.renderCanvas();
  }

  initExportServer() {
    this.exportServer = new ExportServer();
  }

  handleKeyDown(e) {
    if (e.key === 's') {
      this.saveFile();
    }
  }

  handleKeyUp(e) {}

  saveFile() {
    const fileName = prompt('Enter file name');
    const fileExtension = fileName.split('.').pop();
    if (fileExtension === 'png' || fileExtension === 'jpg' || fileExtension === 'svg' || fileExtension === 'json') {
      this.exportServer.exportFile(fileName, fileExtension, this.state);
    }
  }
}

class ExportServer {
  exportFile(fileName, fileExtension, state) {
    if (fileExtension === 'png' || fileExtension === 'jpg') {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 800;
      canvas.height = 600;
      for (const node of state.nodes) {
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius, 0, 2 * Math.PI);
        ctx.fillStyle = node.color;
        ctx.fill();
      }
      const url = canvas.toDataURL();
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      a.click();
    } else if (fileExtension === 'svg') {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.width.baseVal.value = 800;
      svg.height.baseVal.value = 600;
      for (const node of state.nodes) {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.cx.baseVal.value = node.x;
        circle.cy.baseVal.value = node.y;
        circle.r.baseVal.value = node.radius;
        circle.fill = node.color;
        svg.appendChild(circle);
      }
      const serializer = new XMLSerializer();
      const url = 'data:application/svg+xml,' + encodeURIComponent(serializer.serializeToString(svg));
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      a.click();
    } else if (fileExtension === 'json') {
      const url = 'data:application/json,' + encodeURIComponent(JSON.stringify(state));
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      a.click();
    }
  }
}

const vectorForge = new VectorForge();
</script>
</body>
</html>
