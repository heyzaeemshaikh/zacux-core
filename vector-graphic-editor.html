<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectra</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .panel-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-indigo-600 selection:text-white">

<body class="bg-gray-900 text-gray-100 h-screen flex flex-col">
  <!-- Header Toolbar -->
  <header class="flex justify-between items-center py-4 bg-gray-800 border-b border-gray-700">
    <div class="flex items-center">
      <h1 class="text-2xl font-bold mr-4"><i class="fas fa-vector-square fa-lg mr-2"></i>Vectra</h1>
      <button class="btn btn-undo mr-2" title="Undo"><i class="fas fa-undo fa-lg"></i></button>
      <button class="btn btn-redo mr-2" title="Redo"><i class="fas fa-redo fa-lg"></i></button>
    </div>
    <div class="flex items-center">
      <button class="btn btn-zoom-in mr-2" title="Zoom In"><i class="fas fa-search-plus fa-lg"></i></button>
      <button class="btn btn-zoom-out mr-2" title="Zoom Out"><i class="fas fa-search-minus fa-lg"></i></button>
      <button class="btn btn-zoom-reset mr-4" title="Reset Zoom"><i class="fas fa-expand fa-lg"></i></button>
      <select class="form-select w-48 mr-4" id="selection-tool">
        <option value="select">Select</option>
        <option value="rectangle">Rectangle</option>
        <option value="ellipse">Ellipse</option>
      </select>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex flex-grow overflow-hidden">
    <!-- Sidebar: Layer Management -->
    <aside class="w-64 bg-gray-800 border-r border-gray-700 p-4">
      <h2 class="text-lg font-bold mb-2">Layers</h2>
      <ul id="layer-list">
        <!-- Layer items will be generated dynamically -->
      </ul>
      <button class="btn btn-add-layer mt-4" title="Add Layer"><i class="fas fa-layer-plus fa-lg"></i> Add Layer</button>
    </aside>

    <!-- Main Viewport: SVG Rendering and Editing -->
    <section class="flex-grow overflow-auto p-4">
      <svg id="svg-viewport" class="w-full h-full" xmlns="http://www.w3.org/2000/svg"></svg>
    </section>

    <!-- Sidebar: Node Editing and Object Properties -->
    <aside class="w-64 bg-gray-800 border-l border-gray-700 p-4">
      <h2 class="text-lg font-bold mb-2">Node Editing</h2>
      <form id="node-edit-form">
        <!-- Node editing form fields will be generated dynamically -->
      </form>
      <h2 class="text-lg font-bold mt-4 mb-2">Object Properties</h2>
      <form id="object-properties-form">
        <!-- Object properties form fields will be generated dynamically -->
      </form>
    </aside>
  </main>

  <!-- Status Bar -->
  <footer class="flex justify-between items-center py-2 bg-gray-800 border-t border-gray-700">
    <div class="flex items-center">
      <span id="status-message" class="text-gray-400 mr-4">Ready</span>
      <button class="btn btn-refresh mr-4" title="Refresh"><i class="fas fa-sync fa-lg"></i></button>
    </div>
    <div class="flex items-center">
      <button class="btn btn-export mr-4" title="Export"><i class="fas fa-file-export fa-lg"></i> Export</button>
      <button class="btn btn-save mr-4" title="Save"><i class="fas fa-save fa-lg"></i> Save</button>
    </div>
  </footer>

  <!-- Floating Panels -->
  <div id="floating-panels" class="fixed bottom-0 right-0 mb-4 mr-4 z-10">
    <div class="flex flex-col items-end">
      <button class="btn btn-open-layers mb-2" title="Open Layers Panel"><i class="fas fa-layer-group fa-lg"></i></button>
      <button class="btn btn-open-node-editing mb-2" title="Open Node Editing Panel"><i class="fas fa-edit fa-lg"></i></button>
      <button class="btn btn-open-object-properties mb-2" title="Open Object Properties Panel"><i class="fas fa-cog fa-lg"></i></button>
    </div>
  </div>
</body>

<script>
// ==================== ZACUX AUTONOMOUS SYNTHESIZED ENGINE ====================
// Core Engine
class CoreEngine {
  constructor() {
    this.state = {
      nodes: [],
      paths: [],
      imgUrl: '',
      imgType: '',
      undoHistory: [],
      redoHistory: []
    };

    this.toolbar = document.getElementById('toolbar');
    this.sidebar = document.getElementById('sidebar');
    this.viewport = document.getElementById('viewport');
    this.statusPanel = document.getElementById('status-panel');

    this.canvas = document.createElement('canvas');
    this.ctx = this.canvas.getContext('2d');
    this.canvas.width = 800;
    this.canvas.height = 600;
    this.viewport.appendChild(this.canvas);

    this.initEventListeners();
    this.initUndoRedo();
  }

  initEventListeners() {
    this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
    this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));

    this.toolbar.addEventListener('click', (e) => this.handleToolbarClick(e));

    this.sidebar.addEventListener('click', (e) => this.handleSidebarClick(e));
  }

  initUndoRedo() {
    this.state.undoHistory = [];
    this.state.redoHistory = [];

    this.toolbar.querySelector('#undo').addEventListener('click', () => this.undo());
    this.toolbar.querySelector('#redo').addEventListener('click', () => this.redo());
  }

  handleMouseDown(e) {
    const x = e.clientX - this.canvas.offsetLeft;
    const y = e.clientY - this.canvas.offsetTop;

    this.state.nodes.push({ x, y });
    this.state.undoHistory.push(JSON.parse(JSON.stringify(this.state)));
    this.render();
  }

  handleMouseMove(e) {
    const x = e.clientX - this.canvas.offsetLeft;
    const y = e.clientY - this.canvas.offsetTop;

    this.state.nodes[this.state.nodes.length - 1].x = x;
    this.state.nodes[this.state.nodes.length - 1].y = y;
    this.render();
  }

  handleMouseUp() {
    this.state.redoHistory = [];
  }

  handleToolbarClick(e) {
    if (e.target.id === 'undo') {
      this.undo();
    } else if (e.target.id === 'redo') {
      this.redo();
    } else if (e.target.id === 'export') {
      this.exportFile();
    }
  }

  handleSidebarClick(e) {
    if (e.target.id === 'add-node') {
      this.addNode();
    }
  }

  addNode() {
    this.state.nodes.push({ x: 0, y: 0 });
    this.state.undoHistory.push(JSON.parse(JSON.stringify(this.state)));
    this.render();
  }

  undo() {
    if (this.state.undoHistory.length > 0) {
      this.state.redoHistory.push(JSON.parse(JSON.stringify(this.state)));
      this.state = this.state.undoHistory.pop();
      this.render();
    }
  }

  redo() {
    if (this.state.redoHistory.length > 0) {
      this.state.undoHistory.push(JSON.parse(JSON.stringify(this.state)));
      this.state = this.state.redoHistory.pop();
      this.render();
    }
  }

  render() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    this.state.nodes.forEach((node) => {
      this.ctx.beginPath();
      this.ctx.arc(node.x, node.y, 5, 0, 2 * Math.PI);
      this.ctx.fillStyle = 'black';
      this.ctx.fill();
    });
  }

  exportFile() {
    const fileType = document.getElementById('file-type').value;
    const fileExtension = fileType === 'png'? 'png' : fileType === 'jpg'? 'jpg' : fileType === 'svg'? 'svg' : 'json';

    if (fileType === 'png' || fileType === 'jpg') {
      this.canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `image.${fileExtension}`;
        a.click();
        URL.revokeObjectURL(url);
      }, `image/${fileType}`);
    } else if (fileType === 'svg') {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('width', this.canvas.width);
      svg.setAttribute('height', this.canvas.height);

      this.state.nodes.forEach((node) => {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', node.x);
        circle.setAttribute('cy', node.y);
        circle.setAttribute('r', 5);
        circle.setAttribute('fill', 'black');
        svg.appendChild(circle);
      });

      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(svg);

      const blob = new Blob([svgString], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `image.${fileExtension}`;
      a.click();
      URL.revokeObjectURL(url);
    } else if (fileType === 'json') {
      const json = JSON.stringify(this.state);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `data.${fileExtension}`;
      a.click();
      URL.revokeObjectURL(url);
    }
  }

  save() {
    localStorage.setItem('vectra-state', JSON.stringify(this.state));
  }

  load() {
    const savedState = localStorage.getItem('vectra-state');
    if (savedState) {
      this.state = JSON.parse(savedState);
      this.render();
    }
  }
}

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
   .then((registration) => {
      console.log('Service worker registered:', registration);
    })
   .catch((error) => {
      console.error('Service worker registration failed:', error);
    });
}

// Web Worker
if (typeof Worker!== 'undefined') {
  const worker = new Worker('worker.js');
  worker.onmessage = (event) => {
    console.log('Received message from worker:', event.data);
  };
  worker.postMessage('Initialize');
} else {
  console.log('Web workers are not supported in this browser.');
}

// Initialize Core Engine
const coreEngine = new CoreEngine();
coreEngine.load();

// Add Event Listener for BeforeUnload
window.addEventListener('beforeunload', () => {
  coreEngine.save();
});
</script>
</body>
</html>
